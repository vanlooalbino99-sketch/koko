<div id="splash" aria-hidden="true">
  <svg class="splash-trend" viewBox="0 0 160 90" role="img" aria-label="Chargement">
    <defs>
      <linearGradient id="splashTrendFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/>
        <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
      <filter id="splashTrendGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <polygon class="st-area" points="8,78 40,52 62,62 100,30 118,40 150,10 150,88 8,88" fill="url(#splashTrendFill)"/>
    <g filter="url(#splashTrendGlow)">
      <polyline class="st-line" pathLength="100" points="8,78 40,52 62,62 100,30 118,40 150,10"/>
      <polygon class="st-arrow" points="154.4,5.9 151.9,17.8 142.3,7.6"/>
    </g>
  </svg>
  <div class="splash-brand">BLACKSTART <span>AI</span></div>
</div>
<div id="root"></div>
