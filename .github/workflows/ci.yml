name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Application autonome (un seul fichier HTML)
        run: npm run build
      - name: Tests du serveur
        run: npm test
      - name: Tests du serveur sur PostgreSQL (comme Supabase)
        run: npm test
        env:
          BS_TEST_PG: postgres://postgres:test@localhost:5432/postgres
      - name: Navigateur pour le test de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Test de bout en bout (deux sessions en parallèle)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: Blackstart_CRM_App
          path: dist/Blackstart_CRM_App.html

  site:
    name: Site internet (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
