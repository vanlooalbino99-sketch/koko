<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Blackstart Formation — CRM de l'organisme de formation</title>
<meta name="description" content="CRM de démonstration pour organismes de formation : demandes et devis, financements OPCO / CPF / France Travail, sessions et taux de remplissage, suivi Qualiopi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236D28D9'/%3E%3Cpath d='M5 13.5 16 8l11 5.5-11 5.5z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M10 16.5V21c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============ Tokens ============ */
:root{
  --bg:#f5f4f1;--surface:#ffffff;--surface-2:#f1efeb;--surface-3:#e7e4de;--border:#e3dfd8;--border-strong:#cdc7bd;
  --text:#1b1916;--muted:#615b53;
  --brand:#6d28d9;--brand-ink:#ffffff;--brand-text:#6d28d9;--brand-soft:rgba(109,40,217,.10);
  --ok:#157a3f;--ok-soft:#e2f2e7;--warn:#975400;--warn-soft:#fcefd9;--danger:#c42b1c;--danger-soft:#fbe6e3;
  --r:12px;--r-sm:8px;
  --shadow:0 1px 2px rgba(28,25,22,.05),0 3px 12px rgba(28,25,22,.05);
  --shadow-lg:0 18px 50px rgba(28,25,22,.18),0 3px 10px rgba(28,25,22,.08);
  --overlay:rgba(24,21,18,.36);
  --f-opco:#2b5fd9;--f-opco-bg:#e5ecfc;--f-opco-ink:#1b3d8f;
  --f-cpf:#0f8a7a;--f-cpf-bg:#dcf2ee;--f-cpf-ink:#0b5b51;
  --f-ft:#d2513f;--f-ft-bg:#fbe7e3;--f-ft-ink:#93291c;
  --f-ent:#c88a06;--f-ent-bg:#fbf0d4;--f-ent-ink:#644600;
  --f-perso:#8b8378;--f-perso-bg:#efece7;--f-perso-ink:#47423b;
  --c-cov:#0f8a7a;--c-rac:#8b8378;--c-total:#d3cdc3;
  --ch-acc:#2f9e5b;--ch-pend:#e2a33a;--ch-ref:#d2604f;--ch-grid:#ebe8e2;
  --skel:#ebe8e2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111214;--surface:#1a1b1f;--surface-2:#222429;--surface-3:#2b2e34;--border:#2f3238;--border-strong:#41454d;
    --text:#ecebe8;--muted:#a6a39c;
    --brand:#a78bfa;--brand-ink:#170b33;--brand-text:#b39cfb;--brand-soft:rgba(167,139,250,.16);
    --ok:#5cc98a;--ok-soft:#173424;--warn:#f0b452;--warn-soft:#3a2d14;--danger:#ff8273;--danger-soft:#42201c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
    --shadow-lg:0 18px 50px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.35);
    --overlay:rgba(0,0,0,.55);
    --f-opco:#6f9cf2;--f-opco-bg:#1d2a46;--f-opco-ink:#b3cbf8;
    --f-cpf:#3cbfa9;--f-cpf-bg:#133430;--f-cpf-ink:#9fe3d6;
    --f-ft:#f08a7c;--f-ft-bg:#42201c;--f-ft-ink:#f8c1b9;
    --f-ent:#eec53a;--f-ent-bg:#352c11;--f-ent-ink:#f3da82;
    --f-perso:#a6a39c;--f-perso-bg:#2b2e34;--f-perso-ink:#d8d5ce;
    --c-cov:#3cbfa9;--c-rac:#8e8a83;--c-total:#3a3d44;
    --ch-acc:#4cc27a;--ch-pend:#e9b04e;--ch-ref:#e8796a;--ch-grid:#2a2d33;
    --skel:#25272c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214;--surface:#1a1b1f;--surface-2:#222429;--surface-3:#2b2e34;--border:#2f3238;--border-strong:#41454d;
  --text:#ecebe8;--muted:#a6a39c;
  --brand:#a78bfa;--brand-ink:#170b33;--brand-text:#b39cfb;--brand-soft:rgba(167,139,250,.16);
  --ok:#5cc98a;--ok-soft:#173424;--warn:#f0b452;--warn-soft:#3a2d14;--danger:#ff8273;--danger-soft:#42201c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.55);
  --f-opco:#6f9cf2;--f-opco-bg:#1d2a46;--f-opco-ink:#b3cbf8;
  --f-cpf:#3cbfa9;--f-cpf-bg:#133430;--f-cpf-ink:#9fe3d6;
  --f-ft:#f08a7c;--f-ft-bg:#42201c;--f-ft-ink:#f8c1b9;
  --f-ent:#eec53a;--f-ent-bg:#352c11;--f-ent-ink:#f3da82;
  --f-perso:#a6a39c;--f-perso-bg:#2b2e34;--f-perso-ink:#d8d5ce;
  --c-cov:#3cbfa9;--c-rac:#8e8a83;--c-total:#3a3d44;
  --ch-acc:#4cc27a;--ch-pend:#e9b04e;--ch-ref:#e8796a;--ch-grid:#2a2d33;
  --skel:#25272c;
  color-scheme:dark;
}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
h1,h2,h3{letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.spacer{flex:1}
.ok-t{color:var(--ok)}
.danger-t{color:var(--danger)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;vertical-align:middle}
.hidden{display:none!important}

/* ============ Layout ============ */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:232px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;min-height:66px}
.logo{width:32px;height:32px;flex:none}
.logo .lg-bg{fill:var(--brand)}
.logo .lg-fg{stroke:var(--brand-ink);fill:none}
.logo .lg-dot{fill:var(--brand-ink)}
.brand-name{font-weight:700;font-size:15px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border:0;background:transparent;border-radius:9px;color:var(--muted);font-weight:500;text-align:left;position:relative;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.active{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.nav-btn .ns{display:none}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.nav-sep{height:1px;background:var(--border);margin:8px 6px}
.me{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}
.me-name{font-weight:600;font-size:13px;line-height:1.2}
.me-role{font-size:12px;color:var(--muted);line-height:1.25}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.demo-bar{display:flex;align-items:center;gap:6px 10px;padding:5px 24px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.demo-pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand-text);font-weight:700;font-size:12px}
.demo-bar button{border:0;background:transparent;color:var(--brand-text);font-weight:600;padding:3px 6px;border-radius:6px;min-height:28px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.demo-bar button:hover{background:var(--brand-soft)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-brand{display:none;align-items:center;gap:8px;font-weight:700;min-width:0}
.top-brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-btn{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;height:40px;padding:0 10px 0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);text-align:left;transition:border-color .15s}
.search-btn:hover{border-color:var(--border-strong)}
.search-btn .sb-text{flex:1}
.kbd{font-size:11.5px;font-weight:600;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
#view{padding:22px 24px 56px;width:100%;min-width:0}
.view-enter{animation:viewIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--shadow-lg)}
  .brand,.me,.nav-sep{display:none}
  .nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px;gap:0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-btn{flex:1 0 52px;flex-direction:column;justify-content:center;height:56px;gap:3px;padding:0 2px;font-size:11.5px;text-align:center}
  .nav-btn .nl{display:none}
  .nav-btn .ns{display:block;white-space:nowrap}
  .nav-badge{position:absolute;top:4px;left:calc(50% + 3px);margin:0;min-width:17px;height:17px;font-size:11px;padding:0 4px}
  .top{padding:0 16px;height:56px}
  .top-brand{display:flex;flex:1}
  .search-btn{flex:none;width:40px;padding:0;justify-content:center}
  .search-btn .sb-text,.search-btn .kbd{display:none}
  .top .btn-new-label,.top .help-btn{display:none}
  .demo-bar{padding:4px 16px;flex-wrap:nowrap}
  .top .spacer{display:none}
  .dr-top .chip{display:none}
  #view{padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
}

/* ============ Controls ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s,filter .15s}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:0;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:30px;height:30px;border-radius:7px}
@media (pointer:coarse){.btn.sm{height:40px}.icon-btn.sm{width:40px;height:40px}}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;max-width:100%;overflow-x:auto}
.seg button{height:32px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg.sm button{height:28px;padding:0 10px}
.input{height:40px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);min-width:0;width:100%}
.input.sm{height:32px;padding:0 8px;font-size:13px;border-radius:8px}
select.input{padding-right:6px}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--brand-text);box-shadow:0 0 0 3px var(--brand-soft)}
input[type="checkbox"]{accent-color:var(--brand);width:18px;height:18px;margin:0;cursor:pointer}
input[type="color"]{width:44px;height:40px;padding:2px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.lbl .input{color:var(--text);font-weight:400;font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.search-field{position:relative;flex:1;min-width:180px;max-width:340px}
.search-field .ic{position:absolute;left:11px;top:11px;color:var(--muted);pointer-events:none}
.search-field .input{padding-left:36px}

/* ============ Cards & heads ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;flex-wrap:wrap}
.card-h h2{font-size:14.5px;margin:0;font-weight:650}
.card-b{padding:6px 16px 16px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.view-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
.view-head .sub{margin:4px 0 0;color:var(--muted)}
.view-head .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input:not(.search-field .input){width:auto}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:1100px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--brand-soft);color:var(--brand-text);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.fund{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--fb);color:var(--fi)}
.fund i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--fc)}
.fund-mini{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:6px;font-size:11.5px;font-weight:650;white-space:nowrap;background:var(--fb);color:var(--fi)}
.fund.opco,.fund-mini.opco{--fc:var(--f-opco);--fb:var(--f-opco-bg);--fi:var(--f-opco-ink)}
.fund.cpf,.fund-mini.cpf{--fc:var(--f-cpf);--fb:var(--f-cpf-bg);--fi:var(--f-cpf-ink)}
.fund.ft,.fund-mini.ft{--fc:var(--f-ft);--fb:var(--f-ft-bg);--fi:var(--f-ft-ink)}
.fund.ent,.fund-mini.ent{--fc:var(--f-ent);--fb:var(--f-ent-bg);--fi:var(--f-ent-ink)}
.fund.perso,.fund-mini.perso{--fc:var(--f-perso);--fb:var(--f-perso-bg);--fi:var(--f-perso-ink)}
.due{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.due.late{background:var(--danger-soft);color:var(--danger)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.auto{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand-text);font-size:11.5px;font-weight:700}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--c,var(--muted)) 22%,var(--surface));color:var(--text);border:1px solid color-mix(in srgb,var(--c,var(--muted)) 40%,var(--surface))}
.av.lg{width:34px;height:34px;font-size:12.5px}
.stage-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--text);font-size:12px;font-weight:650;white-space:nowrap}
.stage-pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}

/* ============ Dashboard ============ */
.kpis{display:grid;grid-template-columns:1.75fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-label{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi-num{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-sub{font-size:12.5px;color:var(--muted)}
.kpi-split{display:flex;gap:18px;align-items:stretch}
.kpi-part{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.kpi-vsep{width:1px;background:var(--border)}
.kpi-key{border-color:color-mix(in srgb,var(--brand) 35%,var(--border));background:linear-gradient(180deg,var(--brand-soft),transparent 70%),var(--surface)}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;flex-wrap:wrap}
.delta .muted{font-weight:500}
.delta.good{color:var(--ok)}.delta.bad{color:var(--danger)}.delta.flat{color:var(--muted)}
@media (max-width:1180px){.kpis{grid-template-columns:1fr 1fr}.kpi-key{grid-column:1/-1}}
@media (max-width:420px){.kpi{padding:14px}.kpi-num{font-size:28px}.kpi-split{gap:12px}}
.chart-box{width:100%;min-height:220px}
.chart-box svg{display:block}
.chart-box .grid{stroke:var(--ch-grid);stroke-width:1}
.chart-box .axis{fill:var(--muted);font-size:11.5px}
.chart-box .val{fill:var(--text);font-size:11.5px;font-weight:600}
.chart-box .wk{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 35ms)}
.chart-box .wk:hover rect{filter:brightness(1.08)}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
.f-acc{fill:var(--ch-acc)}.f-pend{fill:var(--ch-pend)}.f-ref{fill:var(--ch-ref)}.f-brand{fill:var(--brand)}
.f-cov{fill:var(--c-cov)}.f-rac{fill:var(--c-rac)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.acc{background:var(--ch-acc)}.sw.pend{background:var(--ch-pend)}.sw.ref{background:var(--ch-ref)}.sw.brand{background:var(--brand)}
.sw.cov{background:var(--c-cov)}.sw.rac{background:var(--c-rac)}.sw.total{background:var(--c-total)}
.insight{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:10px 12px;border-radius:9px;background:var(--surface-2);font-size:13px}
.insight .ic{color:var(--brand-text);margin-top:2px}
.todo{list-style:none;margin:0;padding:0}
.todo-i{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);min-height:52px}
.todo-i:last-child{border-bottom:0}
.chk-wrap{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:-10px}
.todo-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:7px 0;border:0;background:transparent;text-align:left;border-radius:6px}
.todo-main:hover .todo-title{color:var(--brand-text)}
.todo-title{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.todo-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.al-group{padding:6px 0 10px}
.al-group + .al-group{border-top:1px solid var(--border);padding-top:12px}
.al-h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px;margin-bottom:6px}
.al-h .n{min-width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);padding:0 6px}
.al-h.hot .n{background:var(--danger-soft);color:var(--danger)}
.al-h.warm .n{background:var(--warn-soft);color:var(--warn)}
.al-h .ic{color:var(--muted)}
.al-h.hot .ic{color:var(--danger)}.al-h.warm .ic{color:var(--warn)}
.al-i{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0}
.al-i .al-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 0;display:flex;flex-direction:column}
.al-i .al-main b{font-weight:600}
.al-i .al-main:hover b{color:var(--brand-text)}
.al-i .al-main span{font-size:12.5px;color:var(--muted)}
.al-none{font-size:13px;color:var(--muted);padding:2px 0 4px}
.sbar{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:34px;border:0;background:transparent;width:100%;text-align:left;padding:0;border-radius:6px}
.sbar:hover .sbar-l{color:var(--brand-text)}
.sbar-l{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar-track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.sbar-fill{display:block;height:100%;border-radius:5px;background:var(--c);transform-origin:left;animation:growX .7s cubic-bezier(.2,.8,.2,1) both}
.sbar-v{font-size:12.5px;color:var(--muted);white-space:nowrap}
.weighted{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px}
.weighted b{font-size:16px}

/* ============ Kanban ============ */
.kanban{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;height:calc(100vh - 236px);height:calc(100dvh - 236px);min-height:440px;overscroll-behavior-x:contain}
.col{flex:0 0 290px;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;min-height:0;position:relative;overflow:hidden;transition:background .15s,box-shadow .15s}
.col::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.col-head{position:sticky;top:0;display:flex;align-items:center;gap:7px;padding:13px 12px 9px;background:var(--surface-2);z-index:1}
.col-head h2{font-size:13px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-count{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.col-total{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.col-body{flex:1;overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col.drop-hover{background:color-mix(in srgb,var(--c) 10%,var(--surface-2));box-shadow:inset 0 0 0 2px var(--c)}
.drop-empty{border:1.5px dashed var(--border-strong);border-radius:10px;padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 9px 9px 11px;box-shadow:0 1px 0 var(--border);cursor:grab;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:5px;position:relative}
.dcard:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.dcard.dragging{opacity:.45;transform:rotate(1deg)}
.dcard-top{display:flex;align-items:center;gap:6px;min-height:22px}
.wt{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.dcard-title{font-size:13.5px;font-weight:600;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard-foot{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.dcard-foot .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.board-empty{margin-bottom:12px}
@media (max-width:820px){.kanban{height:calc(100dvh - 300px);min-height:400px}.col{flex-basis:min(84vw,300px)}}

/* ============ Tables ============ */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 12px;height:40px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl th .th-btn{border:0;background:transparent;color:inherit;font:inherit;padding:4px 0;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.tbl th.num,.tbl td.num{text-align:right}
.tbl td{height:44px;padding:0 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl .c-main b{font-weight:600}
.tbl .c-main small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.tbl .c-main{line-height:1.25}
.num{font-variant-numeric:tabular-nums}
@media (max-width:720px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tfoot{display:block;width:100%}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .tbl td{display:block;height:auto;padding:0;border:0;white-space:normal;max-width:none;font-size:13px}
  .tbl td.num{text-align:right}
  .tbl td.c-main{grid-column:1/-1;font-size:14px}
  .tbl td[data-label]::before{content:attr(data-label) " : ";color:var(--muted);font-size:12px}
  .tbl td.m-hide{display:none}
  .tbl tbody tr:hover td{background:transparent}
}

/* ============ Drawer ============ */
.drawer-backdrop{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(100%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s;z-index:51;display:flex;flex-direction:column}
body.drawer-open .drawer{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
body.drawer-open .drawer-backdrop{opacity:1;pointer-events:auto}
.dr-head{padding:12px 16px 12px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.dr-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dr-title .f-v{font-size:19px;font-weight:700;line-height:1.25;white-space:normal;letter-spacing:-.01em}
.dr-sub{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.dr-actions{display:flex;gap:8px;flex-wrap:wrap}
.dr-actions select{width:auto;max-width:170px}
.dr-body{flex:1;overflow-y:auto;padding:4px 20px 40px}
.dr-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.dr-kpis div{background:var(--surface-2);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.dr-kpis span{font-size:12px;color:var(--muted)}
.dr-kpis b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-sec{padding:14px 0;border-bottom:1px solid var(--border)}
.dr-sec:last-child{border-bottom:0}
.dr-sec > h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 14px}
.f{min-width:0}
.f.wide{grid-column:1/-1}
.f-l{display:block;font-size:12.5px;color:var(--muted);margin:3px 0 0}
.f-v{display:block;width:calc(100% + 8px);min-height:34px;text-align:left;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;margin-left:-8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .12s,border-color .12s}
button.f-v:hover{background:var(--surface-2);border-color:var(--border)}
.f-v.is-empty{color:var(--muted);font-weight:400;font-style:italic}
.f-v.multi{white-space:pre-wrap}
.f.ro .f-v{cursor:default}
.f .input{height:34px;margin-top:0}
.f textarea.input{height:auto;min-height:80px}
.list-mini{display:flex;flex-direction:column}
.lm-i{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--border);padding:4px 0}
.lm-i:last-child{border-bottom:0}
.lm-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:2px 0;display:flex;flex-direction:column}
.lm-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm-main span{font-size:12.5px;color:var(--muted)}
.quick-add{display:flex;gap:6px;margin-top:8px}
.quick-add .input{height:36px}
.composer{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface-2);margin-bottom:12px}
.composer textarea{border:0;background:transparent;width:100%;resize:vertical;min-height:58px;padding:6px 4px;outline:none}
.composer .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:1px;background:var(--border)}
.tl-i{display:flex;gap:12px;padding:6px 0;position:relative}
.tl-ic{width:31px;height:31px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--muted);z-index:1}
.tl-i.t-status .tl-ic{color:var(--brand-text);background:var(--brand-soft);border-color:transparent}
.tl-i.t-visit .tl-ic{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.tl-body{flex:1;min-width:0;padding-top:4px}
.tl-text{white-space:pre-wrap;overflow-wrap:anywhere}
.tl-i.t-status .tl-text{font-size:13px;color:var(--muted)}
.tl-meta{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:520px){.demo-bar .db-l{display:none}.drawer{width:100%;border-left:0}.dr-body{padding:4px 16px 40px}.dr-head{padding:12px 12px 12px 16px}}

/* ============ Modals, menus, palette, toasts ============ */
.modal-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 16px;background:var(--overlay);animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.modal{width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal.lg{max-width:840px}
.m-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--border)}
.m-head h2{font-size:16px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
.m-body{padding:16px 20px;overflow-y:auto}
.m-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
@media (max-width:560px){.modal-wrap{padding:0;align-items:stretch}.modal,.modal.lg{max-width:none;max-height:none;height:100%;border-radius:0}.form-grid{grid-template-columns:1fr}}
.menu{position:fixed;z-index:75;width:230px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow-lg);padding:5px;animation:pop .14s}
.menu-h{font-size:12px;font-weight:700;color:var(--muted);padding:6px 9px 4px;text-transform:uppercase;letter-spacing:.05em}
.menu-i{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;padding:0 9px;border:0;background:transparent;border-radius:7px;text-align:left;font-size:13.5px}
.menu-i:hover,.menu-i:focus-visible{background:var(--surface-2)}
.menu-i[aria-current="true"]{font-weight:650}
.menu-i .ic:last-child{margin-left:auto;color:var(--brand-text)}
.palette-wrap{position:fixed;inset:0;z-index:70;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;padding:11vh 16px 16px;animation:fade .12s}
.palette{width:100%;max-width:640px;max-height:72vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.pal-top{position:relative;border-bottom:1px solid var(--border)}
.pal-top .ic{position:absolute;left:16px;top:17px;color:var(--muted)}
.pal-input{width:100%;height:54px;border:0;padding:0 16px 0 46px;font-size:15.5px;background:transparent;outline:none}
.pal-list{overflow-y:auto;padding:6px}
.pal-group{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
.pal-item{display:flex;align-items:center;gap:11px;min-height:42px;padding:6px 10px;border-radius:8px;cursor:pointer}
.pal-item .ic{color:var(--muted)}
.pal-item.active{background:var(--brand-soft)}
.pal-item.active .pi-label,.pal-item.active .ic{color:var(--brand-text)}
.pi-label{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-sub{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pal-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex-wrap:wrap}
.pal-empty{padding:28px 16px;text-align:center;color:var(--muted)}
#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 8px 8px 14px;background:var(--text);color:var(--bg);border-radius:10px;box-shadow:var(--shadow-lg);animation:toastIn .25s cubic-bezier(.2,.8,.2,1);font-weight:500;max-width:min(440px,calc(100vw - 32px))}
.toast.out{animation:toastOut .2s forwards}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);font-weight:700;border-radius:7px;height:30px;padding:0 10px}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@media (max-width:820px){#toasts{left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));align-items:stretch}}

/* ============ Financement ============ */
.disclaimer{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);padding:9px 12px;border-radius:9px;background:var(--surface-2);margin:0}
.disclaimer .ic{margin-top:1px}
.sim-sec{margin-bottom:16px}
.sim-sec:last-child{margin-bottom:0}
.sim-l{font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.sr-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sr-nums > div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface-2);min-width:0}
.sr-l{font-size:12.5px;color:var(--muted);font-weight:600}
.sr-nums b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.sr-s{font-size:12px;color:var(--muted)}
.sr-nums .sr-rac{background:color-mix(in srgb,var(--brand) 9%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 45%,transparent)}
.sr-nums .sr-rac b{font-size:24px}
.compact .sr-nums b{font-size:15px}.compact .sr-nums .sr-rac b{font-size:17px}.compact .sr-nums > div{padding:8px 9px}
.stack-chart{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.sc-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.sc-row > span{font-size:12.5px;color:var(--muted);font-weight:600}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--surface-2);transform-origin:left;animation:growX .6s cubic-bezier(.2,.8,.2,1) both}
.stack.big{height:44px;border-radius:10px}
.stack > span{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;color:var(--surface)}
.seg-cov{background:var(--c-cov)}.seg-rac{background:var(--c-rac)}.seg-total{background:var(--c-total)}
.sr-tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 8px}
.sr-tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)}
.sr-tbl td{padding:7px 6px;border-bottom:1px solid var(--border)}
.sr-tbl .num{text-align:right;white-space:nowrap}
.sr-tbl tfoot td{font-weight:700;border-bottom:0}
.sr-note{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin:6px 0}
.sr-note .ic{margin-top:1px}
.sr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ============ Tâches ============ */
.task-add{display:grid;grid-template-columns:minmax(0,1fr) 150px 220px auto;gap:8px;padding:12px;margin-bottom:14px}
@media (max-width:900px){.task-add{grid-template-columns:1fr 1fr}.task-add .ta-title{grid-column:1/-1}}
.t-group{margin-bottom:14px}
.t-group-h{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;font-weight:650;font-size:14px}
.t-group-h .n{min-width:22px;height:22px;border-radius:11px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.t-group.late .t-group-h{color:var(--danger)}
.t-group.late .t-group-h .n{background:var(--danger-soft);color:var(--danger)}
.task-row{display:flex;align-items:center;gap:8px;min-height:54px;padding:4px 12px 4px 16px;border-top:1px solid var(--border)}
.task-row.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:6px 0}
.t-title{font-weight:550}
.t-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.t-meta a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:2px}
.t-meta a:hover{color:var(--brand-text)}
.task-row .t-side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.task-row{flex-wrap:wrap;padding-left:8px}.task-row .t-side{width:100%;justify-content:flex-start;padding-left:44px;padding-bottom:6px}}

/* ============ Réglages ============ */
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.set-grid{grid-template-columns:minmax(0,1fr)}}
.set-grid .full{grid-column:1/-1}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);background:var(--c);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}
@media (pointer:coarse){.swatch{width:40px;height:40px}}
.st-row{display:grid;grid-template-columns:auto minmax(0,1fr) 86px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.st-row:last-child{border-bottom:0}
.st-row .st-type{font-size:12px;color:var(--muted);white-space:nowrap}
.st-move{display:flex;gap:2px}
.pct-in{display:flex;align-items:center;gap:4px}
.pct-in .input{text-align:right;padding:0 6px}
.user-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.user-row:last-child{border-bottom:0}
@media (max-width:560px){.user-row{grid-template-columns:auto minmax(0,1fr)}.user-row .ur-role{grid-column:2}}
.fin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.fin-grid{grid-template-columns:minmax(0,1fr)}}
.danger-zone{display:flex;gap:8px;flex-wrap:wrap}
.preview-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border:1px dashed var(--border-strong);border-radius:10px;margin-top:12px}

/* ============ Import ============ */
.dropzone{border:1.5px dashed var(--border-strong);border-radius:12px;padding:16px;text-align:center;color:var(--muted);margin-bottom:10px;transition:background .15s,border-color .15s}
.dropzone.over{background:var(--brand-soft);border-color:var(--brand-text)}
.map-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;align-items:center;margin-bottom:14px}
.map-grid .src{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-tbl{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.preview-tbl table{border-collapse:collapse;font-size:12.5px;width:100%}
.preview-tbl th,.preview-tbl td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.preview-tbl th{color:var(--muted);background:var(--surface-2)}

/* ============ IA ============ */
.ai-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.ai-controls .lbl{flex:1;min-width:200px}
.ai-out{position:relative}
.ai-out textarea{min-height:320px;font-size:13.5px;line-height:1.55}
.ai-out .sk-lines{position:absolute;inset:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.ai-note{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:auto}

/* ============ Empty, skeleton, tour ============ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 16px;color:var(--muted)}
.empty svg{width:132px;height:96px}
.empty h3{color:var(--text);margin:4px 0 0;font-size:15px}
.empty p{margin:0;max-width:380px;font-size:13.5px}
.e-line{stroke:var(--border-strong);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.e-fill{fill:var(--surface-2)}
.e-acc{stroke:var(--brand);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.e-accf{fill:var(--brand)}
.sk{background:linear-gradient(90deg,var(--skel) 0%,var(--surface-2) 50%,var(--skel) 100%);background-size:200% 100%;animation:sk 1.15s infinite linear;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.tour-ring{position:fixed;z-index:65;border-radius:11px;box-shadow:0 0 0 3px var(--brand);pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--brand-soft),0 0 0 3px var(--brand)}}
.tour-bubble{position:fixed;z-index:66;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow-lg);padding:14px 16px 12px;animation:pop .2s}
.tour-bubble h3{margin:4px 0 6px;font-size:15px}
.tour-bubble p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.tb-step{font-size:12px;font-weight:700;color:var(--brand-text);text-transform:uppercase;letter-spacing:.05em}
.tb-actions{display:flex;gap:6px;align-items:center}
.help-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ============ Impression ============ */
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#f3f3f3;--text:#000;--muted:#444;--border:#ccc;--shadow:none;--shadow-lg:none}
  body{background:var(--bg)}
  .side,.top,.demo-bar,.toolbar,#toasts,.tour-ring,.tour-bubble,.no-print,.composer,.quick-add,.dr-actions,.icon-btn,.sr-actions,.seg,.menu{display:none!important}
  .app{display:block}
  #view{padding:0}
  .kanban{height:auto;flex-wrap:wrap;overflow:visible}
  .col{flex:1 1 30%;break-inside:avoid}
  .card,.dcard{box-shadow:none;break-inside:avoid}
  body.drawer-open .app,body.drawer-open .drawer-backdrop{display:none!important}
  body.drawer-open .drawer{position:static;transform:none;visibility:visible;width:auto;box-shadow:none;border:0;display:block}
  .dr-body{overflow:visible}
}

.fill{position:relative;display:flex;height:10px;border-radius:5px;background:var(--surface-2);overflow:visible;box-shadow:inset 0 0 0 1px var(--border)}
.fill.big{height:14px;border-radius:7px}
.fill > i{display:block;height:100%;transform-origin:left;animation:growX .7s cubic-bezier(.2,.8,.2,1) both}
.fill > i:first-child{border-radius:5px 0 0 5px}
.fill .f-in{background:var(--ok)}
.fill.warn .f-in{background:var(--warn)}
.fill.danger .f-in{background:var(--danger)}
.fill .f-opt{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ok) 45%,transparent) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent)}
.fill.warn .f-opt{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 45%,transparent) 0 4px,transparent 4px 8px)}
.fill.danger .f-opt{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--danger) 40%,transparent) 0 4px,transparent 4px 8px)}
.fill .f-min{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text);opacity:.55}
.fill-meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:5px}
.fill-meta b{color:var(--text);font-variant-numeric:tabular-nums}
.sess-list{display:flex;flex-direction:column}
.sess-row{display:grid;grid-template-columns:58px minmax(0,1.5fr) minmax(170px,1fr) 128px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.sess-row:hover{background:var(--surface-2)}
.sess-row:first-child{border-top:0}
.sess-date{display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);line-height:1.1}
.sess-date b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.sess-date span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.sess-date.soon{border-color:color-mix(in srgb,var(--danger) 45%,var(--border));background:var(--danger-soft)}
.sess-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.sess-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-main > span{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sess-st{display:flex;justify-content:flex-end}
.st-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.st-chip.ok{background:var(--ok-soft);color:var(--ok)}
.st-chip.warn{background:var(--warn-soft);color:var(--warn)}
.st-chip.danger{background:var(--danger-soft);color:var(--danger)}
.st-chip.brand{background:var(--brand-soft);color:var(--brand-text)}
@media (max-width:820px){.sess-row{grid-template-columns:52px minmax(0,1fr);gap:8px 12px}.sess-row .sess-fill,.sess-row .sess-st{grid-column:2}.sess-st{justify-content:flex-start}}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.tcard:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.tc-top{display:flex;align-items:center;gap:10px;min-width:0}
.tc-ic{width:36px;height:36px;border-radius:10px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.tc-title{font-weight:650;line-height:1.25;min-width:0}
.tc-meta{font-size:12.5px;color:var(--muted)}
.tc-tags{display:flex;gap:6px;flex-wrap:wrap}
.tc-foot{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px;margin-top:auto}
.tc-foot .ic{color:var(--warn)}
.srow{display:grid;grid-template-columns:minmax(0,180px) minmax(80px,1fr) 46px;gap:12px;align-items:center;min-height:44px;border:0;background:transparent;width:100%;text-align:left;padding:0;border-radius:6px}
.srow:hover .srow-l b{color:var(--brand-text)}
.srow-l{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.srow-l b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-l span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-v{font-size:12.5px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:420px){.srow{grid-template-columns:118px minmax(0,1fr) 46px}}
.alert-band{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--text);margin-bottom:14px;border:1px solid color-mix(in srgb,var(--danger) 25%,transparent)}

.alert-band .ab-i > span{flex:1;min-width:200px;font-size:13px}
.fund-bars{display:flex;flex-direction:column;gap:2px}

.check{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 8px;margin:0 -8px;border-radius:8px;width:calc(100% + 16px);text-align:left;border:0;background:transparent}

.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0;color:var(--surface);background:var(--surface)}

.check.miss .box{border-color:var(--danger)}
.check .ct{flex:1;min-width:0;display:flex;flex-direction:column}

.check .qs{margin-left:auto}
.qs{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:650;white-space:nowrap;border:0;background:var(--surface-2);color:var(--muted)}
.qs.ok{background:var(--ok-soft);color:var(--ok)}
.qs.miss{background:var(--danger-soft);color:var(--danger)}
button.qs{cursor:pointer}
button.qs:hover{filter:brightness(.97);box-shadow:0 0 0 1px var(--border-strong)}
.gauge{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:2px 0 8px}
.gauge > i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gauge.ok > i{background:var(--ok)}.gauge.warn > i{background:var(--warn)}.gauge.danger > i{background:var(--danger)}
.ring{width:96px;height:96px;flex-shrink:0}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c0)}}
.ring text{font-size:19px;font-weight:700;fill:var(--text);font-variant-numeric:tabular-nums}
.q-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.q-head > div{flex:1;min-width:220px}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.q-tbl td{max-width:220px}
.q-tbl td.qc{text-align:center}

.score{display:inline-flex;align-items:center;gap:4px;font-weight:650;font-variant-numeric:tabular-nums}

</style>

function hexToRgb(h){ h = String(h || "").replace("#",""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); if (h.length !== 6 || isNaN(n)) return [109,40,217]; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

}

/* Remplissage des sessions : inscrits (étape « Inscrit ») + options (demandes en cours rattachées) */
function fillOf(s){
  const ds = activeDeals().filter(d => d.sessionId === s.id);
  const ins = ds.filter(d => d.stageId === "inscrit"), opt = ds.filter(isOpen);
  return {in:sum(ins, d => d.trainees), opt:sum(opt, d => d.trainees), ins, opts:opt, ca:sum(ins, d => d.amount)};
}
function sessStatus(s){
  const t0 = today(), f = fillOf(s), n = diffDays(t0, s.startDate);
  if (endOf(s) < t0) return {k:"done", label:"Réalisée", cls:"brand"};
  if (s.startDate <= t0) return {k:"live", label:"En cours", cls:"brand"};
  if (f.in >= s.capacity) return {k:"full", label:"Complète", cls:"ok"};
  if (f.in >= s.minimum) return {k:"ok", label:"Confirmée", cls:"ok"};
  if (n <= 15) return {k:"risk", label:"Sous le seuil", cls:"danger"};
  return {k:"open", label:"Inscriptions ouvertes", cls:""};
}
const upcomingSessions = () => liveSessions().filter(s => endOf(s) >= today()).sort((a,b) => a.startDate.localeCompare(b.startDate));
const pastSessions = () => liveSessions().filter(s => endOf(s) < today()).sort((a,b) => b.startDate.localeCompare(a.startDate));
const atRiskSessions = () => upcomingSessions().filter(s => s.startDate > today() && diffDays(today(), s.startDate) <= 15 && fillOf(s).in < s.minimum);
const sessLabel = s => { const t = trOf(s); return `${t.short} — ${fmtDateShort(s.startDate)}`; };

/* Suivi Qualiopi : pièces dues selon l'avancement de la session */
function qState(d, k){
  if (d.q && d.q[k]) return "ok";
  if (d.stageId !== "inscrit") return "todo";
  const item = QCHECK.find(i => i.k === k), s = sessOf(d), t0 = today();
  if (!item) return "todo";
  if (item.due === "inscription") return "miss";
  if (!s) return "todo";
  if (item.due === "j7") return diffDays(t0, s.startDate) <= (+STATE.settings.convocDays || 7) ? "miss" : "todo";
  return endOf(s) < t0 ? "miss" : "todo";
}
const qMissing = d => QCHECK.filter(i => qState(d, i.k) === "miss");
const qDone = d => QCHECK.filter(i => d.q && d.q[i.k]).length;
const qDossiers = () => activeDeals().filter(d => d.stageId === "inscrit");
function qStats(){
  const ds = qDossiers(), ko = ds.filter(d => qMissing(d).length);
  return {total:ds.length, ok:ds.length - ko.length, ko, rate:ds.length ? (ds.length - ko.length) / ds.length : 1, missing:sum(ds, d => qMissing(d).length)};
}

/* Aide au financement : prise en charge estimée ou accordée, reste à charge */
function finCalc(d){
  const F = STATE.settings.fin, t = trOf(d), price = Math.max(0, +d.amount || 0), n = Math.max(1, +d.trainees || 1), hours = +d.hours || t.hours || 7;
  let est = 0; const notes = [];
  if (d.funding === "opco"){
    est = Math.min(price, hours * n * (+F.opcoRate || 0));
    notes.push(`Estimation OPCO : ${NF0.format(hours)} h × ${plural(n, "stagiaire")} × ${fmtEUR(F.opcoRate)}/h, dans la limite du prix. Demande de prise en charge à déposer avant le début de la formation.`);
  } else if (d.funding === "cpf"){
    const bal = Math.max(0, +d.cpfBalance || 0), forfait = Math.min(price, +F.cpfForfait || 0);
    est = Math.max(0, Math.min(price - forfait, bal));
    notes.push(`Participation forfaitaire obligatoire de ${fmtEUR(forfait)} à la charge du titulaire (montant indexé chaque année, à vérifier).`);
    if (!bal) notes.push("Renseignez les droits CPF disponibles du stagiaire pour affiner l'estimation.");
    else if (bal < price - forfait) notes.push(`Droits CPF insuffisants (${fmtEUR(bal)}) : un abondement de l'employeur ou de France Travail peut compléter.`);
    notes.push("Inscription et validation par le stagiaire sur Mon Compte Formation.");
  } else if (d.funding === "ft"){
    est = Math.min(price, +F.aifMax || 0);
    notes.push(`Aide individuelle à la formation (AIF) jusqu'à ${fmtEUR(F.aifMax)}, sous réserve de validation du projet par le conseiller France Travail.`);
  } else if (d.funding === "ent"){
    notes.push("Plan de développement des compétences : entreprise de 50 salariés et plus, la formation est financée sur le budget de l'entreprise.");
  } else {
    notes.push("Financement personnel : paiement en trois fois sans frais possible.");
  }
  const accorded = d.fundingStatus === "Accordée" && ["opco","cpf","ft"].includes(d.funding);
  const refused = d.fundingStatus === "Refusée";
  const cover = refused ? 0 : accorded && d.cover !== "" && d.cover != null && isFinite(+d.cover) ? Math.min(price, +d.cover) : Math.round(est);
  if (refused) notes.unshift("Prise en charge refusée : le reste à charge porte sur la totalité du prix.");
  return {price, cover, rac:Math.max(0, price - cover), est:Math.round(est), accorded, pct:price ? cover / price : 0, notes};
}

/* Relances automatiques J+5 / J+12 sur les devis envoyés sans réponse */
function syncAutoRelances(){
  const r1 = +STATE.settings.relance1 || 5, r2 = +STATE.settings.relance2 || 12;
  STATE.deals.forEach(d => {
    const live = !d.archived && d.stageId === "devis" && d.quoteDate;
    [["relance_1", r1], ["relance_2", r2]].forEach(([kind, delay]) => {
      const t = STATE.tasks.find(x => x.dealId === d.id && x.kind === kind && !x.archived);
      if (live){
        const due = addDays(d.quoteDate, delay);
        const title = `Relance devis J+${delay} — ${clientLabel(d)} (${trOf(d).short})`;
        if (!t) STATE.tasks.push({id:uid("t"), title, dueDate:due, done:false, dealId:d.id, ownerId:d.ownerId, auto:true, kind, createdAt:new Date().toISOString()});
        else if (!t.done){ t.dueDate = due; t.title = title; }
      } else if (t && !t.done){
        STATE.tasks.splice(STATE.tasks.indexOf(t), 1);
      }
    });
  });
}

/* Indicateurs */
function periodRange(p, back){ const n = +p; const end = addDays(today(), -n * (back || 0)); return {start:addDays(end, -(n-1)), end}; }
const inRange = (s, r) => !!s && s >= r.start && s <= r.end;
function metrics(r){
  const ds = activeDeals(), t0 = today();
  const enrolled = ds.filter(d => d.stageId === "inscrit" && inRange(d.enrolledAt, r));
  const started = liveSessions().filter(s => inRange(s.startDate, r) && s.startDate <= t0);
  const capT = sum(started, s => s.capacity), inT = sum(started, s => fillOf(s).in);
  const ended = new Set(liveSessions().filter(s => inRange(endOf(s), r) && endOf(s) < t0).map(s => s.id));
  const trainedDeals = ds.filter(d => d.stageId === "inscrit" && ended.has(d.sessionId));
  const evals = trainedDeals.filter(d => d.q && d.q.evalChaud && +d.evalScore > 0);
  const wEval = sum(evals, d => d.trainees);
  const funded = ds.filter(d => d.fundingStatus === "Accordée" && inRange(d.fundedAt, r));
  return {
    ca:sum(enrolled, d => d.amount), enrolled:enrolled.length,
    fill:capT ? inT / capT : null, sessions:started.length, seats:inT, capacity:capT,
    trained:sum(trainedDeals, d => d.trainees), trainedSessions:ended.size,
    sat:wEval ? sum(evals, d => d.evalScore * d.trainees) / wEval : null, evals:evals.length,
    funded:sum(funded, d => finCalc(d).cover), fundedN:funded.length,
  };
}
function speedInsight(){
  const dec = activeDeals().filter(d => d.quoteDate && (d.stageId === "inscrit" || d.stageId === "perdu"));
  const g = fast => { const x = dec.filter(d => (diffDays(dateOfIso(d.createdAt), d.quoteDate) <= 2) === fast); const a = x.filter(d => d.stageId === "inscrit").length; return {n:x.length, rate:x.length ? a / x.length : null}; };
  return {fast:g(true), slow:g(false)};
}
function openTasks(){ return STATE.tasks.filter(t => !t.archived && !t.done && !(t.dealId && (dealById(t.dealId) || {}).archived)); }
function urgentTasks(){ const t0 = today(); return openTasks().filter(t => t.dueDate <= t0).sort((a,b) => a.dueDate.localeCompare(b.dueDate)); }
function nextTask(d){ return openTasks().filter(t => t.dealId === d.id).sort((a,b) => a.dueDate.localeCompare(b.dueDate))[0]; }
function alerts(){
  const ds = activeDeals(), t0 = today(), r1 = +STATE.settings.relance1 || 5;
  return {
    sessions:atRiskSessions(),
    quotes:ds.filter(d => d.stageId === "devis" && d.quoteDate && diffDays(d.quoteDate, t0) >= r1).sort((a,b) => a.quoteDate.localeCompare(b.quoteDate)),
    qualiopi:qDossiers().filter(d => qMissing(d).length).sort((a,b) => qMissing(b).length - qMissing(a).length),
  };
}
function activitiesFor(f){
  const dealIds = new Set(f.dealIds || (f.dealId ? [f.dealId] : []));
  return STATE.activities.filter(a => (a.dealId && dealIds.has(a.dealId)) || (f.companyId && a.companyId === f.companyId && !a.dealId) || (f.contactId && a.contactId === f.contactId) || (f.sessionId && a.sessionId === f.sessionId && !a.dealId)).sort((a,b) => b.date.localeCompare(a.date));
}

function delta(cur, prev, kind, lowerBetter){

  if (cur == null || prev == null || (kind === "pct" && !prev)) return `<div class="delta flat">${ic("minus",14)}<span>pas de référence</span>${lbl}</div>`;
  let diff, txt;

  else if (kind === "pts"){ diff = (cur - prev) * 100; txt = NF1.format(Math.abs(diff)) + " pts"; }
  else { diff = cur - prev; txt = NF1F.format(Math.abs(diff)) + " pt"; }
  if (Math.abs(diff) < 0.05) return `<div class="delta flat">${ic("minus",14)}<span>stable</span>${lbl}</div>`;
  const up = diff > 0, good = lowerBetter ? !up : up;

function niceStep(max, ticks){ const raw = max / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / mag; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag; }
function drawWeekChart(){
  const box = $("#week-chart"); if (!box) return;
  const W = Math.max(260, box.clientWidth), H = 220, pl = 42, pr = 6, pt = 18, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const start = addDays(mondayOf(today()), -77);
  const weeks = Array.from({length:12}, (_, i) => ({s:addDays(start, 7*i), e:addDays(start, 7*i + 6), acc:0, pend:0, ref:0, ca:0}));
  activeDeals().forEach(d => {
    const c = dateOfIso(d.createdAt), w = weeks.find(w => c >= w.s && c <= w.e);
    if (w){ if (d.stageId === "perdu") w.ref++; else if (d.stageId === "inscrit") w.acc++; else w.pend++; }
    if (d.stageId === "inscrit" && d.enrolledAt){ const w2 = weeks.find(w => d.enrolledAt >= w.s && d.enrolledAt <= w.e); if (w2) w2.ca += +d.amount || 0; }
  });
  const series = UI.chartMode === "demandes" ? [["acc","f-acc","inscrites"],["pend","f-pend","en cours"],["ref","f-ref","perdues"]] : [["ca","f-brand","CA formations"]];
  const tot = weeks.map(w => sum(series, s => w[s[0]]));
  const mx = Math.max(...tot);
  if (!mx){ box.innerHTML = empty("chart", "Pas encore de données", "Les demandes reçues et les inscriptions s'afficheront ici semaine après semaine."); return; }
  let step = niceStep(mx, 4); if (UI.chartMode === "demandes") step = Math.max(1, Math.ceil(step));
  const top = step * Math.ceil(mx / step), y = v => pt + ih - v / top * ih, slot = iw / 12, bw = Math.min(30, slot * 0.6);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${pl - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${UI.chartMode === "demandes" ? NF0.format(v) : fmtK(v).replace(" k€","k")}</text>`;
  weeks.forEach((w, i) => {
    const x = pl + slot * i + (slot - bw) / 2; let base = pt + ih, rects = "";
    series.forEach(s => { const v = w[s[0]]; if (!v) return; const h = v / top * ih; rects += `<rect class="${s[1]}" x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, h - 1.5).toFixed(1)}" rx="3"/>`; base -= h; });

function animateCounts(){

  $$("[data-count]").forEach(el => {

    const t0 = performance.now(), dur = 750;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = f(target * e); if (p < 1) requestAnimationFrame(step); else el.textContent = f(target); };

  });
}

function renderTasksList(){

function startEdit(btn){

  const [kind, id, key] = wrap.dataset.edit.split("|"), ent = getEnt(kind, id), def = FIELDS[kind][key]; if (!ent || !def) return;
  const cur = ent[key];

  if (def.type === "select"){ input = document.createElement("select"); input.innerHTML = fieldOptions(kind, ent, key).map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(cur) ? "selected" : ""}>${esc(o[1])}</option>`).join(""); }
  else if (def.type === "textarea"){ input = document.createElement("textarea"); input.rows = 4; input.value = cur || ""; }
  else { input = document.createElement("input"); input.type = def.type === "date" ? "date" : (def.type === "number" || def.type === "money") ? "number" : "text"; input.value = cur == null ? "" : cur; if (input.type === "number") input.step = "any"; }

  const finish = commit => {
    if (done) return; done = true;

      let v = input.value;
      if (def.type === "number" || def.type === "money") v = v === "" ? "" : parseNum(v); else if (def.type !== "textarea") v = v.trim();
      if (String(v) !== String(cur == null ? "" : cur)){
        ent[key] = v; ent.updatedAt = new Date().toISOString();
        if (def.after) def.after(ent);
        if (kind === "deal" && key === "sessionId"){ const s = sessById(v); logActivity({dealId:ent.id, companyId:ent.companyId, type:"note", text:s ? `Rattachée à la session du ${fmtDate(s.startDate)} (${s.location}).` : "Session retirée de la demande."}); }
        if (kind === "session" && key === "startDate"){ ent.startDate = v || cur; }
        save();
      }
    }
    render();
    const again = $(`[data-edit="${wrap.dataset.edit}"] .f-v`); if (again) again.focus({preventScroll:true});
  };

    if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); finish(false); }
    else if (e.key === "Enter" && (def.type !== "textarea" || e.ctrlKey || e.metaKey)){ e.preventDefault(); finish(true); }
  });

}

function moveDeal(dealId, stageId, silent){
  const d = dealById(dealId), to = STATE.stages.find(s => s.id === stageId);
  if (!d || !to || d.stageId === stageId) return false;
  const from = stageById(d.stageId), t0 = today(), notes = [];
  d.stageId = stageId; d.updatedAt = new Date().toISOString();
  if (stageId === "devis"){ if (!d.quoteDate) d.quoteDate = t0; if (!d.quoteRef) d.quoteRef = nextQuoteRef(); }
  if (stageIdx(stageId) >= stageIdx("financement")){ if (!d.quoteDate) d.quoteDate = t0; if (!d.quoteRef) d.quoteRef = nextQuoteRef(); if (!d.acceptedAt) d.acceptedAt = t0; }
  if (stageId === "inscrit"){
    if (!d.enrolledAt) d.enrolledAt = t0;
    if (["opco","cpf","ft"].includes(d.funding) && d.fundingStatus !== "Accordée"){ d.fundingStatus = "Accordée"; d.fundedAt = t0; d.cover = finCalc(Object.assign({}, d, {fundingStatus:"Déposée"})).est; logActivity({dealId:d.id, companyId:d.companyId, type:"note", text:`Accord de prise en charge enregistré (${FUNDING[d.funding].label}) : ${fmtEUR(d.cover)}.`}); }
    if (!d.q.convention) notes.push("convention à faire signer");
    if (!d.sessionId && d.format !== "intra") notes.push("session à choisir");
  }
  if (stageIdx(stageId) >= 0 && stageIdx(stageId) < stageIdx("inscrit")) d.enrolledAt = "";
  if (stageIdx(stageId) >= 0 && stageIdx(stageId) < stageIdx("financement")) d.acceptedAt = "";
  if (stageId === "perdu"){ d.lostAt = t0; if (!d.lostReason) d.lostReason = "Non précisé"; }
  logActivity({dealId:d.id, companyId:d.companyId, type:"status_change", text:`Étape : ${from.name} → ${to.name}`});
  syncAutoRelances(); save(); render();
  if (!silent){
    let msg = `« ${clientLabel(d)} » déplacé vers ${to.name}`;
    if (stageId === "devis") msg += ` — relances J+${STATE.settings.relance1} et J+${STATE.settings.relance2} programmées`;
    if (stageId === "financement" && ["opco","cpf","ft"].includes(d.funding)) msg += ` — demande de prise en charge ${FUNDING[d.funding].label} à suivre`;
    if (notes.length) msg += " — " + notes.join(", ");
    toast(msg);
  }
  return true;
}
function archive(kind, id){
  const e = getEnt(kind, id); if (!e) return;

}
function shiftSession(id){
  const s = sessById(id); if (!s) return;
  const prev = s.startDate; s.startDate = snapWork(addDays(prev, 14)); s.updatedAt = new Date().toISOString();

/* ---------- Toasts ---------- */
function toast(msg, undo){
  const box = $("#toasts"), el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Annuler</button>' : ""}`;
  box.appendChild(el);
  const kill = () => { el.classList.add("out"); setTimeout(() => el.remove(), 220); };
  const tm = setTimeout(kill, undo ? 5000 : 3200);
  if (undo) el.querySelector("button").addEventListener("click", () => { clearTimeout(tm); kill(); undo(); });
  while (box.children.length > 3) box.firstChild.remove();
}

    const body = `1. La formation\n${x.form} — ${x.t.durLabel}, ${x.d.format === "intra" ? "en intra dans vos locaux" : "en inter-entreprises"}, ${plural(x.n, "stagiaire")}.\nSession : ${x.sessTxt} — ${x.lieu}.\nObjectifs : ${x.t.desc}\nValidation : ${x.t.certif || "attestation de fin de formation"}.\n\n2. Le prix\n${x.prix} net de taxe (organisme exonéré de TVA, art. 261-4-4° a du CGI).\n\n3. Le financement\n${x.fin.long} : prise en charge ${x.f.accorded ? "accordée" : "estimée"} à ${x.pec}.\nReste à charge : ${x.rac}${x.n > 1 ? ` (soit ${fmtEUR(x.f.rac / x.n)} par stagiaire)` : ""}.\n${x.f.notes.map(n => "• " + n).join("\n")}\n\n4. Les prochaines étapes\n• ${finSteps(x)}\n• Signature de la convention de formation.\n• Envoi des convocations au plus tard 7 jours avant la session, avec le programme et les modalités d'accès.\n\nNos locaux sont accessibles aux personnes à mobilité réduite ; notre référente handicap étudie toute adaptation nécessaire.`;

  }

    const s = x.s, hours = s && s.location.startsWith("Distanciel") ? "9 h 00 – 12 h 30 (demi-journées)" : "9 h 00 – 12 h 30 et 13 h 30 – 17 h 00";

function parseCSV(text){

  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === sep){ row.push(f); f = ""; } else if (ch === "\n"){ row.push(f); rows.push(row); row = []; f = ""; } else if (ch !== "\r") f += ch;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }

  return {sep, header:(clean[0] || []).map(h => h.trim()), rows:clean.slice(1)};

}
