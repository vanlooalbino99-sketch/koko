<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blackstart AI — CRM Premium</title>
<meta name="color-scheme" content="dark light" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue: {
            50:  'rgb(var(--bs-accent-50) / <alpha-value>)',
            100: 'rgb(var(--bs-accent-100) / <alpha-value>)',
            200: 'rgb(var(--bs-accent-200) / <alpha-value>)',
            300: 'rgb(var(--bs-accent-300) / <alpha-value>)',
            400: 'rgb(var(--bs-accent-400) / <alpha-value>)',
            500: 'rgb(var(--bs-accent-500) / <alpha-value>)',
            600: 'rgb(var(--bs-accent-600) / <alpha-value>)',
            700: 'rgb(var(--bs-accent-700) / <alpha-value>)',
            800: 'rgb(var(--bs-accent-800) / <alpha-value>)',
            900: 'rgb(var(--bs-accent-900) / <alpha-value>)',
            950: 'rgb(var(--bs-accent-950) / <alpha-value>)',
          },
        },
      },
    },
  };
</script>
<script id="bs-boot">
/* =====================================================================
   BLACKSTART — moteur d'apparence v3
   S'exécute avant React : aucune variable n'est appliquée en retard,
   donc pas de clignotement au chargement.
   ===================================================================== */
(function () {
  var KEY = 'blackstart-ui-v3';
  var APPKEY = 'blackstart-data-v1';

  var DEFAULTS = {
    preset: 'nuit',
    scheme: 'dark',
    accent: '#387CD5',
    bg: '#0A1220',
    surface: '#0F1B2E',
    text: '#EAF1FB',
    hover: '',
    selection: '',
    gauge: '',
    radius: 18,
    scale: 16,
    font: 'jakarta',
    mono: true,
    dock: 'float',
    maxw: 1040,
    blur: 18,
    shadow: 1,
    aurora: 0.55,
    grid: 0.35,
    motion: 'full',
    lift: true,
    spotlight: true,
    shine: true,
    sat: 1,
    con: 1,
    bri: 1,
    splash: 2200,
    navFlash: true,
    sound: true,
    haptics: true,
    seeded: false
  };

  var PRESETS = [
    { id: 'nuit',   label: 'Nuit Blackstart', scheme: 'dark',  accent: '#387CD5', bg: '#0A1220', surface: '#0F1B2E', text: '#EAF1FB' },
    { id: 'abysse', label: 'Abysse',          scheme: 'dark',  accent: '#22C1D0', bg: '#04131A', surface: '#082230', text: '#E4F8FC' },
    { id: 'orbite', label: 'Orbite',          scheme: 'dark',  accent: '#8B5CF6', bg: '#0C0A18', surface: '#171230', text: '#EFEAFF' },
    { id: 'menthe', label: 'Menthe',          scheme: 'dark',  accent: '#10B981', bg: '#04140E', surface: '#08241B', text: '#E4FBF1' },
    { id: 'braise', label: 'Braise',          scheme: 'dark',  accent: '#F97316', bg: '#140C06', surface: '#22150C', text: '#FFF0E2' },
    { id: 'rubis',  label: 'Rubis',           scheme: 'dark',  accent: '#F43F5E', bg: '#15070D', surface: '#251018', text: '#FFE9EE' },
    { id: 'jour',   label: 'Jour',            scheme: 'light', accent: '#2563EB', bg: '#EEF2F9', surface: '#FFFFFF', text: '#0B1728' },
    { id: 'aube',   label: 'Aube',            scheme: 'light', accent: '#0E7490', bg: '#EFF4F5', surface: '#FFFFFF', text: '#0D1B22' }
  ];

  var FONTS = {
    jakarta: { label: 'Plus Jakarta', stack: '"Plus Jakarta Sans"', url: '' },
    inter:   { label: 'Inter',        stack: '"Inter"',        url: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' },
    manrope: { label: 'Manrope',      stack: '"Manrope"',      url: 'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap' },
    grotesk: { label: 'Space Grotesk',stack: '"Space Grotesk"',url: 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap' },
    system:  { label: 'Système',      stack: 'ui-sans-serif',  url: '' }
  };

  /* ---------------- couleur ---------------- */
  function clamp(n, a, b) { return n < a ? a : (n > b ? b : n); }

  function h2r(hex) {
    var h = String(hex == null ? '' : hex).trim().replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function r2h(c) {
    return '#' + c.map(function (v) {
      v = Math.round(clamp(v, 0, 255));
      return (v < 16 ? '0' : '') + v.toString(16);
    }).join('');
  }
  function str(c) { return Math.round(c[0]) + ' ' + Math.round(c[1]) + ' ' + Math.round(c[2]); }

  function r2hsl(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    var h = 0, s = 0, l = (mx + mn) / 2;
    if (d) {
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hsl2r(h, s, l) {
    h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2, r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  function mix(a, b, t) {
    var A = h2r(a) || [0, 0, 0], B = h2r(b) || [255, 255, 255];
    return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t];
  }
  function lum(hex) {
    var c = h2r(hex) || [0, 0, 0];
    return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  }

  /* Rapproche une couleur du fond sans la délaver : la teinte du texte est conservée. */
  function shade(text, bg, t, keep) {
    var m = r2hsl(mix(text, bg, t));
    var h = r2hsl(h2r(text) || [255, 255, 255]);
    return hsl2r(h[0], Math.max(m[1], h[1] * keep), m[2]);
  }

  var STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
  var LCURVE = [.965, .915, .845, .755, .655, null, .470, .385, .300, .225, .145];
  var SCURVE = [.42, .58, .70, .82, .92, 1, 1, .96, .88, .82, .76];

  /* Rampe 50→950 générée depuis une seule couleur d'accent. */
  function ramp(accent) {
    var base = h2r(accent) || h2r(DEFAULTS.accent);
    var hsl = r2hsl(base);
    var shift = (hsl[2] - 0.55) * 0.6;
    var out = {};
    for (var i = 0; i < STEPS.length; i++) {
      if (LCURVE[i] === null) { out[STEPS[i]] = base; continue; }
      out[STEPS[i]] = hsl2r(hsl[0], clamp(hsl[1] * SCURVE[i], 0, 1), clamp(LCURVE[i] + shift, 0.06, 0.98));
    }
    return out;
  }

  /* ---------------- application ---------------- */
  var fontLinks = {};
  function loadFont(id) {
    var f = FONTS[id];
    if (!f || !f.url || fontLinks[id]) return;
    try {
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = f.url;
      document.head.appendChild(l);
      fontLinks[id] = true;
    } catch (e) { /* la police système prend le relais */ }
  }

  function apply(c) {
    var d = document.documentElement, S = d.style;
    var light = c.scheme === 'light';
    var accent = h2r(c.accent) ? c.accent : DEFAULTS.accent;
    var bg = h2r(c.bg) ? c.bg : (light ? '#EEF2F9' : '#0A1220');
    var surface = h2r(c.surface) ? c.surface : (light ? '#FFFFFF' : '#0F1B2E');
    var text = h2r(c.text) ? c.text : (light ? '#0B1728' : '#EAF1FB');
    var R = ramp(accent);

    for (var i = 0; i < STEPS.length; i++) S.setProperty('--bs-accent-' + STEPS[i], str(R[STEPS[i]]));
    S.setProperty('--bs-accent', accent);
    S.setProperty('--bs-accent-pale', 'rgb(' + str(R[200]) + ')');
    S.setProperty('--bs-accent-light', 'rgb(' + str(R[300]) + ')');
    S.setProperty('--bs-accent-dark', 'rgb(' + str(R[600]) + ')');
    S.setProperty('--bs-accent-darker', 'rgb(' + str(R[700]) + ')');

    var tint = light ? '#000000' : '#FFFFFF';
    S.setProperty('--bs-bg', bg);
    S.setProperty('--bs-bg-rgb', str(h2r(bg)));
    S.setProperty('--bs-bg-2', 'rgb(' + str(mix(bg, tint, 0.035)) + ')');
    S.setProperty('--bs-bg-3', 'rgb(' + str(mix(bg, accent, 0.09)) + ')');
    S.setProperty('--bs-surface', surface);
    S.setProperty('--bs-surface-rgb', str(h2r(surface)));
    S.setProperty('--bs-surface-2', 'rgb(' + str(mix(surface, tint, 0.07)) + ')');

    S.setProperty('--bs-text', text);
    S.setProperty('--bs-text-soft', 'rgb(' + str(shade(text, bg, 0.14, 0.75)) + ')');
    S.setProperty('--bs-text-muted', 'rgb(' + str(shade(text, bg, 0.30, 0.55)) + ')');
    S.setProperty('--bs-text-dim', 'rgb(' + str(shade(text, bg, 0.44, 0.45)) + ')');
    S.setProperty('--bs-text-on-accent', lum(accent) > 0.58 ? '#0B1220' : '#FFFFFF');

    var hover = h2r(c.hover) ? c.hover : accent;
    var selection = h2r(c.selection) ? c.selection : accent;
    var gauge = h2r(c.gauge) ? c.gauge : r2h(R[600]);
    S.setProperty('--bs-hover-rgb', str(h2r(hover)));
    S.setProperty('--bs-selection-rgb', str(h2r(selection)));
    S.setProperty('--bs-selection', selection);
    S.setProperty('--bs-selection-light', 'rgb(' + str(mix(selection, '#FFFFFF', 0.3)) + ')');
    S.setProperty('--bs-gauge', gauge);
    S.setProperty('--bs-gauge-track', 'rgb(' + str(mix(surface, text, 0.2)) + ')');

    S.setProperty('--bs-r', c.radius + 'px');
    S.setProperty('--bs-fs', c.scale + 'px');
    S.setProperty('--bs-blur', c.blur + 'px');
    S.setProperty('--bs-card-blur', Math.round(c.blur * 0.55) + 'px');
    S.setProperty('--bs-shadow', String(c.shadow));
    S.setProperty('--bs-aurora', String(c.aurora));
    S.setProperty('--bs-grid', String(c.grid));
    S.setProperty('--bs-maxw', c.maxw + 'px');
    S.setProperty('--bs-sat', String(c.sat));
    S.setProperty('--bs-con', String(c.con));
    S.setProperty('--bs-bri', String(c.bri));

    var f = FONTS[c.font] || FONTS.jakarta;
    loadFont(c.font);
    S.setProperty('--bs-ui', f.stack);

    d.setAttribute('data-bs-scheme', light ? 'light' : 'dark');
    d.setAttribute('data-bs-motion', c.motion);
    d.setAttribute('data-bs-dock', c.dock);
    d.setAttribute('data-bs-lift', c.lift ? '1' : '0');
    d.setAttribute('data-bs-spot', c.spotlight ? '1' : '0');
    d.setAttribute('data-bs-shine', c.shine ? '1' : '0');
    d.setAttribute('data-bs-mono', c.mono ? '1' : '0');

    try {
      var m = document.querySelector('meta[name="theme-color"]');
      if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
      m.setAttribute('content', bg);
    } catch (e) { /* sans importance */ }
  }

  /* ---------------- état ---------------- */
  function load() {
    var c = {}, k;
    for (k in DEFAULTS) if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) c[k] = DEFAULTS[k];
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        for (k in DEFAULTS) if (Object.prototype.hasOwnProperty.call(s, k)) c[k] = s[k];
      }
    } catch (e) { /* valeurs par défaut */ }
    if (!c.seeded) seedFromApp(c);
    return c;
  }

  /* Reprend les couleurs déjà choisies dans l'app, une seule fois. */
  function seedFromApp(c) {
    c.seeded = true;
    try {
      var raw = localStorage.getItem(APPKEY);
      if (!raw) return;
      var t = (JSON.parse(raw) || {}).settings;
      t = t && t.theme;
      if (!t || !h2r(t.accent)) return;
      c.accent = t.accent;
      if (h2r(t.bg)) {
        c.bg = t.bg;
        c.scheme = lum(t.bg) > 0.5 ? 'light' : 'dark';
        c.surface = r2h(mix(t.bg, c.scheme === 'light' ? '#000000' : '#FFFFFF', 0.06));
      }
      if (h2r(t.text)) c.text = t.text;
      if (h2r(t.hover) && t.hover !== t.accent) c.hover = t.hover;
      if (h2r(t.selection) && t.selection !== t.accent) c.selection = t.selection;
      if (h2r(t.gauge)) c.gauge = t.gauge;
      c.preset = '';
    } catch (e) { /* on garde les valeurs par défaut */ }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { /* stockage plein ou bloqué */ }
  }

  function emit() {
    try { window.dispatchEvent(new CustomEvent('bs:apparence')); } catch (e) { /* navigateur ancien */ }
  }

  function setMany(patch, quiet) {
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) cfg[k] = patch[k];
    apply(cfg); save();
    if (!quiet) emit();
  }

  function set(k, v) { var o = {}; o[k] = v; setMany(o); }

  function usePreset(id) {
    for (var i = 0; i < PRESETS.length; i++) {
      if (PRESETS[i].id === id) {
        setMany({
          preset: id, scheme: PRESETS[i].scheme, accent: PRESETS[i].accent,
          bg: PRESETS[i].bg, surface: PRESETS[i].surface, text: PRESETS[i].text,
          hover: '', selection: '', gauge: ''
        });
        return;
      }
    }
  }

  /* Bascule sombre / clair en gardant la teinte d'accent. */
  function useScheme(scheme) {
    var hsl = r2hsl(h2r(cfg.accent) || h2r(DEFAULTS.accent));
    var p = null, i;
    for (i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === cfg.preset) p = PRESETS[i];
    if (p) {
      var twin = scheme === 'light' ? 'jour' : 'nuit';
      if (p.scheme !== scheme) {
        for (i = 0; i < PRESETS.length; i++) {
          if (PRESETS[i].scheme === scheme && PRESETS[i].id !== p.id) {
            var d = Math.abs(r2hsl(h2r(PRESETS[i].accent))[0] - hsl[0]);
            if (d > 180) d = 360 - d;
            if (d < 26) { twin = PRESETS[i].id; break; }
          }
        }
        usePreset(twin);
        setMany({ accent: cfg.accent });
        return;
      }
    }
    setMany(scheme === 'light'
      ? { scheme: 'light', bg: r2h(hsl2r(hsl[0], 0.32, 0.965)), surface: '#FFFFFF', text: r2h(hsl2r(hsl[0], 0.42, 0.10)) }
      : { scheme: 'dark',  bg: r2h(hsl2r(hsl[0], 0.34, 0.068)), surface: r2h(hsl2r(hsl[0], 0.30, 0.118)), text: r2h(hsl2r(hsl[0], 0.55, 0.955)) });
  }

  function reset(keys) {
    var patch = {}, i;
    if (keys && keys.length) { for (i = 0; i < keys.length; i++) patch[keys[i]] = DEFAULTS[keys[i]]; }
    else { for (var k in DEFAULTS) patch[k] = DEFAULTS[k]; patch.seeded = true; }
    setMany(patch);
  }

  /* Passerelle : l'app réapplique son thème à chaque rendu, on reprend la main. */
  var lastSig = null;
  function fromApp(theme) {
    try {
      if (theme) {
        var sig = JSON.stringify(theme);
        if (lastSig !== null && sig !== lastSig) {
          var patch = { preset: '' };
          if (h2r(theme.accent)) patch.accent = theme.accent;
          if (h2r(theme.bg)) {
            patch.bg = theme.bg;
            patch.scheme = lum(theme.bg) > 0.5 ? 'light' : 'dark';
            patch.surface = r2h(mix(theme.bg, patch.scheme === 'light' ? '#000000' : '#FFFFFF', 0.06));
          }
          if (h2r(theme.text)) patch.text = theme.text;
          patch.hover = (h2r(theme.hover) && theme.hover !== theme.accent) ? theme.hover : '';
          patch.selection = (h2r(theme.selection) && theme.selection !== theme.accent) ? theme.selection : '';
          patch.gauge = h2r(theme.gauge) ? theme.gauge : '';
          setMany(patch);
          lastSig = sig;
          return;
        }
        lastSig = sig;
      }
    } catch (e) { /* on réapplique quand même */ }
    apply(cfg);
  }

  var cfg = load();
  apply(cfg);

  window.BSUI = {
    KEY: KEY, APPKEY: APPKEY,
    cfg: cfg, DEFAULTS: DEFAULTS, PRESETS: PRESETS, FONTS: FONTS, STEPS: STEPS,
    apply: function () { apply(cfg); },
    set: set, setMany: setMany, save: save, reset: reset,
    usePreset: usePreset, useScheme: useScheme, fromApp: fromApp,
    util: { h2r: h2r, r2h: r2h, mix: mix, lum: lum, ramp: ramp, str: str, r2hsl: r2hsl, hsl2r: hsl2r, clamp: clamp },
    pending: false,
    open: function () { window.BSUI.pending = true; },
    close: function () { window.BSUI.pending = false; }
  };
})();
</script>
<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }

  /* ============ Variables de thème personnalisable (Paramètres) ============ */
  :root {
    /* Couleur d'accent (boutons / thème) — nuances Tailwind "blue" pilotées par JS */
    --bs-accent-50:  244 248 255;
    --bs-accent-100: 217 230 251;
    --bs-accent-200: 196 216 243;
    --bs-accent-300: 150 186 233;
    --bs-accent-400: 115 163 225;
    --bs-accent-500: 56 124 213;
    --bs-accent-600: 40 104 188;
    --bs-accent-700: 29 75 135;
    --bs-accent-800: 22 35 58;
    --bs-accent-900: 13 35 63;
    --bs-accent-950: 10 18 32;

    /* Couleur d'accent — valeurs hex simples utilisées dans les dégradés */
    --bs-accent-pale: #C4D8F3;
    --bs-accent-light: #73A3E1;
    --bs-accent: #387CD5;
    --bs-accent-dark: #2868BC;
    --bs-accent-darker: #1D4B87;

    /* Couleur de fond de l'application */
    --bs-bg-rgb: 10, 18, 32;
    --bs-bg: #0A1220;
    --bs-bg-2: #0B1626;
    --bs-bg-3: #0D1B2E;
    --bs-surface-rgb: 15, 27, 46;
    --bs-surface: #0F1B2E;
    --bs-surface-2: #16233A;

    /* Couleur de survol (halo au survol des boutons) */
    --bs-hover-rgb: 56, 124, 213;

    /* Couleur de sélection active (barre de navigation) */
    --bs-selection-rgb: 56, 124, 213;
    --bs-selection: #387CD5;
    --bs-selection-light: #73A3E1;

    /* Couleur de l'anneau de progression (jauge Objectif appels) */
    --bs-gauge: #2868BC;
    --bs-gauge-track: #2A3B57;

    /* Couleur de texte */
    --bs-text: #EAF1FB;
    --bs-text-muted: #A9BFDD;
    --bs-text-dim: #8CA3C7;
    --bs-text-on-accent: #0D233F;
    --bs-text-soft: #C3D3EA;
  }

  /* Supprime le surlignage tactile par défaut (souvent doré/orange sur mobile) */
  html {
    -webkit-tap-highlight-color: transparent;
  }
  button, a, [role="button"] {
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  /* Fond sombre fixe, sobre — couleur unie, sans dégradé */
  html, body {
    background: var(--bs-bg);
    background-attachment: fixed;
  }

  /* Effet de survol générique sur les boutons — uniquement un changement de couleur fluide,
     aucune animation de déplacement/échelle (exclu pour les boutons de la barre de navigation,
     qui gardent leur propre style) */
  button:not(:disabled) {
    transition: background-color 0.3s ease, border-color 0.3s ease, filter 0.3s ease;
  }
  button:not(:disabled):hover:not(.nav-item):not(.no-hover-fx) {
    background-color: rgb(var(--bs-hover-rgb)/0.14) !important;
    cursor: pointer;
  }
  button:not(:disabled):hover.nav-item,
  button:not(:disabled):hover.no-hover-fx {
    cursor: pointer;
  }

  /* Retour visuel discret pour les boutons exclus du survol plein
     (cartes de liste, en-têtes d'accordéon, bouton retour…) — sauf ceux qui
     gèrent déjà leur propre état actif (onglets, bouton rouge "Terminer l'appel"). */
  button.no-hover-fx:not(:disabled):not([class*="hover:"]):not([class*="rose"]):hover {
    background-color: rgb(var(--bs-hover-rgb)/0.07) !important;
  }
  button.no-hover-fx:not(:disabled):not([class*="hover:"]):not([class*="rose"]):active {
    background-color: rgb(var(--bs-hover-rgb)/0.12) !important;
  }

  /* Traitement plus marqué pour les vraies cartes cliquables (prospects, devis) :
     changement de couleur/ombre au survol, sans déplacement ni mise à l'échelle. */
  button.no-hover-fx[class*="border-blue-500/30"]:not(:disabled):hover {
    background-color: #101E36 !important;
    border-color: rgba(96,165,250,0.45) !important;
    box-shadow: 0 4px 14px -8px rgb(var(--bs-hover-rgb)/0.35);
  }
  button.no-hover-fx[class*="border-blue-500/30"]:not(:disabled):active {
    box-shadow: none;
  }
  button:not(:disabled):active {
    filter: brightness(0.96);
  }

  /* ============ Écran "en appel" — fond sombre fixe ============ */
  .call-live-bg {
    background: var(--bs-bg-3);
  }
  .call-pulse-ring {
    background: rgba(244,63,94,0.14);
    animation: callPulse 2.4s ease-in-out infinite;
  }
  @keyframes callPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .call-pulse-ring { animation: none; }
  }

  /* ============ Dashboard — animations & effets premium ============ */
  @keyframes bsFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bsPulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56,124,213,0.35); }
    50% { box-shadow: 0 0 0 6px rgba(56,124,213,0); }
  }
  @keyframes bsShimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .bs-card-anim {
    animation: bsFadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }
  .bs-card-anim:nth-of-type(1) { animation-delay: 0.02s; }
  .bs-card-anim:nth-of-type(2) { animation-delay: 0.08s; }
  .bs-card-anim:nth-of-type(3) { animation-delay: 0.14s; }
  .bs-card-anim:nth-of-type(4) { animation-delay: 0.20s; }
  .bs-card-anim:nth-of-type(5) { animation-delay: 0.26s; }
  .bs-card-anim:nth-of-type(6) { animation-delay: 0.32s; }
  .bs-card-anim:nth-of-type(7) { animation-delay: 0.38s; }
  .bs-card-anim:nth-of-type(8) { animation-delay: 0.44s; }
  .bs-glow-pulse {
    animation: bsPulseGlow 2.6s ease-in-out infinite;
  }
  .bs-hover-lift {
    transition: box-shadow 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
  }
  .bs-hover-lift:hover {
    border-color: rgba(96,165,250,0.45);

  .bs-bar-fill {

  .bs-tabular {

  @keyframes bsColorFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }

  @keyframes bsWaveSheen {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(120%); }

  /* Vague de couleur — nuit profonde vers bleu électrique, façon lueur nocturne */
  .bs-flow-line {

    pointer-events: none;
    mix-blend-mode: screen;

  @media (prefers-reduced-motion: reduce) {
    .bs-flow-line, .bs-flow-btn, .bs-flow-btn::after { animation: none; }

<style>
  /* ============ Loader de démarrage ============ */
  #app-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: var(--bs-bg);
    transition: opacity 0.45s ease;
    overflow: hidden;
  }
  #app-loader.app-loader-hidden {
    opacity: 0;
    pointer-events: none;
  }
  #app-loader::before {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,124,213,0.16) 0%, transparent 68%);
    animation: app-loader-breathe 3.2s ease-in-out infinite;
  }
  .app-loader-rings {
    position: relative;
    width: 108px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-loader-ring {
    position: absolute;
    border-radius: 50%;
    border: 2.5px solid transparent;
  }
  .app-loader-ring:nth-child(1) {
    width: 108px;
    height: 108px;
    border-top-color: #60A5FA;
    border-right-color: rgba(96,165,250,0.15);
    animation: app-loader-spin 1.6s cubic-bezier(0.65,0.05,0.36,1) infinite;
  }
  .app-loader-ring:nth-child(2) {
    width: 78px;
    height: 78px;
    border-top-color: #22C1D0;
    border-left-color: rgba(34,193,208,0.15);
    animation: app-loader-spin-rev 1.3s cubic-bezier(0.65,0.05,0.36,1) infinite;
  }
  .app-loader-mark {
    position: relative;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--bs-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: #fff;
    letter-spacing: -0.02em;
    box-shadow: 0 0 0 0 rgba(56,124,213,0.5);
    animation: app-loader-mark-pulse 1.6s ease-in-out infinite;
  }
  .app-loader-brand {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.01em;
    color: #EAF1FB;
    display: flex;
    align-items: baseline;
    gap: 7px;
    opacity: 0;
    animation: app-loader-fade-up 0.6s ease 0.15s forwards;
  }
  .app-loader-brand span {
    color: #60A5FA;
  }
  .app-loader-sub {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    color: rgba(226,232,240,0.55);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0;
    animation: app-loader-fade-up 0.6s ease 0.3s forwards;
  }
  .app-loader-bar-track {
    width: 140px;
    height: 3px;
    border-radius: 999px;
    background: rgba(96,165,250,0.15);
    overflow: hidden;
    opacity: 0;
    animation: app-loader-fade-up 0.6s ease 0.4s forwards;
  }
  .app-loader-bar-fill {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #387CD5, #60A5FA);
    animation: app-loader-bar-slide 1.3s ease-in-out infinite;
  }
  @keyframes app-loader-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes app-loader-spin-rev {
    to { transform: rotate(-360deg); }
  }
  @keyframes app-loader-breathe {
    0%, 100% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  @keyframes app-loader-mark-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56,124,213,0.45); }
    50% { box-shadow: 0 0 0 10px rgba(56,124,213,0); }
  }
  @keyframes app-loader-fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes app-loader-bar-slide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #app-loader::before,
    .app-loader-ring,
    .app-loader-mark,
    .app-loader-bar-fill { animation: none; }
    .app-loader-brand, .app-loader-sub, .app-loader-bar-track { animation: none; opacity: 1; }
  }
</style>
<div id="app-loader">
  <div class="app-loader-rings">
    <div class="app-loader-ring"></div>
    <div class="app-loader-ring"></div>
    <div class="app-loader-mark">B</div>
  </div>
  <div class="app-loader-brand">BLACKSTART <span>AI</span></div>
  <div class="app-loader-sub">Command Center — Prospection</div>
  <div class="app-loader-bar-track">
    <div class="app-loader-bar-fill"></div>
  </div>

<div id="root"></div>
<script>
(() => {
  var loaderEl = document.getElementById('app-loader');
  var rootEl = document.getElementById('root');
  if (!loaderEl || !rootEl) return;

  var loadStartTime = Date.now();
  var MIN_LOADER_MS = (window.BSUI && window.BSUI.cfg) ? window.BSUI.cfg.splash : 2200;

  function hideLoader() {
    if (!loaderEl) return;
    var elapsed = Date.now() - loadStartTime;
    var remaining = MIN_LOADER_MS - elapsed;
    if (remaining > 0) {
      setTimeout(doHide, remaining);
    } else {
      doHide();
    }
  }
  function doHide() {
    if (!loaderEl) return;
    loaderEl.classList.add('app-loader-hidden');
    // On garde le loader dans le DOM (au lieu de le supprimer) afin de
    // pouvoir le réafficher à chaque navigation dans la barre de nav.
  }

  // Dès que React insère du contenu dans #root, l'app est montée : on masque le loader
  // (après le délai minimum ci-dessus pour garantir un affichage soigné).
  var observer = new MutationObserver(function () {
    if (rootEl.childNodes.length > 0) {
      observer.disconnect();
      hideLoader();
    }
  });
  observer.observe(rootEl, { childList: true });

  // Filet de sécurité si jamais le montage prend trop de temps ou échoue silencieusement.
  setTimeout(hideLoader, 9000);

  // ============ Réaffichage du loader à chaque navigation ============
  // Chaque clic sur un item de la barre de navigation (classe "nav-item")
  // réaffiche brièvement le loader, puis le masque à nouveau.
  var NAV_LOADER_MS = 520;
  var navHideTimer = null;
  document.addEventListener('click', function (e) {
    var navBtn = e.target && e.target.closest ? e.target.closest('.nav-item') : null;
    if (!navBtn || !loaderEl) return;
    if (window.BSUI && window.BSUI.cfg && !window.BSUI.cfg.navFlash) return;
    if (navHideTimer) { clearTimeout(navHideTimer); navHideTimer = null; }
    loaderEl.classList.remove('app-loader-hidden');
    navHideTimer = setTimeout(function () {
      loaderEl.classList.add('app-loader-hidden');
      navHideTimer = null;
    }, NAV_LOADER_MS);
  }, true);

  // ============ Son de démarrage (chime "pro", généré, sans fichier externe) ============
  // Les navigateurs bloquent l'audio tant qu'aucun geste utilisateur n'a eu lieu.
  // On tente de jouer immédiatement (fonctionne si la page a déjà un contexte
  // audio autorisé) et, sinon, au tout premier tap/clic/touche de l'utilisateur.
  var startupSoundPlayed = false;
  function playStartupChime() {
    if (startupSoundPlayed) return;
    if (window.BSUI && window.BSUI.cfg && !window.BSUI.cfg.sound) return;
    startupSoundPlayed = true;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var now = ctx.currentTime;

      var master = ctx.createGain();
      master.gain.setValueAtTime(0, now);
      master.connect(ctx.destination);

      // Deux notes ascendantes douces (arpège discret), type "notification premium"
      var notes = [
        { freq: 587.33, start: 0.00, dur: 0.22, peak: 0.16 }, // Ré5
        { freq: 880.00, start: 0.10, dur: 0.30, peak: 0.14 }  // La5
      ];

      notes.forEach(function (n) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.freq, now + n.start);
        gain.gain.setValueAtTime(0, now + n.start);
        gain.gain.linearRampToValueAtTime(n.peak, now + n.start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);
        osc.connect(gain);
        gain.connect(master);
        osc.start(now + n.start);
        osc.stop(now + n.start + n.dur + 0.05);
      });

      master.gain.setValueAtTime(1, now);

      setTimeout(function () {
        try { ctx.close(); } catch (e) {}
      }, 900);
    } catch (e) {
      // Silencieux : l'absence de son ne doit jamais bloquer le chargement de l'app.
    }
  }

  // Tentative immédiate (marche sur certains navigateurs/PWA déjà autorisés)
  playStartupChime();

  // Fallback : premier geste utilisateur, une seule fois
  var gestureEvents = ['pointerdown', 'touchstart', 'click', 'keydown'];
  function onFirstGesture() {
    playStartupChime();
    gestureEvents.forEach(function (evt) {
      window.removeEventListener(evt, onFirstGesture);
    });
  }
  gestureEvents.forEach(function (evt) {
    window.addEventListener(evt, onFirstGesture, { once: true, passive: true });
  });
})();
</script>

/* ===================================================================
   BLACKSTART — Skin v3
   Poste de commandement nocturne : champ bleu profond, cartes en verre
   instrumenté, un seul accent électrique. Tout est piloté par variables.
   =================================================================== */

:root{
  --bs-ease:cubic-bezier(.22,1,.36,1);
  --bs-ease-out:cubic-bezier(.16,1,.3,1);
  --bs-r:18px;
  --bs-blur:18px;
  --bs-card-blur:10px;
  --bs-shadow:1;
  --bs-aurora:.55;
  --bs-grid:.35;
  --bs-maxw:1040px;
  --bs-fs:16px;
  --bs-ui:"Plus Jakarta Sans";
  --bs-mono:"JetBrains Mono";
  --bs-sat:1; --bs-con:1; --bs-bri:1;
}

html{ font-size:var(--bs-fs); }

/* ---------- Typographie ---------- */
html,body,#root,button,input,select,textarea{
  font-family:var(--bs-ui),ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;

[data-bs-mono="1"] .bs-tabular,

}
.tabular-nums,.bs-tabular,[class*="tabular-nums"]{font-variant-numeric:tabular-nums}
.font-black{font-weight:800;letter-spacing:-.026em}
.font-bold{letter-spacing:-.012em}
h1,h2,h3,.text-3xl,.text-2xl,.text-xl{text-wrap:balance}
p,.text-sm,.text-xs{text-wrap:pretty}

/* ---------- Champ de fond : aurore + trame ---------- */
body::before{
  content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;

  background:
    radial-gradient(40% 32% at 16% 10%, rgb(var(--bs-accent-500)/.34), transparent 64%),
    radial-gradient(34% 28% at 88% 22%, rgb(var(--bs-accent-400)/.22), transparent 66%),
    radial-gradient(46% 40% at 60% 96%, rgb(var(--bs-accent-700)/.30), transparent 68%);
  filter:blur(44px);
  animation:bsAurora 32s ease-in-out infinite alternate;
  will-change:transform;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  opacity:var(--bs-grid);
  background-image:
    linear-gradient(rgb(255 255 255/.028) 1px,transparent 1px),
    linear-gradient(90deg,rgb(255 255 255/.028) 1px,transparent 1px);
  background-size:54px 54px;
  -webkit-mask-image:radial-gradient(78% 60% at 50% 30%,#000,transparent);
  mask-image:radial-gradient(78% 60% at 50% 30%,#000,transparent);
}
@keyframes bsAurora{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(-3%,2.5%,0) scale(1.14)}
}

/* Réglage colorimétrique global */
#root{ filter:saturate(var(--bs-sat)) contrast(var(--bs-con)) brightness(var(--bs-bri)); }

/* ---------- Rayons ---------- */
.rounded-lg{border-radius:calc(var(--bs-r) * .60)}
.rounded-xl{border-radius:calc(var(--bs-r) * .78)}
.rounded-2xl{border-radius:var(--bs-r)}
.rounded-3xl{border-radius:calc(var(--bs-r) * 1.35)}
.rounded-md{border-radius:calc(var(--bs-r) * .42)}

/* ---------- Cartes : verre instrumenté ---------- */
[class*="bg-[var(--bs-surface)]"],
[class*="bg-[var(--bs-surface-2)]"]{
  background-image:linear-gradient(168deg,rgb(255 255 255/.075),rgb(255 255 255/.018) 44%,rgb(255 255 255/0));
  backdrop-filter:blur(var(--bs-card-blur)) saturate(128%);
  -webkit-backdrop-filter:blur(var(--bs-card-blur)) saturate(128%);
  border-color:rgb(255 255 255/.10);
  box-shadow:
    inset 0 1px 0 0 rgb(255 255 255/.11),
    0 18px 38px -24px rgb(0 0 0/calc(.9 * var(--bs-shadow))),
    0 3px 10px -6px rgb(0 0 0/calc(.55 * var(--bs-shadow)));
}
[class*="ring-blue-500/30"],[class*="ring-blue-500/20"],[class*="ring-blue-500/25"]{
  --tw-ring-color:rgb(255 255 255/.10);
}
[class*="ring-blue-300/50"],[class*="ring-blue-300/60"]{
  --tw-ring-color:rgb(var(--bs-accent-300)/.28);
}

@media (hover:hover){
  [data-bs-lift="1"] .bs-hover-lift{
    transition:transform .32s var(--bs-ease),box-shadow .32s var(--bs-ease),border-color .32s var(--bs-ease);
  }
  [data-bs-lift="1"] .bs-hover-lift:hover{transform:translateY(-3px)}
  [class*="bg-[var(--bs-surface)]"]:hover{
    border-color:rgb(var(--bs-accent-400)/.42);
    box-shadow:
      inset 0 1px 0 0 rgb(255 255 255/.15),
      0 24px 48px -26px rgb(0 0 0/calc(.95 * var(--bs-shadow))),
      0 0 0 1px rgb(var(--bs-accent-500)/.14),
      0 0 34px -10px rgb(var(--bs-accent-500)/.40);
  }
}

/* Halo qui suit le curseur */
[data-bs-spot="1"] .bs-spot{
  background-image:
    radial-gradient(260px circle at var(--bs-mx,50%) var(--bs-my,-30%), rgb(var(--bs-accent-400)/.15), transparent 62%),
    linear-gradient(168deg,rgb(255 255 255/.075),rgb(255 255 255/.018) 44%,rgb(255 255 255/0));
}

/* ---------- Boutons ---------- */
button,a,[role="button"],input,select,textarea{
  transition:transform .16s var(--bs-ease),filter .22s var(--bs-ease),
             box-shadow .26s var(--bs-ease),border-color .22s var(--bs-ease),
             background-color .22s var(--bs-ease),color .22s var(--bs-ease);
}
button:active,[role="button"]:active{transform:scale(.966)}

[class*="bg-[var(--bs-accent)]"]{
  background-image:linear-gradient(176deg,rgb(255 255 255/.26),rgb(255 255 255/.04) 44%,rgb(0 0 0/.18));
  box-shadow:
    inset 0 1px 0 0 rgb(255 255 255/.34),
    0 10px 22px -10px rgb(var(--bs-accent-500)/calc(.75 * var(--bs-shadow))),
    0 2px 6px -3px rgb(0 0 0/calc(.5 * var(--bs-shadow)));
  position:relative;
  overflow:hidden;
}
@media (hover:hover){
  [class*="bg-[var(--bs-accent)]"]:hover{filter:brightness(1.09) saturate(1.08)}
}
/* Balayage lumineux sur le bouton principal, au survol seulement */
@media (hover:hover){
  [data-bs-motion="full"] [class*="bg-[var(--bs-accent)]"]::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(104deg,transparent 38%,rgb(255 255 255/.30) 50%,transparent 62%);
    background-size:260% 100%;background-position:180% 0;
    transition:background-position .7s var(--bs-ease-out);
    mix-blend-mode:screen;
  }
  [data-bs-motion="full"] [class*="bg-[var(--bs-accent)]"]:hover::after{background-position:-80% 0}
}

/* ---------- En-tête collant ---------- */
.sticky.top-0,.sticky.top-1{
  background:linear-gradient(180deg,rgb(var(--bs-bg-rgb)/.94),rgb(var(--bs-bg-rgb)/.78));
  backdrop-filter:blur(var(--bs-blur)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--bs-blur)) saturate(150%);
  border-bottom-color:transparent;
  position:relative;
}
.sticky.top-0::after,.sticky.top-1::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgb(var(--bs-accent-400)/.55) 22%,rgb(var(--bs-accent-300)/.75) 50%,rgb(var(--bs-accent-400)/.55) 78%,transparent);
  opacity:.65;
}
[data-bs-shine="1"] .text-3xl.font-black{
  background:linear-gradient(100deg,var(--bs-text) 10%,var(--bs-accent-light,#8FCBFF) 48%,var(--bs-text) 86%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  background-size:230% 100%;
  animation:bsShine 9s linear infinite;
}
@keyframes bsShine{0%{background-position:0 0}100%{background-position:230% 0}}

/* ---------- Barre de navigation ---------- */
[data-bs-dock="float"] .fixed.bottom-0.left-0.right-0{
  left:10px;right:10px;
  bottom:max(10px,env(safe-area-inset-bottom));
  border-radius:calc(var(--bs-r) * 1.15);
  border:1px solid rgb(255 255 255/.12);
  padding-bottom:6px;
}
.fixed.bottom-0.left-0.right-0{
  background:linear-gradient(180deg,rgb(var(--bs-surface-rgb)/.86),rgb(var(--bs-bg-rgb)/.94));
  backdrop-filter:blur(calc(var(--bs-blur) + 4px)) saturate(160%);
  -webkit-backdrop-filter:blur(calc(var(--bs-blur) + 4px)) saturate(160%);
  border-top-color:rgb(255 255 255/.10);
  box-shadow:
    inset 0 1px 0 0 rgb(255 255 255/.12),
    0 18px 44px -16px rgb(0 0 0/calc(.9 * var(--bs-shadow)));
}
.nav-item{border-radius:calc(var(--bs-r) * .72)}
.nav-item:active{transform:translateY(1px) scale(.94)}
.bs-nav-selected{
  background-image:linear-gradient(170deg,rgb(255 255 255/.30),rgb(255 255 255/.05) 52%,transparent);
  box-shadow:
    inset 0 1px 0 0 rgb(255 255 255/.30),
    0 6px 18px -7px rgb(var(--bs-selection-rgb)/.8);
}
/* Piste lumineuse sous l'onglet actif */
.nav-item .bs-nav-selected::after{
  content:"";position:absolute;left:50%;bottom:-5px;width:18px;height:2px;margin-left:-9px;
  border-radius:99px;background:rgb(var(--bs-selection-rgb));
  box-shadow:0 0 10px 1px rgb(var(--bs-selection-rgb)/.9);
}

/* ---------- Champs ---------- */
.input,input:not([type="color"]):not([type="range"]),select,textarea{
  background:rgb(0 0 0/.26);
  border-color:rgb(255 255 255/.12);
  border-radius:calc(var(--bs-r) * .60);
}
.input:focus,input:focus,select:focus,textarea:focus{
  border-color:rgb(var(--bs-accent-400)/.72);
  box-shadow:0 0 0 3px rgb(var(--bs-accent-500)/.22);
  outline:none;
}
input::placeholder,textarea::placeholder{opacity:.55}

/* ---------- Modales ---------- */
@keyframes bsSheetIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
@keyframes bsFadeIn{from{opacity:0}to{opacity:1}}
.fixed.inset-0.z-50{
  animation:bsFadeIn .2s ease both;
  background:rgb(2 6 14/.70);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
}
.fixed.inset-0.z-50>div{
  animation:bsSheetIn .38s var(--bs-ease) both;
  border-color:rgb(255 255 255/.12);
  box-shadow:0 40px 90px -30px rgb(0 0 0/.9);
}

/* ---------- Entrée des vues ---------- */
@keyframes bsFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bs-view-enter>*{animation:bsFadeUp .42s var(--bs-ease) both}
.bs-view-enter>*:nth-child(2){animation-delay:.05s}
.bs-view-enter>*:nth-child(3){animation-delay:.1s}
.bs-view-enter>*:nth-child(4){animation-delay:.15s}
.bs-view-enter>*:nth-child(n+5){animation-delay:.19s}

/* ---------- Écran de lancement ---------- */
#app-loader{background:var(--bs-bg)}
#app-loader::before{background:radial-gradient(circle,rgb(var(--bs-accent-500)/.18) 0%,transparent 68%)}
.app-loader-ring:nth-child(1){border-top-color:rgb(var(--bs-accent-400));border-right-color:rgb(var(--bs-accent-400)/.15)}
.app-loader-ring:nth-child(2){border-top-color:rgb(var(--bs-accent-200));border-left-color:rgb(var(--bs-accent-200)/.15)}
.app-loader-mark{background:var(--bs-accent);color:var(--bs-text-on-accent);border-radius:calc(var(--bs-r) * .78)}
.app-loader-brand{color:var(--bs-text)}
.app-loader-brand span{color:rgb(var(--bs-accent-300))}
.app-loader-bar-fill{background:linear-gradient(90deg,rgb(var(--bs-accent-600)),rgb(var(--bs-accent-300)))}

/* ---------- Détails ---------- */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:rgb(var(--bs-accent-500)/.38);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:rgb(var(--bs-accent-400)/.6);background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}
html{scrollbar-width:thin;scrollbar-color:rgb(var(--bs-accent-500)/.38) transparent;scroll-behavior:smooth}
::selection{background:rgb(var(--bs-selection-rgb)/.38);color:#fff}
:focus-visible{outline:2px solid rgb(var(--bs-accent-400));outline-offset:2px;border-radius:8px}

@media (min-width:900px){
  .bs-view-enter{max-width:var(--bs-maxw);margin-inline:auto}
}

/* ---------- Mode clair ---------- */
[data-bs-scheme="light"]{color-scheme:light}
[data-bs-scheme="light"] body::before{opacity:calc(var(--bs-aurora) * .55)}
[data-bs-scheme="light"] body::after{
  background-image:
    linear-gradient(rgb(12 23 40/.05) 1px,transparent 1px),
    linear-gradient(90deg,rgb(12 23 40/.05) 1px,transparent 1px);
}
[data-bs-scheme="light"] [class*="bg-[var(--bs-surface)]"],
[data-bs-scheme="light"] [class*="bg-[var(--bs-surface-2)]"]{
  background-image:linear-gradient(168deg,rgb(255 255 255/.9),rgb(255 255 255/.4) 46%,rgb(255 255 255/0));
  border-color:rgb(12 23 40/.09);
  box-shadow:
    inset 0 1px 0 0 rgb(255 255 255/.9),
    0 14px 30px -22px rgb(12 23 40/calc(.45 * var(--bs-shadow))),
    0 2px 6px -4px rgb(12 23 40/calc(.22 * var(--bs-shadow)));
}
[data-bs-scheme="light"] [class*="ring-blue-"],
[data-bs-scheme="light"] [class*="border-blue-"]{
  --tw-ring-color:rgb(12 23 40/.10);
  border-color:rgb(12 23 40/.10);
}
[data-bs-scheme="light"] .text-blue-400{color:rgb(var(--bs-accent-600))}
[data-bs-scheme="light"] .text-blue-300{color:rgb(var(--bs-accent-700))}
[data-bs-scheme="light"] .text-blue-200,
[data-bs-scheme="light"] .text-blue-100{color:rgb(var(--bs-accent-800))}
[data-bs-scheme="light"] .text-emerald-400,[data-bs-scheme="light"] .text-emerald-300{color:#047857}
[data-bs-scheme="light"] .text-rose-400,[data-bs-scheme="light"] .text-rose-300{color:#be123c}
[data-bs-scheme="light"] .text-amber-400{color:#b45309}
[data-bs-scheme="light"] .text-slate-400,[data-bs-scheme="light"] .text-slate-500{color:#5b6b83}
[data-bs-scheme="light"] [class*="bg-blue-950"],
[data-bs-scheme="light"] [class*="bg-blue-900"]{background-color:rgb(var(--bs-accent-500)/.09)}
[data-bs-scheme="light"] [class*="bg-rose-950"]{background-color:rgb(244 63 94/.10)}
[data-bs-scheme="light"] [class*="bg-emerald-950"]{background-color:rgb(16 185 129/.13)}
[data-bs-scheme="light"] .input,
[data-bs-scheme="light"] input:not([type="color"]):not([type="range"]),
[data-bs-scheme="light"] select,
[data-bs-scheme="light"] textarea{background:rgb(12 23 40/.035);border-color:rgb(12 23 40/.12)}
[data-bs-scheme="light"] .text-white{color:var(--bs-text)}
[data-bs-scheme="light"] [class*="bg-[var(--bs-accent)]"],
[data-bs-scheme="light"] [class*="bg-[var(--bs-accent)]"] *,
[data-bs-scheme="light"] [class*="bg-rose-5"],[data-bs-scheme="light"] [class*="bg-rose-5"] *,
[data-bs-scheme="light"] [class*="bg-rose-6"],[data-bs-scheme="light"] [class*="bg-rose-6"] *,
[data-bs-scheme="light"] .bs-flow-btn,[data-bs-scheme="light"] .bs-flow-btn *,
[data-bs-scheme="light"] .bs-nav-selected,[data-bs-scheme="light"] .bs-nav-selected *{color:#fff}
[data-bs-scheme="light"] .fixed.inset-0.z-50{background:rgb(12 23 40/.38)}
[data-bs-scheme="light"] .app-loader-brand span{color:rgb(var(--bs-accent-600))}

/* ---------- Niveaux d'animation ---------- */
[data-bs-motion="soft"] body::before,
[data-bs-motion="soft"] .bs-flow-line,
[data-bs-motion="soft"] .bs-flow-btn,
[data-bs-motion="soft"] .bs-flow-btn::after,
[data-bs-motion="soft"] .bs-app-bg-flow,
[data-bs-motion="soft"] .bs-glow-pulse,
[data-bs-motion="soft"] .text-3xl.font-black{animation:none}
[data-bs-motion="soft"] .bs-view-enter>*,
[data-bs-motion="soft"] .bs-card-anim{animation-duration:.24s;animation-delay:0s}
[data-bs-motion="none"] *,
[data-bs-motion="none"] *::before,
[data-bs-motion="none"] *::after{animation:none;transition-duration:.001ms}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms;transition-duration:.01ms}
}

@media print{
  .fixed,.sticky,#bs-panel,#bs-toast,body::before,body::after{display:none}
  html,body{background:#fff;color:#111}
  *{box-shadow:none;backdrop-filter:none}
}

/* ===================================================================
   Carte d'entrée « Apparence » dans l'onglet Réglages
   =================================================================== */
.bs-appearance-card{
  width:100%;text-align:left;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:14px;
  padding:16px;border-radius:var(--bs-r);
  border:1px solid rgb(255 255 255/.12);
  background:
    radial-gradient(120% 140% at 88% 0%, rgb(var(--bs-accent-500)/.34), transparent 58%),
    linear-gradient(160deg,rgb(var(--bs-surface-rgb)/.92),rgb(var(--bs-bg-rgb)/.92));
  box-shadow:inset 0 1px 0 0 rgb(255 255 255/.14),0 16px 34px -24px rgb(0 0 0/.9);
  color:var(--bs-text);
  cursor:pointer;
}
[data-bs-scheme="light"] .bs-appearance-card{border-color:rgb(12 23 40/.10);color:var(--bs-text)}
.bs-appearance-card:hover{border-color:rgb(var(--bs-accent-400)/.45)}
.bs-ac-icon{
  width:44px;height:44px;flex:none;border-radius:calc(var(--bs-r) * .62);
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgb(var(--bs-accent-400)),rgb(var(--bs-accent-700)));
  box-shadow:inset 0 1px 0 0 rgb(255 255 255/.35),0 8px 18px -8px rgb(var(--bs-accent-500)/.8);
  color:#fff;
}
.bs-ac-txt{min-width:0;flex:1}
.bs-ac-title{display:block;font-weight:800;font-size:15px;letter-spacing:-.01em}
.bs-ac-sub{display:block;font-size:12px;color:var(--bs-text-muted);margin-top:2px}
.bs-ac-dots{display:flex;gap:5px;margin-top:9px}
.bs-ac-dots i{width:15px;height:15px;border-radius:5px;box-shadow:inset 0 0 0 1px rgb(255 255 255/.18)}
.bs-ac-go{flex:none;color:var(--bs-text-dim);font-size:12px;font-weight:700}

/* ===================================================================
   Panneau d'apparence — console de réglages
   =================================================================== */
#bs-panel{
  position:fixed;inset:0;z-index:100000;
  display:flex;align-items:flex-end;justify-content:center;
  font-family:var(--bs-ui),ui-sans-serif,system-ui,sans-serif;
  color:var(--bs-text);
  -webkit-font-smoothing:antialiased;
}
#bs-panel[hidden]{display:none}
#bs-panel .bsp-scrim{
  position:absolute;inset:0;
  background:rgb(2 6 14/.66);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:bspFade .22s ease both;
}
[data-bs-scheme="light"] #bs-panel .bsp-scrim{background:rgb(12 23 40/.34)}

#bs-panel .bsp-shell{
  position:relative;width:100%;max-width:1000px;
  height:min(92vh,880px);
  display:flex;flex-direction:column;
  border-radius:26px 26px 0 0;
  border:1px solid rgb(255 255 255/.13);
  border-bottom:none;
  background:
    radial-gradient(90% 60% at 82% -8%, rgb(var(--bs-accent-500)/.20), transparent 62%),
    linear-gradient(180deg, rgb(var(--bs-surface-rgb)/.97), rgb(var(--bs-bg-rgb)/.99));
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:inset 0 1px 0 0 rgb(255 255 255/.14), 0 -30px 90px -30px rgb(0 0 0/.9);
  animation:bspUp .42s cubic-bezier(.22,1,.36,1) both;
  overflow:hidden;
}
[data-bs-scheme="light"] #bs-panel .bsp-shell{
  border-color:rgb(12 23 40/.10);
  box-shadow:inset 0 1px 0 0 rgb(255 255 255/.9), 0 -26px 70px -26px rgb(12 23 40/.4);
}
@keyframes bspFade{from{opacity:0}to{opacity:1}}
@keyframes bspUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #bs-panel .bsp-shell,#bs-panel .bsp-scrim{animation:none}
}

/* ---- en-tête ---- */
#bs-panel .bsp-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px 12px;flex:none;position:relative;
}
#bs-panel .bsp-grip{
  position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:38px;height:4px;border-radius:99px;background:rgb(var(--bs-accent-300)/.35);
}
#bs-panel .bsp-mark{
  width:36px;height:36px;flex:none;border-radius:11px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(160deg,rgb(var(--bs-accent-400)),rgb(var(--bs-accent-700)));
  box-shadow:inset 0 1px 0 0 rgb(255 255 255/.4),0 8px 18px -10px rgb(var(--bs-accent-500)/.9);
}
#bs-panel .bsp-h1{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
#bs-panel .bsp-h2{font-size:11.5px;color:var(--bs-text-dim);margin-top:2px}
#bs-panel .bsp-head .bsp-sp{flex:1}
#bs-panel .bsp-x{
  width:34px;height:34px;flex:none;border-radius:11px;border:1px solid rgb(255 255 255/.12);
  background:rgb(255 255 255/.05);color:var(--bs-text-muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#bs-panel .bsp-x:hover{background:rgb(255 255 255/.1);color:var(--bs-text)}
[data-bs-scheme="light"] #bs-panel .bsp-x{border-color:rgb(12 23 40/.12);background:rgb(12 23 40/.04)}

/* ---- corps ---- */
#bs-panel .bsp-body{flex:1;min-height:0;display:flex;flex-direction:column}
#bs-panel .bsp-rail{
  display:flex;gap:7px;overflow-x:auto;padding:2px 16px 12px;flex:none;
  scrollbar-width:none;
}
#bs-panel .bsp-rail::-webkit-scrollbar{display:none}
#bs-panel .bsp-tab{
  display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;
  padding:8px 13px;border-radius:12px;font-size:13px;font-weight:600;
  border:1px solid rgb(255 255 255/.10);background:rgb(255 255 255/.04);
  color:var(--bs-text-muted);
}
[data-bs-scheme="light"] #bs-panel .bsp-tab{border-color:rgb(12 23 40/.09);background:rgb(12 23 40/.03)}
#bs-panel .bsp-tab svg{width:15px;height:15px;opacity:.9}
#bs-panel .bsp-tab:hover{color:var(--bs-text)}
#bs-panel .bsp-tab[aria-selected="true"]{
  color:#fff;border-color:transparent;
  background:linear-gradient(160deg,rgb(var(--bs-accent-400)),rgb(var(--bs-accent-700)));
  box-shadow:inset 0 1px 0 0 rgb(255 255 255/.3),0 6px 16px -8px rgb(var(--bs-accent-500)/.9);
}
#bs-panel .bsp-main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 18px;overscroll-behavior:contain}
#bs-panel .bsp-pane{display:none;animation:bspIn .3s cubic-bezier(.22,1,.36,1) both}
#bs-panel .bsp-pane.on{display:block}
@keyframes bspIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- aperçu ---- */
#bs-panel .bsp-prev{
  position:sticky;top:0;z-index:2;margin-bottom:14px;

          row('spotlight', 'Halo au curseur', 'Une lueur suit le pointeur sur les cartes.', sw('spotlight')) +
          row('shine', 'Reflet sur les titres', '', sw('shine'))) +
        group('Rendu',
          row('sat', 'Saturation', '', rng('sat', .6, 1.4, .02)) +
          row('con', 'Contraste', '', rng('con', .85, 1.2, .01)) +
          row('bri', 'Luminosité', '', rng('bri', .8, 1.2, .01))) +
        '<div class="bsp-acts"><button type="button" class="bsp-btn" data-act="perf">Mode économe</button>' +
        '<button type="button" class="bsp-btn" data-act="reset-fx">Rétablir les effets</button></div>' +
        '<div class="bsp-note">Le mode économe coupe le flou, l\'aurore et les animations d\'ambiance : utile sur un téléphone ancien ou en batterie faible.</div>',

      start: group('Lancement',
        row('splash', 'Écran de démarrage', 'Durée d\'affichage du logo à l\'ouverture.', rng('splash', 0, 6000, 100)) +
        row('navFlash', 'Transition entre onglets', 'Bref voile de chargement à chaque changement d\'onglet.', sw('navFlash')) +
        row('sound', 'Son d\'ouverture', 'Deux notes discrètes au démarrage.', sw('sound')) +
        row('haptics', 'Vibration au toucher', 'Retour haptique sur la barre de navigation.', sw('haptics'))) +
        '<div class="bsp-acts"><button type="button" class="bsp-btn" data-act="chime">Écouter le son</button>' +
        '<button type="button" class="bsp-btn" data-act="replay">Revoir le démarrage</button></div>',

      data: group('Apparence',
        '<div class="bsp-acts">' +
        '<button type="button" class="bsp-btn" data-act="theme-export">Enregistrer le thème</button>' +
        '<button type="button" class="bsp-btn" data-act="theme-import">Charger un thème</button>' +
        '<button type="button" class="bsp-btn" data-act="theme-copy">Copier le code</button>' +
        '</div>') +
        group('Données du CRM',
          '<div class="bsp-acts">' +
          '<button type="button" class="bsp-btn" data-act="data-export">Exporter prospects et devis</button>' +
          '<button type="button" class="bsp-btn" data-act="data-import">Importer une sauvegarde</button>' +
          '</div>' +
          '<div class="bsp-note" data-info></div>' +
          '<div class="bsp-acts"><button type="button" class="bsp-btn warn" data-act="data-clear">Effacer toutes les données</button></div>') +
        '<div class="bsp-note">Les sauvegardes sont des fichiers JSON lisibles, stockés sur votre appareil. L\'import remplace les données existantes et recharge l\'application.</div>'
    };
  }

  /* ------------------------------------------------ construction */
  var TABS = [
    ['theme', 'Thème', I.theme],
    ['color', 'Couleurs', I.color],
    ['layout', 'Interface', I.layout],
    ['fx', 'Effets', I.fx],
    ['start', 'Démarrage', I.start],
    ['data', 'Données', I.data]
  ];

  function build() {
    var P = panes(), rail = '', body = '', i;
    for (i = 0; i < TABS.length; i++) {
      rail += '<button type="button" class="bsp-tab" role="tab" data-tab="' + TABS[i][0] + '"' +
        (i === 0 ? ' aria-selected="true"' : '') + '>' + TABS[i][2] + TABS[i][1] + '</button>';
      body += '<div class="bsp-pane' + (i === 0 ? ' on' : '') + '" data-pane="' + TABS[i][0] + '">' + P[TABS[i][0]] + '</div>';
    }

    el = document.createElement('div');
    el.id = 'bs-panel';
    el.hidden = true;
    el.innerHTML =
      '<div class="bsp-scrim" data-close></div>' +
      '<div class="bsp-shell" role="dialog" aria-modal="true" aria-label="Apparence de l\'application" tabindex="-1">' +
        '<div class="bsp-head">' +
          '<div class="bsp-grip"></div>' +
          '<div class="bsp-mark">' + I.mark + '</div>' +
          '<div><div class="bsp-h1">Apparence</div><div class="bsp-h2">Blackstart AI — réglages de l\'interface</div></div>' +
          '<div class="bsp-sp"></div>' +
          '<button type="button" class="bsp-x" data-close aria-label="Fermer">' + I.close + '</button>' +
        '</div>' +
        '<div class="bsp-body">' +
          '<div class="bsp-rail" role="tablist">' + rail + '</div>' +
          '<div class="bsp-main">' +
            '<div class="bsp-prev">' +
              '<div class="bsp-prev-left">' +
                '<div class="bsp-prev-top"><span class="bsp-prev-title">Aujourd\'hui</span><span class="bsp-prev-pill">En ligne</span></div>' +
                '<div class="bsp-prev-card">' +
                  '<div class="bsp-prev-kpi">119<small>/175</small></div>' +
                  '<div class="bsp-prev-lab">Appels cette semaine</div>' +
                  '<div class="bsp-prev-bar"><i></i></div>' +
                '</div>' +
              '</div>' +
              '<div class="bsp-prev-dock"><i class="on"></i><i></i><i></i><i></i><i></i></div>' +
            '</div>' +
            body +
          '</div>' +
        '</div>' +
        '<div class="bsp-foot">' +
          '<button type="button" class="bsp-btn" data-act="reset-all">Tout réinitialiser</button>' +
          '<div class="bsp-sp"></div>' +
          '<button type="button" class="bsp-btn solid" data-close>Terminé</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(el);

    el.addEventListener('click', onClick);
    el.addEventListener('input', onInput);
    el.addEventListener('change', onInput);
    el.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute('data-sw')) {
        e.preventDefault();
        toggle(e.target.getAttribute('data-sw'));
      }
    });
    sync();
  }

  /* ------------------------------------------------ évènements */
  function commit(patch, quiet) {
    for (var k in patch) cfg[k] = patch[k];
    B.apply();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(B.save, 220);
    if (!quiet) sync();
  }
  function toggle(k) { commit(mk(k, !cfg[k])); }
  function mk(k, v) { var o = {}; o[k] = v; return o; }

  function onClick(e) {
    var t = e.target.closest ? e.target.closest('[data-close],[data-sw],[data-seg],[data-auto],[data-preset],[data-tab],[data-act]') : null;
    if (!t) return;
    if (t.hasAttribute('data-close')) return close();
    if (t.hasAttribute('data-tab')) return tab(t.getAttribute('data-tab'));
    if (t.hasAttribute('data-sw')) return toggle(t.getAttribute('data-sw'));
    if (t.hasAttribute('data-auto')) return commit(mk(t.getAttribute('data-auto'), ''));
    if (t.hasAttribute('data-preset')) { B.usePreset(t.getAttribute('data-preset')); sync(); return; }
    if (t.hasAttribute('data-seg')) {
      var k = t.getAttribute('data-seg'), v = t.getAttribute('data-v');
      if (k === 'scheme') { B.useScheme(v); sync(); return; }
      return commit(mk(k, v));
    }
    if (t.hasAttribute('data-act')) return act(t.getAttribute('data-act'));
  }

  function onInput(e) {
    var t = e.target, k, v;
    if (t.hasAttribute('data-range')) {
      k = t.getAttribute('data-range');
      v = INT[k] ? parseInt(t.value, 10) : parseFloat(t.value);
      cfg[k] = v; B.apply();
      clearTimeout(saveTimer); saveTimer = setTimeout(B.save, 220);
      paintRange(t, k, v);
      if (k === 'scale' || k === 'radius') paintPreview();
      return;
    }
    if (t.hasAttribute('data-color')) {
      k = t.getAttribute('data-color');
      commit(mk(k, t.value));
      return;
    }
    if (t.hasAttribute('data-hex')) {
      k = t.getAttribute('data-hex');
      v = t.value.trim();
      if (v === '') { commit(mk(k, '')); return; }
      if (v.charAt(0) !== '#') v = '#' + v;
      if (U.h2r(v)) commit(mk(k, v));
      return;
    }
  }

  function tab(id) {
    var i, a = el.querySelectorAll('[data-tab]'), b = el.querySelectorAll('[data-pane]');
    for (i = 0; i < a.length; i++) a[i].setAttribute('aria-selected', a[i].getAttribute('data-tab') === id ? 'true' : 'false');
    for (i = 0; i < b.length; i++) b[i].classList.toggle('on', b[i].getAttribute('data-pane') === id);
    var m = el.querySelector('.bsp-main'); if (m) m.scrollTop = 0;
    if (id === 'data') info();
  }

  /* ------------------------------------------------ synchronisation */
  function paintRange(node, k, v) {
    var min = parseFloat(node.min), max = parseFloat(node.max);
    node.style.setProperty('--p', ((v - min) / (max - min) * 100) + '%');
    var out = el.querySelector('[data-out="' + k + '"]');
    if (out) out.textContent = FMT[k] ? FMT[k](v) : v;
  }

  function sync() {
    if (!el) return;
    var i, n, k, v, list;

    list = el.querySelectorAll('[data-sw]');
    for (i = 0; i < list.length; i++) list[i].setAttribute('aria-checked', cfg[list[i].getAttribute('data-sw')] ? 'true' : 'false');

    list = el.querySelectorAll('[data-seg]');
    for (i = 0; i < list.length; i++) {
      n = list[i]; k = n.getAttribute('data-seg');
      v = k === 'scheme' ? cfg.scheme : cfg[k];
      n.setAttribute('aria-pressed', String(v) === n.getAttribute('data-v') ? 'true' : 'false');
    }

    list = el.querySelectorAll('[data-range]');
    for (i = 0; i < list.length; i++) {
      n = list[i]; k = n.getAttribute('data-range');
      n.value = cfg[k];
      paintRange(n, k, cfg[k]);
    }

    list = el.querySelectorAll('[data-hex]');
    for (i = 0; i < list.length; i++) {
      n = list[i]; k = n.getAttribute('data-hex');
      n.value = cfg[k] ? String(cfg[k]).toUpperCase() : '';
      n.placeholder = cfg[k] ? '' : 'auto';
    }
    list = el.querySelectorAll('[data-well]');
    for (i = 0; i < list.length; i++) {
      n = list[i]; k = n.getAttribute('data-well');
      v = cfg[k] || getComputedStyle(document.documentElement).getPropertyValue('--bs-' + (k === 'gauge' ? 'gauge' : 'accent')).trim() || cfg.accent;
      n.style.background = v;
      var inp = n.querySelector('input'); if (inp && U.h2r(v)) inp.value = v;
    }
    list = el.querySelectorAll('[data-auto]');
    for (i = 0; i < list.length; i++) list[i].setAttribute('aria-pressed', cfg[list[i].getAttribute('data-auto')] ? 'false' : 'true');

    list = el.querySelectorAll('[data-preset]');
    for (i = 0; i < list.length; i++) list[i].setAttribute('aria-pressed', list[i].getAttribute('data-preset') === cfg.preset ? 'true' : 'false');

    var ramp = el.querySelector('[data-ramp]');
    if (ramp) {
      var R = U.ramp(cfg.accent), h = '';
      for (i = 0; i < B.STEPS.length; i++) h += '<i style="background:rgb(' + U.str(R[B.STEPS[i]]) + ')"></i>';
      ramp.innerHTML = h;
    }
    paintPreview();
  }

  function paintPreview() {
    var p = el && el.querySelector('.bsp-prev-card');
    if (p) p.style.borderRadius = Math.round(cfg.radius * 0.78) + 'px';
    var d = el && el.querySelector('.bsp-prev-dock');
    if (d) d.style.borderRadius = Math.round(cfg.radius * (cfg.dock === 'float' ? 0.9 : 0.35)) + 'px';
  }

  /* ------------------------------------------------ actions */
  function toast(msg) {
    var t = document.getElementById('bs-toast');
    if (!t) { t = document.createElement('div'); t.id = 'bs-toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove('on'); }, 2400);
  }

  function download(name, text) {
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 400);
      return true;
    } catch (e) { return false; }
  }

  function pickFile(cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { cb(String(fr.result)); };
      fr.readAsText(f);
    };
    inp.click();
  }

  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function info() {
    var box = el.querySelector('[data-info]');
    if (!box) return;
    try {
      var raw = localStorage.getItem(B.APPKEY);
      if (!raw) { box.textContent = 'Aucune donnée enregistrée pour le moment.'; return; }
      var d = JSON.parse(raw) || {};
      var np = (d.prospects || []).length, nd = (d.devisList || []).length;
      box.textContent = np + ' prospect' + (np > 1 ? 's' : '') + ' et ' + nd + ' devis, soit ' +
        Math.max(1, Math.round(raw.length / 1024)) + ' Ko sur cet appareil.';
    } catch (e) { box.textContent = 'Données illisibles sur cet appareil.'; }
  }

  function chime() {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      var ctx = new C(), now = ctx.currentTime;
      var master = ctx.createGain();
      master.gain.setValueAtTime(1, now);
      master.connect(ctx.destination);
      [[587.33, 0, .22, .16], [880, .1, .3, .14]].forEach(function (n) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(n[0], now + n[1]);
        g.gain.setValueAtTime(0, now + n[1]);
        g.gain.linearRampToValueAtTime(n[3], now + n[1] + .02);
        g.gain.exponentialRampToValueAtTime(.0001, now + n[1] + n[2]);
        o.connect(g); g.connect(master);
        o.start(now + n[1]); o.stop(now + n[1] + n[2] + .05);
      });
      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 900);
    } catch (e) { /* audio indisponible */ }
  }

  function act(id) {
    if (id === 'reset-all') {
      B.reset(); sync(); toast('Apparence réinitialisée'); return;
    }
    if (id === 'reset-fx') {
      B.reset(['blur', 'shadow', 'aurora', 'grid', 'motion', 'lift', 'spotlight', 'shine', 'sat', 'con', 'bri']);
      sync(); toast('Effets rétablis'); return;
    }
    if (id === 'perf') {
      commit({ blur: 0, aurora: .12, grid: 0, motion: 'soft', lift: false, spotlight: false, shine: false, shadow: .5 });
      toast('Mode économe activé'); return;
    }
    if (id === 'chime') { chime(); return; }
    if (id === 'replay') {
      var l = document.getElementById('app-loader');
      if (!l) return;
      l.classList.remove('app-loader-hidden');
      setTimeout(function () { l.classList.add('app-loader-hidden'); }, Math.max(700, cfg.splash));
      close();
      return;
    }
    if (id === 'theme-export') {
      download('blackstart-theme-' + stamp() + '.json', JSON.stringify(cfg, null, 2));
      toast('Thème enregistré'); return;
    }
    if (id === 'theme-copy') {
      var txt = JSON.stringify(cfg);
      try {
        navigator.clipboard.writeText(txt).then(function () { toast('Code du thème copié'); },
          function () { toast('Copie refusée par le navigateur'); });
      } catch (e) { toast('Copie indisponible ici'); }
      return;
    }
    if (id === 'theme-import') {
      pickFile(function (txt) {
        try {
          var o = JSON.parse(txt), patch = {};
          for (var k in B.DEFAULTS) if (Object.prototype.hasOwnProperty.call(o, k)) patch[k] = o[k];
          if (!Object.keys(patch).length) { toast('Ce fichier ne contient pas de thème'); return; }
          commit(patch); toast('Thème appliqué');
        } catch (e) { toast('Fichier illisible'); }
      });
      return;
    }
    if (id === 'data-export') {
      var raw = null;
      try { raw = localStorage.getItem(B.APPKEY); } catch (e) {}
      if (!raw) { toast('Aucune donnée à exporter'); return; }
      download('blackstart-donnees-' + stamp() + '.json', raw);
      toast('Sauvegarde enregistrée'); return;
    }
    if (id === 'data-import') {
      pickFile(function (txt) {
        var o;
        try { o = JSON.parse(txt); } catch (e) { toast('Fichier illisible'); return; }
        if (!o || (!o.prospects && !o.settings && !o.devisList)) { toast('Ce fichier n\'est pas une sauvegarde Blackstart'); return; }
        if (!confirm('Remplacer les données actuelles par cette sauvegarde ? L\'application va se recharger.')) return;
        try { localStorage.setItem(B.APPKEY, JSON.stringify(o)); location.reload(); }
        catch (e) { toast('Enregistrement impossible'); }
      });
      return;
    }
    if (id === 'data-clear') {
      if (!confirm('Effacer prospects, devis et réglages de cet appareil ? Cette action est définitive.')) return;
      try { localStorage.removeItem(B.APPKEY); location.reload(); }
      catch (e) { toast('Suppression impossible'); }
      return;
    }
  }

  /* ------------------------------------------------ ouverture */
  function open() {
    if (!el) build();
    lastFocus = document.activeElement;
    el.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    sync(); info();
    var shell = el.querySelector('.bsp-shell');
    if (shell) shell.focus();
  }
  function close() {
    if (!el) return;
    el.hidden = true;
    document.documentElement.style.overflow = '';
    B.save();
    try { if (lastFocus && lastFocus.focus) lastFocus.focus(); } catch (e) {}
  }

  B.open = open;
  B.close = close;
  B.toast = toast;

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && el && !el.hidden) { e.preventDefault(); close(); }
    if ((e.metaKey || e.ctrlKey) && (e.key === ',' || e.key === '<')) { e.preventDefault(); open(); }
  });

  if (B.pending) open();

  /* ------------------------------------------------ finitions de l'app */

  // Halo qui suit le curseur sur les cartes
  (function spotlight() {
    if (!window.matchMedia || !window.matchMedia('(hover:hover)').matches) return;
    var cur = null, raf = 0, px = 0, py = 0;
    document.addEventListener('pointermove', function (e) {
      if (!cfg.spotlight) return;
      var card = e.target.closest ? e.target.closest('[class*="bg-[var(--bs-surface)]"]') : null;
      if (card !== cur) {
        if (cur) cur.classList.remove('bs-spot');
        cur = card;
        if (cur) cur.classList.add('bs-spot');
      }
      if (!cur) return;
      px = e.clientX; py = e.clientY;
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = 0;
        if (!cur) return;
        var r = cur.getBoundingClientRect();
        cur.style.setProperty('--bs-mx', (px - r.left) + 'px');
        cur.style.setProperty('--bs-my', (py - r.top) + 'px');
      });
    }, { passive: true });
  })();

  // Vibration courte sur la barre de navigation
  document.addEventListener('click', function (e) {
    if (!cfg.haptics || !navigator.vibrate) return;
    var n = e.target.closest ? e.target.closest('.nav-item') : null;
    if (n) { try { navigator.vibrate(8); } catch (err) {} }
  }, true);

  // Animation d'entrée à chaque changement de vue
  (function viewEnter() {
    function hook() {
      var root = document.getElementById('root');
      var main = root && root.querySelector('.relative.px-4.pt-4');
      if (!main) return setTimeout(hook, 250);
      function play() {
        if (cfg.motion === 'none') return;
        main.classList.remove('bs-view-enter');
        void main.offsetWidth;
        main.classList.add('bs-view-enter');
      }
      play();
      var last = main.firstElementChild;
      new MutationObserver(function () {
        if (main.firstElementChild !== last) { last = main.firstElementChild; play(); }
      }).observe(main, { childList: true });
    }
    setTimeout(hook, 300);
  })();
})();
</script>

<style id="bs-premium">
/* =====================================================================
   BLACKSTART — Couche PREMIUM (v3.1)
   Se greffe sur l'interface v3 sans rien déplacer : icônes duotone et
   en relief, tuiles 3D, profondeur des cartes, micro-animations.
   Respecte data-bs-motion (full / soft / none) et prefers-reduced-motion.
   ===================================================================== */
@property --bs-ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

:root {
  --bs-spring: cubic-bezier(.34, 1.56, .64, 1);
  --bs-silk: cubic-bezier(.16, 1, .3, 1);
}

/* ---------- Netteté « haute définition » ---------- */
html { text-rendering: geometricPrecision; }
svg { shape-rendering: geometricPrecision; }

/* ---------- Icônes : trait net + duotone ---------- */
svg[data-ic] { overflow: visible; }
svg[data-ic] path, svg[data-ic] line, svg[data-ic] polyline, svg[data-ic] rect,
svg[data-ic] circle, svg[data-ic] ellipse, svg[data-ic] polygon {
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
}
svg[data-ic] rect, svg[data-ic] ellipse, svg[data-ic] polygon,
svg[data-ic] circle[data-bs-fill], svg[data-ic] path[data-bs-fill] {
  fill: currentColor;
  fill-opacity: .17;
}
svg[data-ic] circle[data-bs-dot] { fill: currentColor; fill-opacity: 1; }
svg[data-ic] { filter: drop-shadow(0 1px .5px rgb(0 0 0 / .28)); }
[data-bs-scheme="light"] svg[data-ic] { filter: none; }

/* ---------- Tuiles d'icônes en relief 3D ---------- */
[data-bs-tile] {
  isolation: isolate;
  background:
    radial-gradient(120% 90% at 28% 12%, rgb(255 255 255 / .42), rgb(255 255 255 / 0) 52%),
    linear-gradient(155deg, rgb(var(--bs-accent-300)) 0%, rgb(var(--bs-accent-500)) 42%, rgb(var(--bs-accent-700)) 100%) !important;
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / .55),
    inset 0 -2px 0 rgb(0 0 0 / .22),
    inset 0 0 0 1px rgb(255 255 255 / .14),
    0 1px 1px rgb(0 0 0 / .25),
    0 8px 18px -6px rgb(var(--bs-accent-500) / .75),
    0 16px 30px -18px rgb(var(--bs-accent-700) / .9) !important;
  transform: translateZ(0);
  transition: transform .45s var(--bs-spring), box-shadow .35s var(--bs-silk), filter .3s ease;
}
[data-bs-tile][data-tone="slate"], [data-bs-tile][data-tone="ghost"] {

    host.className = 'bs-ripple-host';
    host.setAttribute('aria-hidden', 'true');
    var dot = document.createElement('span');
    var size = Math.max(r.width, r.height) * 2.4;
    dot.className = 'bs-ripple';
    dot.style.width = dot.style.height = size + 'px';
    dot.style.left = e.clientX - r.left + 'px';
    dot.style.top = e.clientY - r.top + 'px';
    host.appendChild(dot);
    b.appendChild(host);
    setTimeout(function () { if (host.parentNode) host.parentNode.removeChild(host); }, 700);
  }, { passive: true, capture: true });

  /* ---------- 6. Rebond de l'icône à la sélection d'un onglet ---------- */
  document.addEventListener('click', function (e) {
    var n = e.target.closest ? e.target.closest('.nav-item') : null;
    if (!n || !animOk()) return;
    setTimeout(function () {
      var s = n.querySelector('svg[data-ic]');
      if (!s) return;
      s.classList.remove('bs-pop');
      void s.getBoundingClientRect();
      s.classList.add('bs-pop');
      setTimeout(function () { s.classList.remove('bs-pop'); }, 650);
    }, 30);
  }, true);

  /* ---------- 7. Entrées en cascade ---------- */
  var ENTER_SEL = CARD_SEL + ', button.no-hover-fx[class*="border-blue-500/30"]';
  function stagger(nodes) {
    if (!animOk()) return;
    var i = 0;
    for (var k = 0; k < nodes.length && i < 14; k++) {
      var el = nodes[k];
      if (el.hasAttribute('data-bs-in') || el.closest('.fixed.bottom-0, #bs-panel, [data-bs-in]')) continue;
      var an = getComputedStyle(el).animationName;
      if (an && an !== 'none') continue;
      var r = el.getBoundingClientRect();
      if (r.top > innerHeight + 40 || r.bottom < -40) continue;
      el.style.setProperty('--bs-i', String(i++));
      el.setAttribute('data-bs-in', '');
    }
  }

  /* ---------- Observation du DOM (React) ---------- */
  var pending = [];
  var scheduled = false;
  function scan(scope) {
    var svgs = scope.querySelectorAll ? scope.querySelectorAll('svg') : [];
    for (var i = 0; i < svgs.length; i++) tagIcon(svgs[i]);
    if (scope.tagName === 'svg') tagIcon(scope);
    var tiles = scope.querySelectorAll ? scope.querySelectorAll('.relative.overflow-hidden.shrink-0') : [];
    for (var j = 0; j < tiles.length; j++) tagTile(tiles[j]);
    var cards = scope.querySelectorAll ? scope.querySelectorAll(CARD_SEL) : [];
    for (var k = 0; k < cards.length; k++) tagCard(cards[k]);
    if (scope.matches && scope.matches(CARD_SEL)) tagCard(scope);
    stagger(scope.querySelectorAll ? scope.querySelectorAll(ENTER_SEL) : []);
  }
  function flush() {
    scheduled = false;
    var list = pending;
    pending = [];
    for (var i = 0; i < list.length; i++) if (list[i].isConnected) scan(list[i]);
  }
  new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      var a = muts[i].addedNodes;
      for (var j = 0; j < a.length; j++) if (a[j].nodeType === 1 && !(a[j].classList && a[j].classList.contains('bs-ripple-host'))) pending.push(a[j]);
    }
    if (pending.length && !scheduled) {
      scheduled = true;
      requestAnimationFrame(flush);
    }
  }).observe(document.body, { childList: true, subtree: true });
  scan(document.body);
})();
</script>
</body>
