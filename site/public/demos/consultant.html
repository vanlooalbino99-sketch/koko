<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackstart Conseil — CRM du consultant</title>
<meta name="description" content="CRM de démonstration pour consultants indépendants et cabinets de conseil : pipeline de missions, TJM, staffing et plan de charge, jalons de facturation, relances de propositions et opportunités d'extension.">
<style>
:root{
  --brand-l:#0F766E; --brand-ink-l:#FFFFFF; --brand-d:#4FC1B3; --brand-ink-d:#0B0D17;
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#F0F2F7; --surface-3:#E7EAF1;
  --border:#E1E4EC; --border-strong:#C9CED9;
  --text:#151925; --muted:#565E70; --faint:#8A91A1;
  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l);
  --brand-soft:color-mix(in srgb, var(--brand) 10%, var(--surface));
  --brand-line:color-mix(in srgb, var(--brand) 35%, var(--surface));
  --ok:#11703E; --warn:#975400; --danger:#B4232A; --info:#1C5DA6;
  --ok-soft:color-mix(in srgb, var(--ok) 11%, var(--surface));
  --warn-soft:color-mix(in srgb, var(--warn) 12%, var(--surface));
  --danger-soft:color-mix(in srgb, var(--danger) 10%, var(--surface));
  --info-soft:color-mix(in srgb, var(--info) 10%, var(--surface));
  --chart-2:#6D5BD0; --chart-grid:#E6E9F0;
  --overlay:rgba(14,17,28,.42);
  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.05);
  --shadow-hover:0 4px 14px rgba(16,24,40,.10), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 18px 48px rgba(16,24,40,.20), 0 2px 8px rgba(16,24,40,.08);
  --skel-a:#ECEEF3; --skel-b:#F6F7FA;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F15; --surface:#151821; --surface-2:#1B1F2A; --surface-3:#242936;
    --border:#272C39; --border-strong:#3A4152;
    --text:#E9EBF1; --muted:#A3AABA; --faint:#7D8496;
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d);
    --brand-soft:color-mix(in srgb, var(--brand) 14%, var(--surface));
    --brand-line:color-mix(in srgb, var(--brand) 40%, var(--surface));
    --ok:#4CC985; --warn:#F2A846; --danger:#F47A7A; --info:#6AAEF5;
    --ok-soft:color-mix(in srgb, var(--ok) 13%, var(--surface));
    --warn-soft:color-mix(in srgb, var(--warn) 13%, var(--surface));
    --danger-soft:color-mix(in srgb, var(--danger) 13%, var(--surface));
    --info-soft:color-mix(in srgb, var(--info) 13%, var(--surface));
    --chart-2:#A99BF5; --chart-grid:#252A36;
    --overlay:rgba(0,0,0,.58);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    --shadow-hover:0 6px 18px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    --shadow-lg:0 18px 48px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
    --skel-a:#1E2230; --skel-b:#262B3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F15; --surface:#151821; --surface-2:#1B1F2A; --surface-3:#242936;
  --border:#272C39; --border-strong:#3A4152;
  --text:#E9EBF1; --muted:#A3AABA; --faint:#7D8496;
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d);
  --brand-soft:color-mix(in srgb, var(--brand) 14%, var(--surface));
  --brand-line:color-mix(in srgb, var(--brand) 40%, var(--surface));
  --ok:#4CC985; --warn:#F2A846; --danger:#F47A7A; --info:#6AAEF5;
  --ok-soft:color-mix(in srgb, var(--ok) 13%, var(--surface));
  --warn-soft:color-mix(in srgb, var(--warn) 13%, var(--surface));
  --danger-soft:color-mix(in srgb, var(--danger) 13%, var(--surface));
  --info-soft:color-mix(in srgb, var(--info) 13%, var(--surface));
  --chart-2:#A99BF5; --chart-grid:#252A36;
  --overlay:rgba(0,0,0,.58);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
  --shadow-hover:0 6px 18px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 18px 48px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  --skel-a:#1E2230; --skel-b:#262B3A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand)}
svg{flex-shrink:0}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.xs{width:13px;height:13px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* Barre latérale */
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;min-width:0}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-sep{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:12px 10px 4px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;color:var(--muted);font-weight:550;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.active{background:var(--brand-soft);color:var(--brand)}
.nav .lbl-short{display:none}
.nav .pill{margin-left:auto;font-size:11.5px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-3);color:var(--muted);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.nav button.active .pill{background:var(--brand);color:var(--brand-ink)}
.me{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding:12px 6px 0;margin-top:8px}
.me-name{font-weight:600;font-size:13px}.me-role{font-size:11.5px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--text);border:1px solid var(--border);flex-shrink:0}
.avatar.sm{width:24px;height:24px;font-size:10px}
.avatar.lg{width:44px;height:44px;font-size:15px}
/* Zone principale */
.main{min-width:0;display:flex;flex-direction:column}
.demo-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 28px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.demo-banner .tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text)}
.demo-banner .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.demo-banner .sp{flex:1}
.linkbtn{color:var(--brand);font-weight:600;min-height:28px;padding:0 6px;border-radius:6px}
.linkbtn:hover{background:var(--brand-soft)}
.topbar{display:flex;align-items:center;gap:12px;padding:20px 28px 8px}
.mobile-brand{display:none}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0}
.page-sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbar .sp{flex:1}
.searchbtn{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 10px 0 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);min-width:230px}
.searchbtn:hover{border-color:var(--border-strong)}
kbd{font:11px/1 Inter,system-ui,sans-serif;padding:3px 6px;border-radius:5px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
.searchbtn kbd{margin-left:auto}
.view{padding:10px 28px 48px;animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,filter .15s,transform .1s}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:9px;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:32px;height:32px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);gap:2px}
.seg button{min-height:32px;padding:0 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.input,.select,textarea.input{min-height:38px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:100%}
textarea.input{padding:10px 11px;line-height:1.5;resize:vertical}
.input:focus,.select:focus{outline:2px solid var(--brand-line);border-color:var(--brand)}
.select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.field-lbl{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 5px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.toolbar .sp{flex:1}
.toolbar .input,.toolbar .select{width:auto}
.toolbar .search{position:relative}
.toolbar .search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.toolbar .search .input{padding-left:34px;width:240px}
/* Cartes & grilles */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:650}
.card-h .sp{flex:1}
.card-b{padding:4px 16px 16px}
.grid{display:grid;gap:14px}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:15px 16px 14px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 4px;line-height:1.1;white-space:nowrap}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.key{border-color:var(--brand-line)}
.kpi.key::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--brand)}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;padding:2px 7px;border-radius:20px;font-variant-numeric:tabular-nums}
.delta.up{background:var(--ok-soft);color:var(--ok)}.delta.down{background:var(--danger-soft);color:var(--danger)}.delta.flat{background:var(--surface-2);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);white-space:nowrap;line-height:1.5}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 8px 2px 6px;border-radius:6px;background:var(--surface-2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{min-height:32px;padding:0 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:12.5px;color:var(--muted)}
.fchip.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.gauge{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.gauge>i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gauge.ok>i{background:var(--ok)}.gauge.warn>i{background:var(--warn)}.gauge.danger>i{background:var(--danger)}
/* Listes d'actions */
.rows{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 8px;border-radius:8px;text-align:left;width:100%}
.row-item:hover{background:var(--surface-2)}
.row-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .grow{flex:1;min-width:0}
.ri-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex-shrink:0}
.ri-ico.danger{background:var(--danger-soft);color:var(--danger)}.ri-ico.warn{background:var(--warn-soft);color:var(--warn)}.ri-ico.ok{background:var(--ok-soft);color:var(--ok)}.ri-ico.brand{background:var(--brand-soft);color:var(--brand)}
/* Graphiques */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .v{fill:var(--text);font-weight:650;font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Kanban */
.board-wrap{overflow-x:auto;overflow-y:hidden;height:calc(100vh - 205px);min-height:440px;padding-bottom:8px;overscroll-behavior-x:contain}
.board{display:flex;gap:12px;height:100%;width:max-content}
.col{width:284px;flex:0 0 284px;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);max-height:100%;transition:outline-color .15s, background .15s;outline:2px dashed transparent;outline-offset:-2px}
.col.drop-hover{outline-color:var(--brand);background:var(--brand-soft)}
.col-head{padding:10px 12px 9px;border-top:3px solid var(--stage);border-radius:var(--r) var(--r) 0 0;background:var(--surface-2);position:sticky;top:0;z-index:1}
.col-title{display:flex;align-items:center;gap:7px;font-weight:650}
.col-title .n{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.col-meta{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.col-body{flex:1;overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.drop-empty{border:1.5px dashed var(--border-strong);border-radius:9px;padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px}
.deal-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px 10px 12px;box-shadow:var(--shadow);cursor:grab;transition:transform .15s,box-shadow .15s,opacity .15s;text-align:left}
.deal-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.deal-card.dragging{opacity:.45}
.deal-card .dc-top{display:flex;align-items:flex-start;gap:6px}
.deal-card .dc-title{font-weight:650;line-height:1.3;flex:1;min-width:0}
.deal-card .dc-who{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal-card .dc-money{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-variant-numeric:tabular-nums}
.deal-card .dc-money b{font-size:14.5px}
.deal-card .dc-foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.deal-card .dc-foot .sp{flex:1}
.duepill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.duepill.late{background:var(--danger-soft);color:var(--danger)}
.duepill.soon{background:var(--warn-soft);color:var(--warn)}
.menu{position:fixed;z-index:80;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;animation:pop .14s ease both}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.menu .mh{font-size:11.5px;color:var(--faint);font-weight:650;padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.05em}
.menu button{display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:0 10px;border-radius:7px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu button.cur{color:var(--brand);font-weight:650}
.menu .sw{width:10px;height:10px;border-radius:3px;background:var(--stage)}
/* Tableaux */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{height:40px;text-align:left;font-size:12.5px;color:var(--muted);font-weight:650;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--text)}
.tbl th .arr{font-size:10px;margin-left:3px}
.tbl td{height:44px;padding:4px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .strong{font-weight:650}
.cell-sub{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stage);margin-right:6px}
/* États vides & squelettes */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 20px;color:var(--muted)}
.empty svg{width:120px;height:90px;margin-bottom:12px}
.empty h4{margin:0 0 4px;color:var(--text);font-size:15px}
.empty p{margin:0 0 14px;max-width:360px}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--skel-a),var(--skel-b),var(--skel-a));background-size:200% 100%;animation:sk 1.1s linear infinite;height:12px;margin:8px 0}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
/* Drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s;z-index:55}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s;z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible}
.dr-head{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.dr-top{display:flex;align-items:flex-start;gap:12px}
.dr-title{font-size:17px;font-weight:700;margin:0;line-height:1.3;letter-spacing:-.01em}
.dr-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.dr-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dr-body{flex:1;overflow-y:auto;padding:6px 18px 30px}
.sec{padding:14px 0 6px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-h h4{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.sec-h .sp{flex:1}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.fld{min-width:0;padding:5px 0}
.fld.wide{grid-column:1/-1}
.fld .k{font-size:12px;color:var(--muted);font-weight:600}
.fld .vv{display:block;width:100%;text-align:left;min-height:32px;padding:5px 7px;margin:1px -7px 0;border-radius:6px;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.fld button.vv:hover{background:var(--surface-2);border-color:var(--border)}
.fld .vv.ro{color:var(--muted)}
.fld .vv.empty-v{color:var(--faint);font-style:italic}
.fld .input,.fld .select{min-height:32px;margin-top:1px}
.stepper{display:flex;gap:3px;margin:12px 0 2px}
.stepper button{flex:1;min-width:0;height:28px;border-radius:5px;background:var(--surface-3);font-size:11px;font-weight:650;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.stepper button.done{background:var(--brand-soft);color:var(--brand)}
.stepper button.cur{background:var(--brand);color:var(--brand-ink)}
.stepper button.lost{background:var(--danger-soft);color:var(--danger)}
.check{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 8px;border-radius:8px;width:100%;text-align:left}
.check:hover{background:var(--surface-2)}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0;color:var(--brand-ink)}
.check.on .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check .ct{flex:1;min-width:0}
.check .cs{display:block;font-size:12px;color:var(--muted)}
.check.on .ctt{color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:2px}
.tl{display:flex;gap:10px;padding:8px 0;position:relative}
.tl .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex-shrink:0;border:1px solid var(--border)}
.tl .tx{flex:1;min-width:0}
.tl .tt{font-size:13.5px;white-space:pre-wrap;word-wrap:break-word}
.tl .tm{font-size:12px;color:var(--muted);margin-top:2px}
.composer{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface-2);margin-bottom:6px}
.composer textarea{border:0;background:transparent;width:100%;resize:vertical;min-height:54px;padding:4px 4px;outline:none}
.composer .crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.composer .crow .sp{flex:1}
/* Modales */
.modal-wrap{position:fixed;inset:0;display:grid;place-items:center;z-index:70;padding:16px;background:var(--overlay);animation:fade .15s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);animation:pop .18s ease both}
.modal.wide{width:min(820px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.modal-h h3{margin:0;font-size:16px;flex:1}
.modal-b{padding:4px 18px 16px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .wide{grid-column:1/-1}
.note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ai-out{min-height:260px;font-size:13.5px}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--brand)}
@keyframes blink{50%{opacity:0}}
.dropzone{border:1.5px dashed var(--border-strong);border-radius:10px;padding:16px;text-align:center;color:var(--muted);transition:background .15s,border-color .15s}
.dropzone.over{background:var(--brand-soft);border-color:var(--brand)}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;align-items:center}
.preview{overflow-x:auto;margin-top:12px;border:1px solid var(--border);border-radius:8px}
.preview table{border-collapse:collapse;font-size:12.5px;width:100%}
.preview td,.preview th{padding:6px 9px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
/* Palette */
.palette-wrap{position:fixed;inset:0;z-index:75;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .12s ease both}
.palette{width:min(620px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .15s ease both}
.palette .pi{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border)}
.palette input{flex:1;border:0;background:transparent;height:52px;font-size:15px;outline:none}
.palette .pr{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.palette .pg{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}
.palette .po{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 10px;border-radius:8px;text-align:left}
.palette .po .s{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.palette .po.sel{background:var(--brand-soft);color:var(--brand)}
.palette .pf{display:flex;gap:12px;padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
/* Toasts */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--surface);padding:10px 12px 10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-weight:550;animation:toastIn .22s cubic-bezier(.2,.8,.2,1) both;max-width:440px}
.toast button{color:var(--surface);font-weight:700;text-decoration:underline;min-height:30px;padding:0 6px}
.toast.out{animation:toastOut .2s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
/* Visite guidée : jamais bloquante */
.tour-ring{position:fixed;z-index:84;border-radius:10px;box-shadow:0 0 0 3px var(--brand),0 0 0 7px var(--brand-soft);pointer-events:none;transition:all .25s ease}
.tour{position:fixed;z-index:85;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--brand-line);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 16px 12px;animation:pop .2s ease both}
.tour h4{margin:0 0 4px;font-size:14.5px}
.tour p{margin:0 0 10px;color:var(--muted);font-size:13px}
.tour .tf{display:flex;align-items:center;gap:6px}
.tour .tf .sp{flex:1}
.tour .step{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
/* Opportunités */
.opp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;align-items:center}
.opp+.opp{border-top:1px solid var(--border)}
.opp .o1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opp .o1 b{font-size:14.5px}
.opp .o2{color:var(--muted);font-size:13px;margin-top:3px}
.opp .o3{margin-top:7px}
.opp .oa{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.opp .pot{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.opp .oa .bts{display:flex;gap:6px}
/* Tâches */
.tgroup{margin-bottom:16px}
.tgroup-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin:0 0 6px;padding:0 4px}
.tgroup-h .n{color:var(--muted);font-weight:600}
.task{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.task .cb{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0;color:var(--surface);position:relative}
.task .cb::after{content:"";position:absolute;inset:-9px}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task .tt{flex:1;min-width:0}
.task .t1{font-weight:600}
.task.done .t1{text-decoration:line-through;color:var(--muted)}
.task .t2{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:1px}
.task .t2 button{color:var(--brand);font-weight:600}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--border)}
.quick .input{flex:1;min-width:200px}
.quick .select,.quick input[type=date]{width:auto}
/* Réglages */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:32px;height:32px;border-radius:9px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong)}
.swatch.on{box-shadow:0 0 0 2px var(--text)}
.stage-row,.team-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.stage-row:last-child,.team-row:last-child{border-bottom:0}
.stage-row .input{flex:1}
.stage-row .pct{width:76px;flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:0}
.acpr{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;flex-shrink:0}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface-3)}
.ring .fgc{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-size:19px;font-weight:700;fill:var(--text);font-variant-numeric:tabular-nums}
.help-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.only-m{display:none}
/* Consultant : avatars d'équipe, plan de charge, missions, jalons */
.ri-ico.info{background:var(--info-soft);color:var(--info)}
.avs{display:inline-flex;align-items:center}
.avs .avatar{border:2px solid var(--surface);box-sizing:content-box}
.avs .avatar+.avatar{margin-left:-7px}
.load-row{padding:8px 2px 10px;border-bottom:1px solid var(--border)}
.load-row:last-of-type{border-bottom:0}
.load-row .lr1{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.load-row .grow{flex:1;min-width:0}
.load-row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load-row .rl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load-row .lv{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pipe-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;border-bottom:1px dashed var(--border);align-items:center}
.pipe-row:last-of-type{border-bottom:0}
.pipe-row .pn{display:flex;align-items:center;gap:2px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe-row .pv{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
.pipe-row .gauge{grid-column:1/-1;height:5px}
.pipe-row .gauge>i{background:var(--stage)}
.pipe-tot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px}
.staff-wrap{overflow-x:auto;padding-bottom:6px;overscroll-behavior-x:contain}
.staff{display:grid;grid-template-columns:200px repeat(8,minmax(70px,1fr));gap:5px;min-width:800px}
.staff .sh{font-size:11.5px;color:var(--muted);font-weight:650;text-align:center;padding:0 0 4px;line-height:1.35}
.staff .sh span{display:block;font-weight:500;color:var(--faint)}
.staff .sh.now{color:var(--brand)}
.staff .sn{display:flex;align-items:center;gap:8px;min-width:0;padding-right:6px}
.staff .sn>div{min-width:0}
.staff .sn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.staff .sn .r{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.staff .line{grid-column:1/-1;height:1px;background:var(--border);margin:3px 0}
.sc{height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:650;font-size:13px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--surface-2);border:1px solid transparent;transition:transform .12s, box-shadow .12s;line-height:1.15}
.sc small{font-size:10.5px;font-weight:600;color:var(--muted)}
.sc:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.sc.over{background:var(--danger-soft) !important;color:var(--danger);border-color:color-mix(in srgb, var(--danger) 35%, transparent)}
.sc.over small{color:var(--danger)}
.sc.tot{font-weight:750}
.sc .fcx{font-size:10px;font-weight:650;color:var(--chart-2)}
.staff-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:10px}
.staff-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px 16px;align-items:center}
.mrow+.mrow{border-top:1px solid var(--border)}
.mrow .m1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.mrow .m1 .ttl{font-weight:650;font-size:14px;text-align:left;color:var(--text)}
.mrow .m1 .ttl:hover{color:var(--brand)}
.mrow .m2{color:var(--muted);font-size:12.5px;margin-top:3px}
.mrow .m3{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .m3 .gauge{width:160px;flex:none}
.mrow .ma{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mrow .ma b{font-size:16px;font-variant-numeric:tabular-nums}
.mrow .ma .bts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.menu .mi-v{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:10px}
.menu .mi-t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mempty{font-size:12.5px;color:var(--muted);padding:4px 10px 9px;max-width:280px}
.staff-ed{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.staff-ed:last-of-type{border-bottom:0}
.staff-ed .grow{flex:1;min-width:0}
.staff-ed .input{width:84px;min-height:32px;text-align:right}
.team-row .input.cap{width:84px;flex:none}
.chart .tgt{stroke:var(--brand);stroke-dasharray:4 4;opacity:.7}
.chart .cap100{stroke:var(--border-strong)}
.chart .lbl-now{fill:var(--brand);font-weight:700}
.chart .v.over{fill:var(--danger)}
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:819px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(16,24,40,.06)}
  .sidebar .brand,.sidebar .me,.nav-sep{display:none}
  .nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex-direction:column;justify-content:center;gap:2px;min-height:52px;min-width:70px;padding:0 4px;font-size:11px;text-align:center;flex-shrink:0}
  .nav .lbl-long{display:none}.nav .lbl-short{display:inline}
  .nav .pill{position:absolute;margin:0;transform:translate(13px,-14px);height:17px;min-width:17px;font-size:10px;padding:0 4px}
  .nav button{position:relative}
  .main{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .demo-banner{padding:6px 16px}
  .demo-banner .hide-m{display:none}
  .topbar{padding:12px 16px 4px;flex-wrap:wrap}
  .mobile-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:700;order:0}
  .topbar>.sp{display:none}
  .topbar #btn-search,.topbar #btn-new{order:1}
  .topbar>div:not(.mobile-brand){order:2;flex:1 1 100%}
  .demo-banner{gap:4px 8px}
  .searchbtn{min-width:0;width:40px;padding:0;justify-content:center}
  .searchbtn .lbl,.searchbtn kbd{display:none}
  .page-title{font-size:19px}
  .view{padding:8px 16px 28px}
  .btn{min-height:40px}.btn.sm{min-height:40px}.icon-btn,.icon-btn.sm{width:40px;height:40px}
  .seg button{min-height:36px}
  .fchip{min-height:40px}
  .board-wrap{height:calc(100dvh - 270px);min-height:380px;scroll-snap-type:x mandatory}
  .col{width:82vw;flex-basis:82vw;scroll-snap-align:start}
  .toolbar .search,.toolbar .search .input{width:100%}
  .toolbar .search{flex:1 1 100%}
  .toasts{left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom))}
  .only-m{display:initial}
  .hide-m{display:none}
}
@media (max-width:719px){
  .tbl.cardify thead{display:none}
  .tbl.cardify,.tbl.cardify tbody{display:block}
  .tbl.cardify tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .tbl.cardify tr:last-child{border-bottom:0}
  .tbl.cardify td{display:block;height:auto;padding:2px 0;border:0;white-space:normal;text-align:left}
  .tbl.cardify td.num{text-align:left}
  .tbl.cardify td.primary{grid-column:1/-1;font-size:15px;margin-bottom:4px}
  .tbl.cardify td[data-label]:not(.primary)::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  .tbl.cardify td.hide-c{display:none}
  .kpi .val{font-size:28px}
  .kpi{padding:13px 13px 12px}
  .g-1-1,.set-grid,.form-grid,.fields{grid-template-columns:minmax(0,1fr)}
  .fields .fld{grid-column:1/-1}
  .opp{grid-template-columns:minmax(0,1fr)}
  .opp .oa{align-items:flex-start;flex-direction:row;flex-wrap:wrap;align-items:center}

  .modal-wrap{align-items:end;padding:0}
  .modal{width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  .map-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.demo-banner,.topbar .sp~*,.toolbar,.toasts,.tour,.tour-ring,.scrim,.dr-actions,.composer,.icon-btn,.btn{display:none !important}
  body{background:#fff;color:#000}
  .app{display:block}
  .view{padding:0;animation:none}
  .card,.table-wrap{box-shadow:none}
  body.drawer-open .main{display:none}
  body.drawer-open .drawer{position:static;width:auto;transform:none;box-shadow:none;border:0;visibility:visible}
  .dr-body{overflow:visible}
  .board-wrap{height:auto;overflow:visible}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (max-width:719px){
  .staff{grid-template-columns:128px repeat(8,64px);min-width:0;width:max-content}
  .staff .sn .r{display:none}
  .mrow{grid-template-columns:minmax(0,1fr);padding:13px 14px}

function phoneFor(i, mobile=true){ return (mobile ? "06 39 98 " : "04 65 71 ") + pad((i*37+11)%100) + " " + pad((i*53+29)%100); }
function emailFor(first, last){ return norm(first).replace(/[^a-z]/g,"") + "." + norm(last).replace(/[^a-z]/g,"") + "@exemple.fr"; }

/* Jalons de facturation par défaut : 30/40/30, ou 30/70 pour une formation intra */
function defaultMilestones(d){
  const won = d.wonAt ? d.wonAt.slice(0,10) : iso(today());
  const ac = iso(addDays(won, 3)), s = d.startDate || iso(today()), e = d.endDate || iso(addDays(s, 60));
  if(d.type === "Formation intra") return [
    {id:uid("jl"), label:"Acompte à la commande", pct:30, date:ac, status:"prevu", invoiceNo:null, invoicedAt:null, paidAt:null},
    {id:uid("jl"), label:"Solde à l'issue des sessions", pct:70, date:e, status:"prevu", invoiceNo:null, invoicedAt:null, paidAt:null}];
  const mid = iso(addDays(s, Math.round((parseISO(e) - parseISO(s)) / 864e5 / 2)));
  return [
    {id:uid("jl"), label:"Acompte à la signature", pct:30, date:ac, status:"prevu", invoiceNo:null, invoicedAt:null, paidAt:null},
    {id:uid("jl"), label:"Livrable intermédiaire", pct:40, date:mid, status:"prevu", invoiceNo:null, invoicedAt:null, paidAt:null},
    {id:uid("jl"), label:"Solde à la recette du livrable final", pct:30, date:e, status:"prevu", invoiceNo:null, invoicedAt:null, paidAt:null}];
}

/* Relances automatiques :
   - proposition sans réponse → relance à J+7
   - mission signée qui se termine dans les 45 jours → proposer une extension à J-30
   - jalon de facturation échu (ou sous 7 jours) → émettre la facture */
function syncAutoTasks(S=STATE, seeding=false){
  let created = 0;
  const has = key => S.tasks.some(t => t.key === key);
  const push = t => { S.tasks.push({done:false, doneAt:null, auto:true, createdAt:new Date().toISOString(), archived:false, ...t}); created++; };
  S.deals.forEach(d => {
    if(d.archived) return;
    const st = S.stages.find(s => s.id === d.stageId) || {};
    const co = S.companies.find(c => c.id === d.companyId); const coName = co ? co.name : "client";

    }
    if(st.type === "won" && d.endDate){
      const left = daysFrom(d.endDate);
      const ext = S.deals.some(x => !x.archived && x.extensionOf === d.id);
      const key = "auto:ext:" + d.id + ":" + d.endDate;
      if(left >= 0 && left <= 45 && !ext && !has(key)){
        const t = {id:uid("tk"), key, kind:"ext", title:"Proposer une extension — " + coName + " : « " + d.title + " » se termine le " + fmtDate(d.endDate), due:iso(addDays(d.endDate, -30)), ownerId:d.ownerId, dealId:d.id, contactId:d.contactId};
        if(seeding && daysFrom(t.due) < -3){ t.done = true; t.doneAt = stampDays(daysFrom(t.due) + 1, 17);
          S.activities.push({id:uid("ac"), type:"call", text:"Point de fin de mission : extension évoquée avec le client, qui revient vers nous après son comité de direction.", dealId:d.id, contactId:d.contactId, userId:d.ownerId, at:stampDays(daysFrom(t.due) + 1, 16, 30)}); }
        push(t);
      }
    }
    if(st.type === "won") (d.milestones || []).forEach(m => {
      if(m.status !== "prevu" || daysFrom(m.date) > 7) return;
      const key = "auto:inv:" + m.id; if(has(key)) return;
      push({id:uid("tk"), key, kind:"inv", milestoneId:m.id, title:"Émettre la facture « " + m.label + " » — " + coName + " (" + fmtEUR((Number(d.tjm)||0) * (Number(d.days)||0) * m.pct / 100) + " HT)", due:m.date, ownerId:d.ownerId, dealId:d.id, contactId:d.contactId});
    });
  });
  return created;
}

const byId = (arr, id) => arr.find(x => x.id === id);

const member = id => byId(STATE.team, id) || {name:"—", role:"", capacity:0};
const me = () => member(STATE.currentUserId);
function cname(c){ if(!c) return "—"; return (c.firstName + " " + c.lastName).trim(); }
function coName(id){ const c = company(id); return c ? c.name : "—"; }
function cfull(c){ if(!c) return "—"; const co = company(c.companyId); return co ? cname(c) + " · " + co.name : cname(c); }
const amount = d => (Number(d.tjm)||0) * (Number(d.days)||0);
const stType = d => (stage(d.stageId)||{}).type;
const prob = d => ((stage(d.stageId)||{}).probability || 0) / 100;

const dealsOfCo = coId => live(STATE.deals).filter(d => d.companyId === coId);
const dealsOfContact = cid => live(STATE.deals).filter(d => d.contactId === cid);
const isClientCo = coId => dealsOfCo(coId).some(d => stType(d) === "won");
const totalStaff = d => (d.staff||[]).reduce((s,x) => s + (Number(x.days)||0), 0);
const staffDays = (d, u) => { const x = (d.staff||[]).find(s => s.userId === u); return x ? Number(x.days)||0 : 0; };
const msAmount = (d, m) => amount(d) * (Number(m.pct)||0) / 100;
function missionWD(d){ return Math.max(1, workdays(d.startDate, d.endDate)); }
function missionState(d){ if(!d.startDate || !d.endDate) return "planned"; if(daysFrom(d.endDate) < 0) return "done"; if(daysFrom(d.startDate) > 0) return "upcoming"; return "running"; }
function extensionFor(d){ return live(STATE.deals).find(x => x.extensionOf === d.id && stType(x) !== "lost"); }
function endingSoon(d){ if(stType(d) !== "won" || !d.endDate) return false; const n = daysFrom(d.endDate); return n >= 0 && n <= 30; }
function noReply(d){ return d.stageId === PROPOSAL_STAGE && d.proposalSentAt && daysFrom(d.proposalSentAt) <= -7; }
/* Charge d'une mission sur une période : jours staffés répartis uniformément sur les jours ouvrés de la mission */
function loadIn(d, u, from, to){

  const s = parseISO(d.startDate), e = parseISO(d.endDate), a = s > from ? s : from, b = e < to ? e : to;
  if(b < a) return 0;

}
function consumed(d){ if(!d.startDate || !d.endDate) return 0; const s = parseISO(d.startDate), y = addDays(today(), -1), e = parseISO(d.endDate); const b = e < y ? e : y; if(b < s) return 0; return (Number(d.days)||0) * workdays(s, b) / missionWD(d); }

function weekLoad(w, u, mode){

    if(mode === "signed" && t === "won") s += loadIn(d, u, w.s, w.e);
    else if(mode === "weighted" && t === "open") s += loadIn(d, u, w.s, w.e) * prob(d); });
  return s;
}
const teamCapacity = () => STATE.team.reduce((s,u) => s + (Number(u.capacity)||0), 0);
function occupancy(from, n){ const ws = weeksFrom(from, n); let l = 0; ws.forEach(w => STATE.team.forEach(u => l += weekLoad(w, u.id, "signed"))); const cap = teamCapacity() * n; return {rate: cap ? l / cap : 0, load:l, cap}; }

/* Périodes */
function periodDays(){ return {"30":30, "90":91, "365":365}[UI.period] || 30; }
function periodLabel(){ return {"30":"30 derniers jours","90":"ce trimestre (90 j)","365":"12 derniers mois"}[UI.period]; }
function inWindow(dateStr, from, to){ const d = parseISO(dateStr); return d && d >= from && d <= to; }
function wonIn(from, to){ return signedDeals().filter(d => d.wonAt && inWindow(d.wonAt.slice(0,10), from, to)); }
function avgTjm(list){ const dd = list.reduce((s,d) => s + (Number(d.days)||0), 0); return dd ? list.reduce((s,d) => s + amount(d), 0) / dd : null; }
/* Transformation : propositions décidées (signées ou perdues) sur la période */
function conversion(from, to){
  let won = 0, lost = 0;
  live(STATE.deals).forEach(d => { if(!d.proposalSentAt) return; const t = stType(d);
    if(t === "won" && d.wonAt && inWindow(d.wonAt.slice(0,10), from, to)) won++;
    else if(t === "lost" && d.lostAt && inWindow(d.lostAt.slice(0,10), from, to)) lost++; });
  const n = won + lost; return {rate: n ? won / n : null, won, lost, n};
}

  const days = periodDays(), t = today();
  const from = addDays(t, -days + 1), prevTo = addDays(t, -days), prevFrom = addDays(t, -2*days + 1);
  const w = wonIn(from, t), wp = wonIn(prevFrom, prevTo);

    tjm:avgTjm(w), tjmP:avgTjm(wp), conv:conversion(from, t), convP:conversion(prevFrom, prevTo),

/* Thème & couleur de marque (contraste vérifié dans les deux thèmes) */
function hexToRgb(h){ h = String(h||"").replace("#",""); if(h.length===3) h = h.split("").map(x=>x+x).join(""); const n = parseInt(h,16); if(isNaN(n) || h.length !== 6) return [15,118,110]; return [(n>>16)&255,(n>>8)&255,n&255]; }

  const base = hexToRgb(hex), white = [255,255,255], dark = hexToRgb("#151821"), black = [11,13,23];

  let d = base; i = 0; while(contrast(d, dark) < 5 && i < 30){ d = mix(d, white, .08); i++; }

}

/* Compteurs KPI qui montent */
function animateCounters(root){
  $$("[data-count]", root).forEach(n => {
    const target = Number(n.dataset.count), fmt = n.dataset.fmt;
    const f = x => fmt === "eur" ? fmtEUR(x) : fmt === "pct" ? fmtPct(x) : fmt === "days" ? fmtDays(x) : fmtNum(x);
    if(n.dataset.done === "1" || !isFinite(target)) return; n.dataset.done = "1";
    const t0 = performance.now(), dur = 700;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); n.textContent = f(target * e); if(p < 1) requestAnimationFrame(step); else n.textContent = f(target); };
    requestAnimationFrame(step);
  });
}
function deltaChip(now, prev, mode="pct", title="vs période précédente"){

  if(mode === "pct"){ if(!prev) return '<span class="delta flat">nouveau</span>'; diff = (now - prev) / prev; txt = (diff >= 0 ? "+" : "−") + NF.format(Math.abs(diff*100)) + " %"; }
  else { diff = now - prev; txt = (diff >= 0 ? "+" : "−") + NF.format(Math.abs(diff*100)) + " pt" + (Math.abs(diff*100) >= 2 ? "s" : ""); }
  const cls = Math.abs(diff) < 0.005 ? "flat" : diff > 0 ? "up" : "down";
  return '<span class="delta '+cls+'" title="'+esc(title)+'">'+(cls==="up"?icon("up","xs"):cls==="down"?icon("down","xs"):"")+txt+'</span>';

/* Déplacement d'une mission (glisser-déposer, menu, API de test) */
function moveDeal(id, stageId, opts={}){
  const d = deal(id), to = stage(stageId);
  if(!d || !to || d.stageId === stageId) return false;
  const from = stage(d.stageId), nowIso = new Date().toISOString();
  d.stageId = stageId; d.updatedAt = nowIso;
  STATE.activities.push({id:uid("ac"), type:"status_change", text:"Étape : " + (from ? from.name : "—") + " → " + to.name, dealId:d.id, contactId:d.contactId, userId:STATE.currentUserId, at:nowIso});
  let msg = "« " + d.title + " » → " + to.name;
  if(stageId === PROPOSAL_STAGE && !d.proposalSentAt){
    d.proposalSentAt = iso(today()); d.nextDate = isoDays(7);
    STATE.activities.push({id:uid("ac"), type:"email", text:"Proposition commerciale envoyée : " + fmtNum(d.days) + " j × " + fmtEUR(d.tjm) + " = " + fmtEUR(amount(d)) + " HT.", dealId:d.id, contactId:d.contactId, userId:STATE.currentUserId, at:nowIso});
    msg += " · relance automatique à J+7";
  }
  if(to.type === "won"){
    d.wonAt = nowIso; d.lostAt = null; if(!d.proposalSentAt) d.proposalSentAt = iso(today());
    if(!d.startDate || daysFrom(d.startDate) < 0 && !(d.milestones||[]).length) d.startDate = isoDays(14);
    if(!d.endDate || d.endDate < d.startDate) d.endDate = iso(addDays(d.startDate, Math.max(14, Math.round((Number(d.days)||10) * 7 / 5 * 1.6))));
    if(!totalStaff(d)) d.staff = [{userId:d.ownerId, days:Number(d.days)||0}];
    if(!(d.milestones||[]).length) d.milestones = defaultMilestones(d);
    STATE.activities.push({id:uid("ac"), type:"system", text:"Mission signée — " + d.milestones.length + " jalons de facturation planifiés, staffing intégré au plan de charge.", dealId:d.id, contactId:d.contactId, userId:STATE.currentUserId, at:nowIso});
    syncAutoTasks();
    msg = "Mission signée — jalons de facturation et plan de charge mis à jour";
  } else if(from && from.type === "won"){ d.wonAt = null; msg += " · retirée du plan de charge"; }
  if(to.type === "lost"){ d.lostAt = nowIso; if(!d.lostReason) d.lostReason = "Sans réponse du client"; } else d.lostAt = null;
  if(stageId !== PROPOSAL_STAGE) live(STATE.tasks).filter(t => t.kind === "prop" && t.dealId === d.id && !t.done).forEach(t => { t.done = true; t.doneAt = nowIso; });
  else syncAutoTasks();
  save(); render();
  if(!opts.silent) toast(msg, to.type === "won" ? "Voir le plan de charge" : null, () => go("missions"));
  return true;
}
/* Extension d'une mission qui se termine */
function createExtension(id){
  const d = deal(id); if(!d) return;
  const ex = extensionFor(d); if(ex){ openDrawer("deal", ex.id); toast("Une extension existe déjà pour cette mission"); return; }
  const first = STATE.stages.find(s => s.type === "open") || STATE.stages[0];
  let start = addDays(d.endDate || iso(today()), 1); while(isWeekend(start)) start = addDays(start, 1);
  const days = Math.max(4, Math.round((Number(d.days)||10) * .4));
  const ratio = totalStaff(d) ? days / totalStaff(d) : 1;
  const x = {id:uid("dl"), title:"Extension — " + d.title, companyId:d.companyId, contactId:d.contactId, type:d.type, stageId:first.id, tjm:d.tjm, days,
    startDate:iso(start), endDate:iso(addDays(start, Math.round(days * 7 / 5 * 1.8))), proposalSentAt:null, nextDate:isoDays(2), ownerId:d.ownerId,
    staff:(d.staff||[]).filter(s => s.days > 0).map(s => ({userId:s.userId, days:Math.round(s.days * ratio * 2) / 2})), milestones:[], source:"Client existant",
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), wonAt:null, lostAt:null, lostReason:"", extensionOf:d.id, archived:false};
  STATE.deals.push(x);
  STATE.activities.push({id:uid("ac"), type:"note", text:"Extension créée depuis la mission « " + d.title + " » (fin le " + fmtDate(d.endDate) + ") : " + days + " j estimés.", dealId:x.id, contactId:x.contactId, userId:STATE.currentUserId, at:new Date().toISOString()});
  live(STATE.tasks).filter(t => t.kind === "ext" && t.dealId === d.id && !t.done).forEach(t => { t.done = true; t.doneAt = new Date().toISOString(); });
  save(); render();
  toast("Extension créée dans « " + first.name + " »", "Ouvrir", () => openDrawer("deal", x.id));
}

/* Menus contextuels : « Déplacer vers… » et détail d'une case du plan de charge */
let menuEl = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
function placeMenu(btn){
  document.body.appendChild(menuEl);
  const r = btn.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let x = Math.min(r.right - mw, innerWidth - mw - 8); x = Math.max(8, x);
  let y = r.bottom + 4; if(y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  menuEl.style.left = x + "px"; menuEl.style.top = y + "px";
}
function openMoveMenu(btn, id){

function openStaffMenu(btn, spec){
  closeMenu(); const [u, ws] = spec.split("|"); const s = parseISO(ws), e = addDays(s, 4);
  const who = u === "team" ? "Équipe" : member(u).name;

/* Glisser-déposer HTML5 */
function bindDnD(){
  document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest(".deal-card"); if(!c) return; e.dataTransfer.setData("text/plain", c.dataset.dealId); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
  document.addEventListener("dragend", e => { const c = e.target.closest && e.target.closest(".deal-card"); if(c) c.classList.remove("dragging"); $$(".col.drop-hover").forEach(x => x.classList.remove("drop-hover")); });
  document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest(".col"); if(!col) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; $$(".col.drop-hover").forEach(x => x !== col && x.classList.remove("drop-hover")); col.classList.add("drop-hover"); });
  document.addEventListener("dragleave", e => { const col = e.target.closest && e.target.closest(".col"); if(col && !col.contains(e.relatedTarget)) col.classList.remove("drop-hover"); });
  document.addEventListener("drop", e => { const col = e.target.closest && e.target.closest(".col"); if(!col) return; e.preventDefault(); col.classList.remove("drop-hover"); const id = e.dataTransfer.getData("text/plain"); if(id) moveDeal(id, col.dataset.stageId); });
}

function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const sep = [";", ",", "\t", "|"].map(s => [s, first.split(s).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true; else if(ch === sep){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i+1] === "\n") i++; row.push(cell); cell = ""; if(row.some(x => x.trim() !== "")) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell); if(row.some(x => x.trim() !== "")) rows.push(row);
  return {sep, rows};
}

    if(d.psort){ UI.psort = {k:d.psort, d:UI.psort.k === d.psort ? -UI.psort.d : 1}; render(); return; }
    if(d.csort){ UI.csort = {k:d.csort, d:UI.csort.k === d.csort ? -UI.csort.d : 1}; render(); return; }
    if(d.esort){ UI.esort = {k:d.esort, d:UI.esort.k === d.esort ? -UI.esort.d : (["ca","won","pipe","n","size"].includes(d.esort) ? -1 : 1)}; render(); return; }
    if(d.ctype){ $$("button", t.parentNode).forEach(b => b.classList.toggle("on", b === t)); return; }
    if(d.swatch){ applySetting("brand.color", d.swatch); render(); return; }
    if(d.themeSet){ STATE.theme = d.themeSet; applyTheme(); save(); render(); return; }
    if(d.stageUp !== undefined || d.stageDown !== undefined){ const i = Number(d.stageUp ?? d.stageDown), j = d.stageUp !== undefined ? i - 1 : i + 1; if(j < 0 || j >= STATE.stages.length) return; const a = STATE.stages; [a[i], a[j]] = [a[j], a[i]]; save(); render(); return; }
    if(d.pal !== undefined){ const it = palItems[Number(d.pal)]; closeModal(); if(it) it.run(); return; }
    if(d.tourNext !== undefined){ tourStep++; if(tourStep >= TOUR.length) endTour(); else showTour(); return; }
    if(d.tourSkip !== undefined){ endTour(); return; }
    if(d.act) return doAct(d.act);
  });
  const doAct = a => ({
    "new-deal": () => newDealModal(), "new-contact": () => newContactModal(), "new-company": () => newCompanyModal(), "import": () => importModal(),
    "export-contacts": () => exportCSV("contacts"), "export-companies": () => exportCSV("companies"), "export-deals": () => exportCSV("deals"), "export-billing": () => exportCSV("billing"),
    "print": () => window.print(), "tour": () => { go("dashboard"); startTour(); }, "help": () => helpModal(), "go-pipeline": () => go("pipeline"),
    "reset": () => confirmModal("Réinitialiser la démo ?", "Les données de démonstration seront régénérées (dates recalculées par rapport à aujourd'hui). Vos modifications seront perdues.", "Réinitialiser", resetDemo),
    "wipe": () => confirmModal("Vider toutes les données ?", "Tous les contacts, entreprises, missions, tâches et historiques seront supprimés. Les réglages (marque, étapes, équipe, TJM) sont conservés.", "Tout vider", wipeData),
    "toggle-fc": () => { UI.wfc = !UI.wfc; render(); },
    "toggle-auto": () => { UI.tauto = !UI.tauto; render(); }, "toggle-done": () => { UI.showDone = !UI.showDone; render(); }
  }[a] || (() => {}))();
  $("#btn-new").addEventListener("click", () => newDealModal());
  $("#btn-search").addEventListener("click", openPalette);
  $("#btn-reset").addEventListener("click", () => doAct("reset"));
  $("#btn-tour").addEventListener("click", () => { go("dashboard"); startTour(); });
  $("#scrim").addEventListener("click", closeDrawer);
  // Filtres et réglages (champs)
  const refilter = debounce(() => { const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart; render(); if(id){ const n = document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } } }, 160);
  document.addEventListener("input", e => {
    const t = e.target;
    if(["pq","cq","eq"].includes(t.id)){ UI[t.id] = t.value; refilter(); return; }
    if(t.dataset.set && t.type !== "color"){ applySetting(t.dataset.set, t.value); return; }
    if(t.dataset.set && t.type === "color"){ applySetting(t.dataset.set, t.value.toUpperCase()); return; }
  });
  document.addEventListener("change", e => {
    const t = e.target, d = t.dataset;
    if(["powner","ptype","towner"].includes(t.id)){ UI[t.id] = t.value; render(); return; }
    if(d.moveSelect){ const id = d.moveSelect; if(!moveDeal(id, t.value)) renderDrawer(); return; }
    if(d.set){ if(d.set === "currentUserId") render(); else if(t.type === "color") render(); return; }
    if(d.stageName){ stage(d.stageName).name = t.value.trim() || stage(d.stageName).name; save(); render(); return; }
    if(d.stageProb){ stage(d.stageProb).probability = clamp(Number(t.value)||0, 0, 100); save(); render(); return; }
    if(d.teamName){ byId(STATE.team, d.teamName).name = t.value.trim() || "Sans nom"; save(); render(); return; }
    if(d.teamRole){ byId(STATE.team, d.teamRole).role = t.value.trim(); save(); render(); return; }
    if(d.teamCap){ byId(STATE.team, d.teamCap).capacity = clamp(Number(String(t.value).replace(",", "."))||0, 0, 7); save(); render(); toast("Disponibilité mise à jour — plan de charge recalculé"); return; }
    if(d.tjm){ STATE.tjm[d.tjm] = Number(t.value)||0; save(); toast("TJM par défaut mis à jour"); return; }
    if(d.staffDays){ const [did, u] = d.staffDays.split("|"); const dd = deal(did); if(!dd) return; dd.staff = dd.staff || []; const v = Math.max(0, Number(String(t.value).replace(",", "."))||0);
      const s = dd.staff.find(x => x.userId === u); if(s) s.days = v; else dd.staff.push({userId:u, days:v}); dd.staff = dd.staff.filter(x => x.days > 0); dd.updatedAt = new Date().toISOString(); save(); render(); return; }
  });
  document.addEventListener("submit", e => {
    const f = e.target;
    if(f.id === "quick-task" || f.dataset.dealTask){ e.preventDefault(); const fd = Object.fromEntries(new FormData(f)); if(!fd.title.trim()) return;
      const t = {id:uid("tk"), title:fd.title.trim(), due:fd.due || iso(today()), done:false, doneAt:null, auto:false, ownerId:STATE.currentUserId, createdAt:new Date().toISOString(), archived:false};
      const link = f.dataset.dealTask ? "deal:" + f.dataset.dealTask : fd.link;
      if(link){ const [k, id] = link.split(":"); if(k === "deal"){ t.dealId = id; t.contactId = deal(id).contactId; } else t.contactId = id; }
      STATE.tasks.push(t); save(); render(); toast("Tâche ajoutée"); return; }
    if(f.dataset.compose){ e.preventDefault(); const txt = f.text.value.trim(); if(!txt) return; const type = ($(".on[data-ctype]", f)||{}).dataset?.ctype || "note";
      STATE.activities.push({id:uid("ac"), type, text:txt, userId:STATE.currentUserId, at:new Date().toISOString(), ...JSON.parse(f.dataset.compose)}); save(); render(); toast(ACT_LABEL[type] + " ajouté" + (type === "note" ? "e" : "") + " à l'historique"); }
  });
  document.addEventListener("keydown", e => {
    const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); if($("#pal-q")) closeModal(); else openPalette(); return; }
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.closest("[data-compose]")){ e.preventDefault(); e.target.closest("form").requestSubmit(); return; }
    if(e.key === "Escape"){ if(menuEl){ closeMenu(); return; } if($("#modal-root").innerHTML){ closeModal(); return; } if(UI.drawer){ closeDrawer(); return; } if(tourStep >= 0){ endTour(); return; } }
    if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key === "n" || e.key === "N"){ e.preventDefault(); newDealModal(); }
    else if(e.key === "/"){ const f = $("[data-filter-input]"); if(f){ e.preventDefault(); f.focus(); } }
    else if(e.key === "?"){ e.preventDefault(); helpModal(); }
    else if(e.key === "Enter" && e.target.classList && e.target.classList.contains("deal-card")){ openDrawer("deal", e.target.dataset.dealId); }
  });
  document.addEventListener("click", e => { const c = e.target.closest(".deal-card"); if(c && !e.target.closest("button")) openDrawer("deal", c.dataset.dealId); });
  window.addEventListener("resize", debounce(() => { closeMenu(); if(tourStep >= 0) showTour(); }, 150));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(STATE.theme === "auto") render(); });
}
function closeModalIfAny(){ if($("#modal-root").innerHTML) closeModal(); }

/* ---------- Réinitialiser / vider ---------- */
function resetDemo(){ STATE = seedState(); STATE.tourDone = true; save(); closeDrawer(); applyTheme(); UI.view = "dashboard"; render(); toast("Démo réinitialisée — données régénérées"); }
function wipeData(){ ["companies","contacts","deals","tasks","activities"].forEach(k => STATE[k] = []); save(); closeDrawer(); render(); toast("Toutes les données ont été vidées"); }

/* ---------- Démarrage ---------- */
function boot(){
  STATE = load();
  if(!STATE){ STATE = seedState(); save(); }
  STATE.tjm = STATE.tjm || {...DEFAULT_TJM};
  if(syncAutoTasks()) save();
  const h = (location.hash || "").slice(1); if(RENDER[h]) UI.view = h;
  applyTheme(); bindEvents(); bindDnD(); render();
  const noTour = /[?&]visite=0\b/.test(location.search);
  if(!STATE.tourDone && !noTour) setTimeout(startTour, 700);
}
window.CRM = {
  state: () => STATE,
  move: (dealId, stageId) => moveDeal(dealId, stageId),
  reset: () => { STATE = seedState(); STATE.tourDone = true; save(); closeDrawer(); applyTheme(); render(); return STATE; }
};
boot();
</script>
</body>
</html>
