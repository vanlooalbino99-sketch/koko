    const sel = { id: uid('c'), kind: 'seller', first: x.s[0], last: x.s[1], company: x.s[2] || '', phone: phone(), email: `${slug(x.s[0])}.${slug(x.s[1])}@${pick(MAILS)}`, address: x.ad, city: x.c, ownerId: x.o, note: '', createdAt: at(x.h[0] + 1, 9 + i % 9, 10), archived: false };
    if (x.s[2]) sel.email = 'gestion@sci-lestilleuls.fr';
    S.contacts.push(sel);
    const mandatAgo = x.h[2];
    const d = {
      id: uid('d'), title: x.t, type: x.ty, surface: x.sf, rooms: x.r, bedrooms: x.b, address: x.ad, city: x.c, quartier: x.q,
      price: x.p, net: x.n, amount: x.p - x.n, dpe: x.dpe, exclusive: !!x.x, stageId: x.st, ownerId: x.o, sellerId: sel.id,
      mandateStart: mandatAgo != null ? day(-mandatAgo) : null,
      mandateEnd: x.end != null ? day(x.end) : (mandatAgo != null ? day(-mandatAgo + (x.x ? 90 : 180)) : null),
      features: x.f || [], buyerName: x.bn || '', lostReason: x.reason || '',
      createdAt: at(x.h[0], 9, 30), updatedAt: at(Math.max(0, x.lost ?? x.h[x.h.length - 1]), 12), archived: false,
    };
    S.deals.push(d); dealIds.push(d.id);
    const nm = `${x.s[0]} ${x.s[1]}`;
    const notary = pick(NOT);
    x.h.forEach((ago, k) => {
      const st = PATH[k];
      act('status_change', { dealId: d.id, ownerId: x.o, date: at(ago, 11, 15), meta: { from: k ? PATH[k - 1] : null, to: st } });
      if (st === 'prospection') act('call', { dealId: d.id, contactId: sel.id, ownerId: x.o, date: at(ago, 9, 40), text: `Premier appel de ${nm} : projet de vente d’ici l’été, souhaite une estimation.` });
      if (st === 'estimation') act('meeting', { dealId: d.id, contactId: sel.id, ownerId: x.o, date: at(ago, 14, 30), text: `Rendez-vous d’estimation sur place — fourchette ${eur(Math.round(x.p * 0.94 / 1000) * 1000)} – ${eur(Math.round(x.p * 1.03 / 1000) * 1000)}.` });
      if (st === 'mandat') act('note', { dealId: d.id, contactId: sel.id, ownerId: x.o, date: at(ago, 16, 0), text: `Mandat ${x.x ? 'exclusif' : 'simple'} n° 2026-${pad(40 + i)} signé — prix ${eur(x.p)} honoraires inclus, net vendeur ${eur(x.n)}.` });
      if (st === 'visites') act('email', { dealId: d.id, ownerId: x.o, date: at(ago, 10, 5), text: 'Annonce publiée : site de l’agence, SeLoger, Leboncoin — 16 photos et visite virtuelle.' });
      if (st === 'offre') {
        const ob = x.ob ? buyerByName(x.ob) : null;
        const who = ob ? fullName(ob) : (x.bn || 'un acquéreur');
        const off = Math.round(x.p * (0.95 + R() * 0.03) / 1000) * 1000;
        act('offer', { dealId: d.id, contactId: ob?.id, ownerId: x.o, date: at(ago, 18, 10), text: `Offre écrite de ${who} à ${eur(off)} (${pct((1 - off / x.p) * 100, 1)} sous le prix affiché).` });
        if (ob) d.buyerName = fullName(ob);
      }
      if (st === 'compromis') act('meeting', { dealId: d.id, ownerId: x.o, date: at(ago, 15, 0), text: `Compromis signé chez ${notary} avec ${x.bn || 'l’acquéreur'} — délai de rétractation de 10 jours.` });
      if (st === 'acte') act('meeting', { dealId: d.id, ownerId: x.o, date: at(ago, 10, 30), text: `Acte authentique signé chez ${notary}. Remise des clés à ${x.bn || 'l’acquéreur'}.` });
    });
    if (x.lost) {
      act('status_change', { dealId: d.id, ownerId: x.o, date: at(x.lost, 12, 0), meta: { from: PATH[x.h.length - 1], to: 'perdu' } });
      act('note', { dealId: d.id, contactId: sel.id, ownerId: x.o, date: at(x.lost, 12, 5), text: `Mandat perdu : ${x.reason}` });
    }
    /* Visites réparties entre la mise en visite et l’offre (ou aujourd’hui) */
    if (x.v) {
      const start = x.h[3] ?? x.h[2] ?? 30;
      const endAgo = x.h[4] ?? x.lost ?? 0;
      const compatible = S.contacts.filter(c => c.kind === 'buyer' && c.types.includes(x.ty));
      const pool = compatible.length ? compatible : S.contacts.filter(c => c.kind === 'buyer');
      const negBias = x.v > 8 ? 0.75 : 0.4;
      for (let k = 0; k < x.v; k++) {
        let ago = Math.round(start - (k + 0.5) * (start - endAgo) / x.v + (R() - 0.5) * 3);
        ago = clamp(ago, endAgo + 1, start);
        const b = pick(pool);
        const neg = R() < negBias;
        const fb = neg ? pick(FB_NEG) : pick(FB_POS);
        act('visit', { dealId: d.id, contactId: b.id, ownerId: x.o, date: at(ago, pick([10, 11, 14, 15, 17, 18]), pick([0, 30])), text: `Visite avec ${fullName(b)} — ${fb}.`, meta: { fb, mood: neg ? 'neg' : 'pos' } });
      }
      if (x.v >= 3) act('call', { dealId: d.id, contactId: sel.id, ownerId: x.o, date: at(Math.max(1, endAgo + 2), 18, 20), text: `Point hebdomadaire avec ${nm} : retours de visites partagés.` });
    }
  });
  const dl = i => S.deals[i];
  /* Propositions déjà faites (une partie seulement : il reste de quoi cliquer en démo) */
  [[0, 'Masson', 12], [0, 'Roche', 9], [2, 'Girard', 20], [20, 'Fontaine', 4], [4, 'Chevalier', 3], [1, 'Morel', 30]].forEach(([di, bn, ago]) => {
    const d = dl(di), b = buyerByName(bn);
    act('proposal', { dealId: d.id, contactId: b.id, ownerId: d.ownerId, date: at(ago, 11, 45), text: `Bien proposé à ${fullName(b)} — correspondance ${matchScoreRaw(d, b)} %.`, meta: { score: matchScoreRaw(d, b) } });
  });
  function matchScoreRaw(d, b) { return matchScore(d, b).score; }
  /* Tâches */
  const T = [
    ['Relancer Mme Dufau : proposer un ajustement de prix', -1, 0, null, 'u2', 'call'],
    ['Transmettre le diagnostic termites au notaire', -3, 8, null, 'u2', 'admin'],
    ['Renouveler le mandat du terrain (expiré)', -2, 6, null, 'u4', 'admin'],
    ['Visite 14 h 30 avec Léa Fontaine', 0, 20, 'Fontaine', 'u3', 'visit'],
    ['Faire signer l’avenant de prolongation du mandat', 0, 24, null, 'u1', 'admin'],
    ['Appeler le courtier des Morel (financement)', 0, 1, 'Morel', 'u1', 'call'],
    ['Préparer l’avis de valeur', 0, 26, null, 'u3', 'admin'],
    ['Visite de la villa avec Nicolas Chevalier', 1, 4, 'Chevalier', 'u1', 'visit'],
    ['Négocier la contre-offre avec Mme Garnier', 1, 14, null, 'u1', 'call'],
    ['Envoyer l’avis de valeur à Mme Castagnet', 1, 18, null, 'u1', 'email'],
    ['Shooting photo et visite virtuelle', 2, 5, null, 'u2', 'admin'],
    ['Proposer une baisse de prix à M. Etcheverry', 2, 13, null, 'u4', 'call'],
    ['Publier l’annonce sur les portails', 2, 21, null, 'u4', 'admin'],
    ['Rendez-vous d’estimation avec M. Peyrot', 3, 15, null, 'u2', 'meeting'],
    ['Relancer le notaire pour la date d’acte', 4, 25, null, 'u4', 'call'],
    ['Suivre l’obtention du prêt (condition suspensive)', 5, 9, null, 'u3', 'call'],
    ['Point mandat avec Mme Roussel (fin à J-27)', 6, 2, null, 'u3', 'call'],
    ['Bilan de commercialisation à envoyer à M. Rey', 9, 7, null, 'u3', 'email'],
    ['Relancer les acquéreurs terrain du fichier', 12, 6, null, 'u4', 'email'],
    ['Envoyer le compte rendu de visites à M. Castaing', -4, 1, null, 'u1', 'email', true],
    ['Mettre en ligne l’annonce Le Bouscat', -8, 5, null, 'u2', 'admin', true],
  ];
  T.forEach(([title, due, di, bn, o, kind, done]) => {
    const d = dl(di);
    S.tasks.push({ id: uid('t'), title, due: day(due), done: !!done, doneAt: done ? at(-due, 17) : null, dealId: d.id, contactId: bn ? buyerByName(bn).id : (kind === 'visit' ? null : d.sellerId), ownerId: o, kind, createdAt: at(Math.max(0, -due) + 5, 9), archived: false });
  });
  void buyerIds; void dealIds;
  return S;
}

    <button class="chip" data-act="toggle-f" data-f="pipeAlerts" aria-pressed="${UI.pipeAlerts}">${ic('alert', 'sm')}Avec alerte</button></div>`;
  if (mode === 'list') return head + pipeList(list);
  const noData = !STATE.deals.length;
  return head + (noData ? `<div class="card" style="margin-bottom:14px">${empty('Aucun mandat pour l’instant', 'Créez votre premier mandat ou importez votre portefeuille de biens depuis un fichier CSV.', `<button class="btn primary" data-act="new-deal">${ic('plus')}Nouveau mandat</button><button class="btn" data-act="import">${ic('upload')}Importer</button>`)}</div>` : '') +
    `<div class="board" id="board">${STATE.stages.map(s => {
      const cards = list.filter(d => d.stageId === s.id);
      const sum = cards.reduce((a, d) => a + fees(d), 0);
      return `<section class="col" data-stage-id="${s.id}" style="--c:${esc(s.color)}" aria-label="${esc(s.name)}">
        <div class="col-head"><div class="col-t"><b>${esc(s.name)}</b><span class="cnt">${cards.length}</span></div><div class="col-sum">${eur(sum)} d’honoraires${s.type === 'open' ? ` · ${s.probability} %` : ''}</div></div>
        <div class="col-body">${cards.map(dealCard).join('') || `<div class="drop-here">${ic('move', 'sm')}Déposer ici</div>`}</div></section>`;

}
function pipeList(list) {
  const st = UI.pipeSort;
  const order = id => STATE.stages.findIndex(s => s.id === id);
  const rows = sortBy(list, st, { stage: d => order(d.stageId), title: d => d.title, price: d => d.price, fees: d => fees(d), visits: d => visitCount(d), end: d => d.mandateEnd || '9999', due: d => nextTask(d)?.due || '9999', owner: d => member(d.ownerId)?.name || '' });
  if (!rows.length) return `<div class="card">${empty('Aucun mandat ne correspond', 'Modifiez la recherche ou les filtres.', `<button class="btn" data-act="clear-filters">Effacer les filtres</button>`)}</div>`;

  ${rows.map(d => { const t = nextTask(d), left = mandateLeft(d); return `<tr data-act="open-deal" data-id="${d.id}" tabindex="0">
    <td class="first"><div class="cell-main">${thumb(d, 'th-xs')}<div style="min-width:0"><b>${esc(d.title)}</b><span>${esc(d.address)}, ${esc(d.city)}</span></div></div></td>
    <td data-label="Étape">${stageChip(d.stageId)}</td><td class="r" data-label="Prix">${eur(d.price)}</td><td class="r" data-label="Honoraires">${eur(fees(d))}</td>
    <td data-label="DPE">${dpeBadge(d.dpe)}</td><td class="r" data-label="Visites">${visitCount(d)}</td>
    <td data-label="Fin de mandat">${d.mandateEnd && left !== null ? `<span class="${left <= 30 ? (left < 0 ? 'tag t-danger' : 'tag t-warn') : ''}">${fmtD(d.mandateEnd)}</span>` : '<span class="muted">—</span>'}</td>
    <td data-label="Échéance">${t ? duePill(t.due) : '<span class="muted">—</span>'}</td><td data-label="Négociateur">${avatar(member(d.ownerId))}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* =========================================================
   12. BIENS — grille visuelle

const B_STATUS = { actifs: ['Tous (hors perdus)', d => d.stageId !== 'perdu'], vente: ['En vente (mandat)', d => MANDATE_STAGES.includes(d.stageId)], amont: ['Prospection / estimation', d => ['prospection', 'estimation'].includes(d.stageId)], sous: ['Sous compromis', d => d.stageId === 'compromis'], vendus: ['Vendus', d => d.stageId === 'acte'], perdus: ['Perdus', d => d.stageId === 'perdu'], tous: ['Tous', () => true] };
function vBiens() {
  const q = norm(UI.bQ);
  const cities = [...new Set(deals().map(d => d.city))].sort((a, b) => a.localeCompare(b, 'fr'));
  let list = deals().filter(d => (B_STATUS[UI.bStatus] || B_STATUS.actifs)[1](d) && (!UI.bType || d.type === UI.bType) && (!UI.bCity || d.city === UI.bCity)
    && (!UI.bDpe || (UI.bDpe === 'AC' ? 'ABC'.includes(d.dpe) : UI.bDpe === 'DE' ? 'DE'.includes(d.dpe) : UI.bDpe === 'FG' ? 'FG'.includes(d.dpe) && d.dpe : true))
    && (!q || norm([d.title, d.address, d.city, d.quartier, (d.features || []).join(' ')].join(' ')).includes(q)));
  const order = id => STATE.stages.findIndex(s => s.id === id);
  const S = { stage: (a, b) => order(a.stageId) - order(b.stageId) || b.createdAt.localeCompare(a.createdAt), recent: (a, b) => b.createdAt.localeCompare(a.createdAt), pa: (a, b) => a.price - b.price, pd: (a, b) => b.price - a.price, surf: (a, b) => b.surface - a.surface, match: (a, b) => strongCount(b) - strongCount(a) };
  list = list.sort(S[UI.bSort] || S.stage);
  return `<header class="vh"><div><h1>Biens</h1><p class="sub">${plural(deals().filter(isAvailable).length, 'bien')} en vente · ${plural(list.length, 'bien')} affiché${list.length > 1 ? 's' : ''}</p></div>
    <div class="vh-act"><button class="btn hide-sm" data-act="import">${ic('upload')}Importer</button><button class="btn hide-sm" data-act="export" data-what="biens">${ic('download')}Exporter</button><button class="btn primary" data-act="new-deal">${ic('plus')}Nouveau bien</button></div></header>
  <div class="filters">${searchIn('q-biens', UI.bQ, 'Rechercher : quartier, rue, « jardin »…')}
    ${sel('f-b-status', Object.entries(B_STATUS).map(([k, v]) => [k, v[0]]), UI.bStatus, 'Statut')}
    ${sel('f-b-type', [['', 'Tous les types'], ...Object.entries(TYPES)], UI.bType, 'Type de bien')}
    ${sel('f-b-city', [['', 'Toutes les villes'], ...cities.map(c => [c, c])], UI.bCity, 'Ville')}

    ${sel('f-b-sort', [['stage', 'Tri : étape'], ['recent', 'Plus récents'], ['pa', 'Prix croissant'], ['pd', 'Prix décroissant'], ['surf', 'Surface'], ['match', 'Correspondances']], UI.bSort, 'Tri')}</div>
  ${list.length ? `<div class="pgrid">${list.map((d, i) => { const nm = isAvailable(d) || ['prospection', 'estimation'].includes(d.stageId) ? strongCount(d) : 0; return `<article class="pcard" data-act="open-deal" data-id="${d.id}" tabindex="0" style="animation-delay:${Math.min(i, 12) * 30}ms" aria-label="${esc(d.title)}, ${eur(d.price)}">
    <div class="pc-media">${thumb(d)}<div class="pc-badges"><span class="tag">${stageChip(d.stageId)}</span>${d.exclusive ? `<span class="tag t-brand">${ic('star')}Exclusif</span>` : ''}</div><span class="pc-dpe">${dpeBadge(d.dpe)}</span></div>
    <div class="pc-body"><div class="pc-price"><b>${eur(d.price)}</b><span>${d.surface && d.type !== 'terrain' ? eur(d.price / d.surface) + '/m²' : ''}</span></div>
      <h3>${esc(d.title)}</h3><p class="pc-loc">${ic('pin')}${esc(d.quartier ? d.quartier + ', ' : '')}${esc(d.city)}</p>
      <ul class="pc-specs"><li>${ic('surface')}${num(d.surface)} m²</li>${d.type !== 'terrain' ? `<li>${ic('door')}${d.rooms} p.</li>${d.bedrooms ? `<li>${ic('bed')}${d.bedrooms} ch.</li>` : ''}` : ''}</ul>
      <div class="pc-foot"><span title="Visites">${ic('eye', 'sm')} ${visitCount(d)}</span><span class="pc-m">${nm ? `<b>${nm}</b> acquéreur${nm > 1 ? 's' : ''} compatible${nm > 1 ? 's' : ''}` : ''}</span>${avatar(member(d.ownerId))}</div></div></article>`; }).join('')}</div>`
    : `<div class="card">${empty(STATE.deals.length ? 'Aucun bien ne correspond' : 'Aucun bien en portefeuille', STATE.deals.length ? 'Élargissez les filtres pour retrouver vos biens.' : 'Ajoutez votre premier bien ou importez votre portefeuille.', STATE.deals.length ? '<button class="btn" data-act="clear-filters">Effacer les filtres</button>' : `<button class="btn primary" data-act="new-deal">${ic('plus')}Nouveau bien</button><button class="btn" data-act="import">${ic('upload')}Importer</button>`)}</div>`}`;
}

/* =========================================================
   13. RAPPROCHEMENTS (module signature)
   ========================================================= */
function critChips(crit) {
  return `<div class="crits">${crit.map(c => `<span class="crit ${c.st}" title="${esc(c.k)} : ${esc(c.t)}">${ic(c.st === 'ok' ? 'check' : c.st === 'part' ? 'part' : 'ko')}<span>${esc(c.k)} · ${esc(c.t)}</span></span>`).join('')}</div>`;
}
function proposeBtn(dealId, buyerId, small) {
  const p = proposalOf(dealId, buyerId);
  if (p) return `<span class="proposed">${ic('check', 'sm')}Proposée ${relDue(ymd(new Date(p.date))).toLowerCase() === 'aujourd’hui' ? 'aujourd’hui' : 'le ' + fmtD(ymd(new Date(p.date)))}</span>`;
  return `<button class="btn ${small ? 'sm' : ''} primary" data-act="propose" data-deal="${dealId}" data-buyer="${buyerId}">${ic('send', 'sm')}Proposer une visite</button>`;
}
function vMatches() {
  const avail = deals().filter(isAvailable), bs = buyers();
  const all = avail.flatMap(d => dealMatches(d));
  const strong = all.filter(m => m.score >= 70), pending = strong.filter(m => !proposalOf(m.d.id, m.b.id));
  const head = `<header class="vh"><div><h1>Rapprochements</h1><p class="sub">Chaque bien en vente comparé automatiquement à vos ${plural(bs.length, 'acquéreur')} : budget, secteur, type, surface, pièces.</p></div>
    <div class="vh-act">${seg('m-mode', [['deal', 'Par bien', 'home'], ['buyer', 'Par acquéreur', 'buyer']], UI.mMode, 'Vue')}
    ${sel('f-m-min', [[50, 'Score ≥ 50'], [70, 'Score ≥ 70'], [85, 'Score ≥ 85']], UI.mMin, 'Score minimum')}</div></header>`;
  if (!avail.length || !bs.length) return head + `<div class="card">${empty(!avail.length ? 'Aucun bien en vente' : 'Aucun acquéreur', !avail.length ? 'Les rapprochements portent sur les biens au stade Mandat signé, Visites ou Offre.' : 'Ajoutez vos acquéreurs et leurs critères : les correspondances apparaissent instantanément.', !avail.length ? `<button class="btn primary" data-act="new-deal">${ic('plus')}Nouveau mandat</button>` : `<button class="btn primary" data-act="new-contact" data-kind="buyer">${ic('plus')}Nouvel acquéreur</button>`)}</div>`;
  const stats = `<div class="m-stats"><div class="m-stat"><span class="a-ic b">${ic('home')}</span><div><b>${avail.length} × ${bs.length}</b><span>biens × acquéreurs analysés</span></div></div>
    <div class="m-stat"><span class="a-ic b">${ic('match')}</span><div><b>${strong.length}</b><span>correspondances ≥ 70</span></div></div>
    <div class="m-stat"><span class="a-ic w">${ic('send')}</span><div><b>${pending.length}</b><span>visites restant à proposer</span></div></div></div>`;
  if (!UI.mLoaded) {
    return head + stats + `<div class="m-layout"><div class="m-list">${Array.from({ length: 6 }, () => '<div class="skel" style="height:64px;border-radius:10px"></div>').join('')}</div>
      <div class="card m-detail" style="padding:16px"><p class="muted small" style="margin-bottom:12px">Analyse de ${avail.length * bs.length} combinaisons…</p>${Array.from({ length: 4 }, () => '<div style="display:flex;gap:14px;margin-bottom:18px"><div class="skel" style="width:52px;height:52px;border-radius:50%"></div><div style="flex:1"><div class="skel" style="height:14px;width:40%;margin-bottom:8px"></div><div class="skel" style="height:12px;width:80%"></div></div></div>').join('')}</div></div>`;
  }
  if (UI.mMode === 'buyer') return head + stats + matchesByBuyer(bs);
  const items = avail.map(d => ({ d, ms: dealMatches(d), n: dealMatches(d).filter(m => m.score >= UI.mMin).length })).sort((a, b) => b.n - a.n || (b.ms[0]?.score || 0) - (a.ms[0]?.score || 0));
  if (!UI.mSel || !items.find(x => x.d.id === UI.mSel)) UI.mSel = items[0].d.id;
  const cur = items.find(x => x.d.id === UI.mSel), d = cur.d;
  const shown = cur.ms.filter(m => m.score >= UI.mMin), rest = cur.ms.filter(m => m.score < UI.mMin && m.score >= 40);
  const rows = (UI.mPartial ? shown.concat(rest) : shown);
  return head + stats + `<div class="m-layout"><div class="m-list" role="listbox" aria-label="Biens en vente">${items.map(x => `<button class="m-item" role="option" aria-pressed="${x.d.id === UI.mSel}" aria-selected="${x.d.id === UI.mSel}" data-act="m-select" data-id="${x.d.id}">${thumb(x.d, 'th-sm')}<span class="mi-t"><b>${esc(x.d.title)}</b><span>${eur(x.d.price)} · ${esc(x.d.city)}</span></span><span class="mi-n"><b>${x.n}</b>≥ ${UI.mMin}</span></button>`).join('')}</div>
  <section class="card m-detail" aria-live="polite">
    <div class="m-head">${thumb(d)}<div class="mh-t"><h2>${esc(d.title)}</h2><p>${esc(d.address)}, ${esc(d.city)} · ${stageChip(d.stageId)}</p>
      <div class="mh-specs"><b>${eur(d.price)}</b><span>${num(d.surface)} m²</span>${d.type !== 'terrain' ? `<span>${d.rooms} p.</span>` : ''}${dpeBadge(d.dpe)}${d.exclusive ? `<span class="tag t-brand">${ic('star')}Exclusif</span>` : ''}<span class="tag">${ic('eye')}${plural(visitCount(d), 'visite')}</span></div></div>
      <button class="btn sm hide-sm" data-act="open-deal" data-id="${d.id}">Fiche du bien</button></div>
    ${rows.length ? rows.map((m, i) => matchRow(m, 'buyer', i)).join('') : `<div class="empty"><h3>Aucun acquéreur au-dessus de ${UI.mMin}</h3><p>Baissez le seuil ou ajustez le prix : c’est souvent le signal d’un prix à revoir.</p></div>`}
    ${rest.length ? `<div class="m-more"><button class="btn sm ghost" data-act="m-partial">${UI.mPartial ? 'Masquer' : 'Afficher'} les correspondances partielles (${rest.length})</button></div>` : ''}
  </section></div>`;
}
function matchRow(m, show, i) {
  const b = m.b, d = m.d;
  const main = show === 'buyer'
    ? `<div class="mr-name"><button data-act="open-contact" data-id="${b.id}">${esc(fullName(b))}</button><span class="tag ${FIN_TAG[b.financing] || ''}">${esc(FIN[b.financing] || '—')}</span><span class="tag">${esc(DELAYS[b.delay] || '')}</span></div>
       <div class="mr-sub">Budget ${eur(b.budget)} · ${esc((b.types || []).map(t => TYPES[t]).join(' ou '))} · ${esc((b.cities || []).join(', '))}${b.surfaceMin ? ` · ≥ ${num(b.surfaceMin)} m²` : ''}</div>`
    : `<div class="mr-name"><button data-act="open-deal" data-id="${d.id}">${esc(d.title)}</button>${stageChip(d.stageId)}</div>
       <div class="mr-sub">${eur(d.price)} · ${esc(d.city)} · ${num(d.surface)} m²${d.type !== 'terrain' ? ` · ${d.rooms} p.` : ''}</div>`;
  return `<div class="mrow enter-row" style="animation-delay:${Math.min(i, 10) * 40}ms"><div class="mr-score">${ring(m.score, 52, true)}<span class="score-l ${scoreCls(m.score)}">${scoreLbl(m.score)}</span></div>
    <div class="mr-main">${main}${critChips(m.crit)}</div><div class="mr-act">${proposeBtn(d.id, b.id)}</div></div>`;
}
function matchesByBuyer(bs) {
  const items = bs.map(b => ({ b, ms: buyerMatches(b), n: buyerMatches(b).filter(m => m.score >= UI.mMin).length })).sort((a, b) => b.n - a.n || (b.ms[0]?.score || 0) - (a.ms[0]?.score || 0));
  if (!UI.mSelB || !items.find(x => x.b.id === UI.mSelB)) UI.mSelB = items[0].b.id;
  const cur = items.find(x => x.b.id === UI.mSelB), b = cur.b;
  const shown = cur.ms.filter(m => m.score >= (UI.mPartial ? 40 : UI.mMin));
  return `<div class="m-layout"><div class="m-list" role="listbox" aria-label="Acquéreurs">${items.map(x => `<button class="m-item" role="option" aria-pressed="${x.b.id === UI.mSelB}" aria-selected="${x.b.id === UI.mSelB}" data-act="m-select-b" data-id="${x.b.id}">${cAvatar(x.b)}<span class="mi-t"><b>${esc(fullName(x.b))}</b><span>${eur(x.b.budget)} · ${esc((x.b.cities || []).slice(0, 2).join(', '))}</span></span><span class="mi-n"><b>${x.n}</b>≥ ${UI.mMin}</span></button>`).join('')}</div>
  <section class="card m-detail"><div class="m-head">${cAvatar(b, 'lg')}<div class="mh-t"><h2>${esc(fullName(b))}</h2><p>Budget ${eur(b.budget)} · ${esc(FIN[b.financing] || '')} · ${esc(DELAYS[b.delay] || '')}</p>
    <div class="mh-specs"><span>${esc((b.types || []).map(t => TYPES[t]).join(' ou '))}</span><span>${esc((b.cities || []).join(', '))}</span>${b.surfaceMin ? `<span>≥ ${num(b.surfaceMin)} m²</span>` : ''}${b.roomsMin ? `<span>≥ ${b.roomsMin} p.</span>` : ''}</div></div>
    <button class="btn sm hide-sm" data-act="open-contact" data-id="${b.id}">Fiche</button></div>
    ${shown.length ? shown.map((m, i) => matchRow(m, 'deal', i)).join('') : `<div class="empty"><h3>Aucun bien au-dessus de ${UI.mMin}</h3><p>Rien en portefeuille pour l’instant : pensez à le prévenir dès qu’un bien entre en mandat.</p></div>`}
    <div class="m-more"><button class="btn sm ghost" data-act="m-partial">${UI.mPartial ? 'Masquer' : 'Afficher'} les correspondances partielles</button></div></section></div>`;
}

/* =========================================================
   14. CONTACTS — acquéreurs & vendeurs
   ========================================================= */
const lastAct = c => (actByContact()[c.id] || [])[0];

    <div class="vh-act"><button class="btn hide-sm" data-act="import">${ic('upload')}Importer</button><button class="btn hide-sm" data-act="export" data-what="acquereurs">${ic('download')}Exporter</button><button class="btn primary" data-act="new-contact" data-kind="buyer">${ic('plus')}Nouvel acquéreur</button></div></header>

  ${list.map(b => { const m = best(b); return `<tr data-act="open-contact" data-id="${b.id}" tabindex="0"><td class="first"><div class="cell-main">${cAvatar(b)}<div style="min-width:0"><b>${esc(fullName(b))}</b><span>${esc(b.phone || b.email || '')}</span></div></div></td>
    <td class="r" data-label="Budget">${eur(b.budget)}</td><td data-label="Recherche"><span class="small">${esc((b.types || []).map(t => TYPES[t]).join(' / '))}${b.surfaceMin ? ` ≥ ${num(b.surfaceMin)} m²` : ''} · ${esc((b.cities || []).join(', '))}</span></td>
    <td data-label="Financement"><span class="tag ${FIN_TAG[b.financing] || ''}">${esc(FIN[b.financing] || '—')}</span></td>

function moveDeal(id, stageId, opts = {}) {
  const d = getDeal(id), S = stage(stageId);
  if (!d || !S || d.stageId === stageId) return false;
  const prev = { stageId: d.stageId, mandateStart: d.mandateStart, mandateEnd: d.mandateEnd, updatedAt: d.updatedAt };
  const from = d.stageId;
  d.stageId = stageId; d.updatedAt = nowIso();
  if (stageId === 'mandat' && !d.mandateStart) { d.mandateStart = todayStr(); d.mandateEnd = addDays(todayStr(), d.exclusive ? 90 : 180); }
  const a = logAct('status_change', { dealId: id, meta: { from, to: stageId } });
  save(); render();
  if (!opts.silent) {
    const msg = S.type === 'won' ? `Acte authentique signé : ${eur(fees(d))} d’honoraires` : S.type === 'lost' ? `Mandat classé perdu` : `« ${d.title} » → ${S.name}`;
    toast(msg, { icon: S.type === 'won' ? 'star' : 'move', undo: () => { Object.assign(d, prev); STATE.activities = STATE.activities.filter(x => x.id !== a.id); save(); render(); } });
    requestAnimationFrame(() => $(`.dcard[data-deal-id="${id}"]`)?.classList.add('flash'));
  }
  return true;
}
function archiveEntity(kind, id) {

}
function proposeVisit(dealId, buyerId) {
  const d = getDeal(dealId), b = getContact(buyerId); if (!d || !b) return;
  const sc = matchScore(d, b).score, due = nextBusinessDay(1);

  save(); render();
  toast(`Visite proposée à ${fullName(b)} · tâche créée pour ${relDue(due).toLowerCase()}`, { icon: 'send', undo: () => { STATE.tasks = STATE.tasks.filter(x => x.id !== t.id); STATE.activities = STATE.activities.filter(x => x.id !== a.id); save(); render(); } });
}
function toggleTask(id) {
  const t = STATE.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? nowIso() : null;
  let msg = t.done ? 'Tâche terminée' : 'Tâche rouverte';

function extendMandate(id) {
  const d = getDeal(id); if (!d) return;
  const prev = d.mandateEnd;
  const base = d.mandateEnd && d.mandateEnd > todayStr() ? d.mandateEnd : todayStr();
  d.mandateEnd = addDays(base, 90);

  save(); render();

}
function applyDrop(id) {
  const d = getDeal(id), pr = d && priceReview(d); if (!pr) return;
  const prev = { price: d.price, net: d.net, amount: d.amount };
  const rate = fees(d) / d.price;
  d.price = pr.newPrice; d.net = Math.round(pr.newPrice * (1 - rate) / 100) * 100; syncAmount(d);
  const a = logAct('price', { dealId: id, contactId: d.sellerId, text: `Baisse de prix : ${eur(prev.price)} → ${eur(d.price)} (−${pct(pr.realPct, 1)}), net vendeur ${eur(d.net)}.` });
  save(); render();

  toast(`Nouveau prix ${eur(d.price)} · ${gain} acquéreur${gain > 1 ? 's' : ''} compatible${gain > 1 ? 's' : ''}`, { icon: 'trend', undo: () => { Object.assign(d, prev); STATE.activities = STATE.activities.filter(x => x.id !== a.id); save(); render(); } });
}

function toast(msg, o = {}) {

  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 200); };
  if (o.undo) el.querySelector('button').addEventListener('click', () => { o.undo(); kill(); });
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  setTimeout(kill, 5000);
}

    logAct(type, { ...o, text, meta: type === 'visit' ? { fb: text, mood: 'mid' } : {} });
    save(); render(); toast(type === 'visit' ? 'Visite enregistrée' : 'Activité ajoutée', { icon: 'check' });
  }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if ($('#palette-root').innerHTML) closePalette(); else openPalette(); return; }
  if (e.key === 'Escape') {
    if (MENU) { closeMenu(); return; }
    if ($('#palette-root').innerHTML) { closePalette(); return; }
    if (MODAL) { closeModal(); return; }
    if (TS.i >= 0) { endTour(); return; }
    if (UI.drawer) { closeDrawer(); return; }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && !typing) { const el = e.target.closest?.('[data-act]'); if (el && el.tagName !== 'BUTTON' && el.tagName !== 'A') { e.preventDefault(); el.click(); return; } }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || MODAL || $('#palette-root').innerHTML) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNewDeal(); }
  else if (e.key === '/') { const f = $('#view [data-filter-focus]'); if (f) { e.preventDefault(); f.focus(); } }
  else if (e.key === '?') { e.preventDefault(); openShortcuts(); }
});
document.addEventListener('mouseover', chartHover);
document.addEventListener('focusin', e => { if (e.target.closest?.('.chart-box')) chartHover(e); });
/* Glisser-déposer HTML5 */
let DRAG = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.dcard'); if (!c) return; DRAG = c.dataset.dealId; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG); requestAnimationFrame(() => c.classList.add('dragging')); });
document.addEventListener('dragend', () => { DRAG = null; $$('.dcard.dragging').forEach(c => c.classList.remove('dragging')); $$('.col.over').forEach(c => c.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('.col'); if (!col || !DRAG) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; $$('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('dragleave', e => { const col = e.target.closest?.('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', e => { const col = e.target.closest?.('.col'); if (!col) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain') || DRAG; col.classList.remove('over'); if (id) moveDeal(id, col.dataset.stageId); });
let RZ = 0;
window.addEventListener('resize', () => { clearTimeout(RZ); RZ = setTimeout(() => { if (UI.view === 'dashboard') drawCharts(false); if (TS.i >= 0) drawTour(); closeMenu(); }, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (STATE.settings.theme === 'auto') render(); });
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { const s = load(); if (s) { STATE = s; REV++; applyTheme(); applyBrand(); render(); } } });

/* =========================================================
   27. DÉMARRAGE + CONTRAT DE TEST
   ========================================================= */
STATE = load();
if (!STATE) { STATE = seed(); save(); }
STATE.ui ||= { tourDone: false };
STATE.settings.period ||= 30;
applyTheme(); applyBrand(); render();
window.CRM = {
  state: () => STATE,
  move: (dealId, stageId) => moveDeal(dealId, stageId),
  reset: () => resetDemo(),
};
const noTour = /[?&]visite=0\b/.test(location.search);
if (!STATE.ui.tourDone && !noTour) setTimeout(() => { if (!MODAL && !UI.drawer && !$('#palette-root').innerHTML) startTour(); }, 900);
})();
</script>
