/* Blackstart CRM : règlement sur les devis et factures (IBAN, référence, montant exact, QR code de virement SEPA,
 * liens PayPal / Stripe / Payoneer, adresse de paiement en ligne) et QR codes.
 * Contient « QR Code Generator for JavaScript » (c) 2009 Kazuhiko Arase, licence MIT. */
(function () {

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</' + 'title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],

      o.fillStyle = vgrad(o, 0, yS, [[0, '#121a3e'], [0.4, '#343b74'], [0.72, '#96769a'], [0.93, '#e3ad9a'], [1, '#efc0a8']]); o.fillRect(0, 0, w, yS + 2);

  // ---- scène: dunes-dorees

<script id="bs-ambiance">

  // ---------------------------------------------------------------- Réglages › Icônes du menu
  function monterReglages(el) {
    if (!el || el.getAttribute('data-bsi')) return;
    el.setAttribute('data-bsi', '1');
    ensureCss();
    var ui = { sel: 'formations', q: '', cat: 'idees' };
    function current(id) { var n = NAV.filter(function (x) { return x.id === id; })[0]; return map[id] || (n && n.def); }
    function list() {
      if (ui.q.trim()) return search(ui.q);
      if (ui.cat === 'idees') return ideas(ui.sel);

    }
    function gridHtml(ro) {
      var names = list(), cur = map[ui.sel] || '';

      }).join('');
    }
    function countTxt() {
      var n = list().length;
      return n + ' icône' + (n > 1 ? 's' : '');
    }
    function render() {
      if (!el.isConnected) return;
      var ro = !canEdit(), selNav = NAV.filter(function (x) { return x.id === ui.sel; })[0];
      var total = Object.keys(LIB.d).length, mods = Object.keys(map).length;
      var where = SERVER ? 'Le choix est partagé avec toute l’équipe.' : 'Le choix est enregistré dans ce navigateur.';
      var left = '<nav class="bsi-nav" aria-label="Rubriques du menu">' + NAV.map(function (n) {
        if (n.group) return '<div class="bsi-gl">' + esc(n.group) + '</div>';
        return '<button type="button" class="bsi-row' + (n.id === ui.sel ? ' sel' : '') + '" data-navsel="' + n.id + '"' + (style.couleur === 'multi' && n.id !== ui.sel ? ' style="--bsi-t:' + TEINTES[n.id] + '"' : '') + '><span class="bsi-cur">' + icon(current(n.id), 17) + '</span><span class="bsi-lab">' + esc(n.label) + '</span>' + (map[n.id] ? '<span class="bsi-mod">modifiée</span>' : '') + '</button>';
      }).join('') + '</nav>';
      var chips = [['idees', 'Idées pour « ' + selNav.label + ' »']].concat([['toutes', 'Toutes', total]]).concat(LIB.g.map(function (g) { return [g[0], GROUPS[g[0]] || g[0], g[1].split(' ').length]; }));
      var right = '<div class="bsi-pick">' +
        '<div class="bsi-head"><span class="bsi-big">' + icon(current(ui.sel), 30) + '</span><div class="bsi-ht"><b>Icône de « ' + esc(selNav.label) + ' »</b><span>' + (map[ui.sel] ? 'Icône choisie : ' + esc(map[ui.sel].replace(/-/g, ' ')) : 'Icône d’origine') + '</span></div>' +
        (map[ui.sel] && !ro ? '<button type="button" class="btn btn-secondary btn-md" data-act="reset">Remettre l’icône d’origine</button>' : '') + '</div>' +
        '<div class="bsi-tools"><div class="search"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner('search') + '</svg>' +
        '<input class="search-input" data-q placeholder="Rechercher : formation, argent, équipe, fusée…" value="' + esc(ui.q) + '" aria-label="Rechercher une icône"></div><span class="bsi-count" data-count>' + countTxt() + '</span></div>' +
        '<div class="bsi-chips"' + (ui.q.trim() ? ' style="opacity:.45"' : '') + '>' + chips.map(function (c) {
          return '<button type="button" class="bsi-chip' + (!ui.q.trim() && ui.cat === c[0] ? ' on' : '') + '" data-cat="' + c[0] + '">' + esc(c[1]) + (c[2] ? '<small>' + c[2] + '</small>' : '') + '</button>';
        }).join('') + '</div>' +
        '<div class="bsi-grid" data-grid>' + gridHtml(ro) + '</div>' +
        '<div class="bsi-foot"><span class="bsi-hint">' + (ro ? '' : 'Cliquez sur une icône : le menu change tout de suite.') + '</span>' +
        (mods && !ro ? '<button type="button" class="btn btn-ghost btn-md" data-act="resetall">Tout remettre d’origine (' + mods + ')</button>' : '') + '</div></div>';
      var lock = ro ? '<div class="bsi-lock">' + icon('lock', 15) + 'Seul un administrateur peut changer les icônes du menu de l’équipe.</div>' : '';
      var focusQ = document.activeElement && document.activeElement.hasAttribute && document.activeElement.hasAttribute('data-q') && el.contains(document.activeElement);
      el.innerHTML = '<section class="card"><header class="card-head"><div class="card-title-wrap"><span class="card-icon">' + icon('shapes', 16) + '</span><div><h3 class="card-title">Icônes du menu</h3>' +
        '<p class="card-sub">Donnez à chaque rubrique l’icône qui lui parle, parmi ' + total.toLocaleString('fr-FR') + ' icônes classées par thème. ' + where + '</p></div></div></header>' +
        lock + packsHtml(ro) + styleRow(ro) + '<div class="bsi-layout">' + left + right + '</div></section>';

    }
    function seg(key, opts, ro) {
      return '<div role="tablist" class="segmented">' + opts.map(function (o) {
        var on = style[key] === o[0];
        return '<button type="button" role="tab" aria-selected="' + on + '" class="seg' + (on ? ' active' : '') + '" data-st="' + key + ':' + o[0] + '"' + (ro ? ' disabled' : '') + '><span>' + o[1] + '</span></button>';
      }).join('') + '</div>';

    function packsHtml(ro) {
      return '<div class="bsi-packs" role="list" aria-label="Packs d’icônes">' + PACKS.map(function (pk) {
        var on = samePack(pk);
        var strip = ORDRE.map(function (id) {
          var n = pk.map[id] || NAV.filter(function (x) { return x.id === id; })[0].def;
          return '<i' + (style.couleur === 'multi' ? ' style="color:' + TEINTES[id] + '"' : '') + '>' + icon(n, 15) + '</i>';
        }).join('');
        return '<button type="button" role="listitem" class="bsi-pack' + (on ? ' on' : '') + '" data-pack="' + pk.id + '"' + (ro ? ' disabled' : '') + ' aria-pressed="' + on + '">' +
          '<span class="bsi-pk-h"><b>' + esc(pk.nom) + '</b>' + (on ? '<span class="bsi-pk-ok">' + icon('check', 12) + 'Actif</span>' : '') + '</span>' +
          '<span class="bsi-pk-d">' + esc(pk.desc) + '</span><span class="bsi-pk-s">' + strip + '</span></button>';

        '<div class="bsi-st"><span class="bsi-st-l">Couleur</span>' + seg('couleur', [['neutre', 'Neutre'], ['accent', 'Accent'], ['multi', 'Multicolore']], ro) + '</div></div>';

        chips.style.opacity = ui.q.trim() ? '.45' : '';
        Array.prototype.forEach.call(chips.children, function (b) { b.classList.toggle('on', !ui.q.trim() && b.getAttribute('data-cat') === ui.cat); });
      }
    }
    el.addEventListener('click', function (e) {
      var t = e.target.closest('[data-navsel],[data-cat],[data-ic],[data-act],[data-st],[data-pack]'); if (!t || t.disabled) return;
      if (t.hasAttribute('data-pack')) { if (!canEdit()) return; var pk = PACKS.filter(function (x) { return x.id === t.getAttribute('data-pack'); })[0]; if (pk) save(Object.assign({}, pk.map)); return; }
      if (t.hasAttribute('data-st')) { if (!canEdit()) return; var kv = t.getAttribute('data-st').split(':'), p = {}; p[kv[0]] = kv[1]; saveStyle(p); return; }
      if (t.hasAttribute('data-navsel')) { ui.sel = t.getAttribute('data-navsel'); if (ui.cat === 'idees' || !ui.q) ui.cat = 'idees'; render(); return; }
      if (t.hasAttribute('data-cat')) { ui.cat = t.getAttribute('data-cat'); ui.q = ''; var qi = el.querySelector('[data-q]'); if (qi) qi.value = ''; renderGrid(); return; }
      if (!canEdit()) return;
      if (t.hasAttribute('data-ic')) { var next = Object.assign({}, map); next[ui.sel] = t.getAttribute('data-ic'); save(next); return; }
      var act = t.getAttribute('data-act');
      if (act === 'reset') { var n2 = Object.assign({}, map); delete n2[ui.sel]; save(n2); }
      else if (act === 'resetall' && confirm('Remettre toutes les icônes du menu d’origine ?')) save({});
    });
    var tmr = null;
    el.addEventListener('input', function (e) {
      if (!e.target.hasAttribute || !e.target.hasAttribute('data-q')) return;
      ui.q = e.target.value; clearTimeout(tmr); tmr = setTimeout(renderGrid, 120);
    });
    var l = function () { if (!el.isConnected) { listeners.splice(listeners.indexOf(l), 1); return; } render(); };
    listeners.push(l);
    render();
  }

  window.bsIcones = { svg: svg, nav: nav, monterReglages: monterReglages, choix: function () { return Object.assign({}, map); }, choisir: function (id, nom) { var n = Object.assign({}, map); if (nom) n[id] = nom; else delete n[id]; return save(n); }, chercher: search };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hook); else hook();
})();

.btn-sm { --h: 30px; padding: 0 10px; font-size: 0.86em; gap: 6px; }

.btn-soft { background: var(--accent-soft); color: var(--accent-text); }

.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover:not(:disabled) { background: #b91c1c; }
.btn-danger-ghost { color: #ef4444; }

.btn-success { background: #16a34a; color: #fff; }
.btn-success:hover:not(:disabled) { background: #15803d; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.icon-btn { position: relative; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); color: var(--text-2); transition: background-color .15s, color .15s; flex-shrink: 0; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn-secondary { background: var(--surface-2); border: 1px solid var(--border); }
.icon-btn-secondary:hover { background: var(--surface-3); }
.icon-btn-badge { position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: #e11d48; color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }

/* ---------------- Badges / avatars ---------------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 0.76em; font-weight: 600; white-space: nowrap; background: rgb(var(--t) / 0.13); color: var(--tt); box-shadow: inset 0 0 0 1px rgb(var(--t) / 0.22); }

.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--t)); }
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 30%; font-weight: 700; flex-shrink: 0; background: rgb(var(--t) / 0.16); color: var(--tt); letter-spacing: -0.02em; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 0.76em; font-weight: 500; background: var(--surface-3); color: var(--text-2); }

.tag button:hover { color: var(--text); }

/* ---------------- Champs ---------------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 0.82em; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 4px; }

.field-action { margin-left: auto; font-weight: 500; }
.field-hint { font-size: 0.78em; color: var(--text-3); }
.input {
  width: 100%; height: 38px; padding: 0 12px; border-radius: var(--radius-sm);
  background: var(--bg); border: 1px solid var(--border-2); color: var(--text);
  transition: border-color .15s, box-shadow .15s; outline: none; min-width: 0;
}
[data-scheme="light"] .input { background: #fff; }
.input::placeholder { color: var(--text-3); }
.input:hover { border-color: rgb(var(--text-rgb) / 0.28); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.select-wrap { position: relative; display: block; min-width: 0; }
.select { appearance: none; -webkit-appearance: none; padding-right: 32px; cursor: pointer; }
.select-caret { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-3); }
input[type="date"].input, input[type="time"].input { min-width: 0; }

.input-group { display: flex; align-items: stretch; }
.input-group .input { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.input-group .btn { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; height: 38px; }
.input-suffix { position: relative; }
.input-suffix .input { padding-right: 34px; }
.input-suffix > span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 0.9em; pointer-events: none; }

.search { position: relative; display: flex; align-items: center; min-width: 0; }
.search > .ic { position: absolute; left: 11px; color: var(--text-3); pointer-events: none; }
.search-input { width: 100%; height: 38px; padding: 0 34px 0 34px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); outline: none; transition: border-color .15s, box-shadow .15s; }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-input::placeholder { color: var(--text-3); }
.search-clear { position: absolute; right: 3px; width: 30px; height: 30px; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; cursor: pointer; }
.toggle-row.is-disabled { opacity: .5; }
.toggle-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.toggle-label { font-weight: 500; }
.toggle-hint { font-size: 0.82em; color: var(--text-3); }
.toggle { width: 40px; height: 24px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--border-2); position: relative; flex-shrink: 0; transition: background-color .2s, border-color .2s; }
.toggle span { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform .2s var(--ease); }
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on span { transform: translateX(16px); }

.checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-2); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background-color .12s, border-color .12s; background: var(--bg); color: var(--on-accent); }
.checkbox:hover { border-color: var(--accent); }
.checkbox.on { background: var(--accent); border-color: var(--accent); }
.checkbox-dash { width: 8px; height: 2px; background: var(--on-accent); border-radius: 2px; }
.checkbox.round { border-radius: 50%; width: 20px; height: 20px; }

.segmented { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.segmented::-webkit-scrollbar { display: none; }
.seg { height: 30px; padding: 0 12px; border-radius: calc(var(--radius-sm) - 2px); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.86em; color: var(--text-2); white-space: nowrap; transition: background-color .15s, color .15s; }
.seg:hover { color: var(--text); }

.seg-count { font-size: 0.85em; color: var(--text-3); font-weight: 600; }
.segmented-sm .seg { height: 26px; padding: 0 9px; font-size: 0.82em; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s, border-color .15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-count { font-size: 0.78em; padding: 1px 7px; border-radius: 99px; background: var(--surface-3); color: var(--text-2); }

.stepper { display: flex; align-items: stretch; }
.stepper button { width: 36px; background: var(--surface-2); border: 1px solid var(--border-2); font-size: 1.1em; color: var(--text-2); }

.stepper button:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; border-left: 0; }
.stepper .input { border-radius: 0; text-align: center; -moz-appearance: textfield; }
.stepper .input::-webkit-inner-spin-button, .stepper .input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; font-family: var(--font); font-size: 0.72em; font-weight: 600; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border-2); border-bottom-width: 2px; }

/* ---------------- Cartes / KPI ---------------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: calc(var(--pad) + 4px); box-shadow: var(--shadow-sm); min-width: 0; }
.card-flush { padding: 0; overflow: hidden; }

.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-icon { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-text); flex-shrink: 0; }
.card-title { font-size: 0.98em; font-weight: 650; letter-spacing: -0.01em; }
.card-sub { font-size: 0.82em; color: var(--text-3); margin-top: 1px; }
.card-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
.kpi-click { transition: border-color .15s, background-color .15s; }
.kpi-click:hover { border-color: var(--border-2); background: var(--surface-2); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi-label { font-size: 0.82em; font-weight: 500; color: var(--text-2); }
.kpi-icon { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text-2); }
.kpi-icon[class*="tone-"] { background: rgb(var(--t) / 0.13); color: var(--tt); }
.kpi-value { font-size: 1.72em; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 18px; }

.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 0.78em; font-weight: 600; padding: 1px 6px; border-radius: 6px; }
.delta-good { color: #16a34a; background: rgb(22 163 74 / .1); }
.delta-bad { color: #dc2626; background: rgb(220 38 38 / .1); }
[data-scheme="dark"] .delta-good { color: #4ade80; }
[data-scheme="dark"] .delta-bad { color: #f87171; }

.meter { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 99px; transition: width .8s var(--ease); }
.meter-accent span { background: var(--accent); }
.meter-good span { background: var(--good); }
.meter-warn span { background: var(--warn); }
.meter-bad span { background: var(--bad); }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 20px; gap: 6px; }
.empty-compact { padding: 22px 12px; }
.empty-icon { width: 46px; height: 46px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); margin-bottom: 6px; }
.empty-compact .empty-icon { width: 38px; height: 38px; }
.empty-title { font-weight: 650; }
.empty-text { font-size: 0.88em; color: var(--text-3); max-width: 380px; }
.empty-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }

.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: rgb(var(--t) / 0.09); border: 1px solid rgb(var(--t) / 0.22); font-size: 0.9em; }
.callout > .ic { color: var(--tt); margin-top: 2px; }

/* ---------------- Coquille de l'application ---------------- */
.shell { display: flex; min-height: 100vh; min-height: 100dvh; }
.sidebar { display: none; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main-col > .page > * { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 30; height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0 16px;
  display: flex; align-items: center; gap: 8px;
  background: rgb(var(--bg-rgb) / 0.82); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-title { font-weight: 700; font-size: 1.05em; letter-spacing: -0.01em; }
.topbar-search { display: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), rgb(var(--accent-rgb) / 0.7)); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; box-shadow: 0 4px 12px -4px rgb(var(--accent-rgb) / 0.7), inset 0 1px 0 rgb(255 255 255 / .2); flex-shrink: 0; }
.brand-name { font-weight: 800; letter-spacing: 0.01em; font-size: 0.98em; white-space: nowrap; }
.brand-name span { color: var(--accent-text); }
.brand-sub { font-size: 0.72em; color: var(--text-3); font-weight: 500; white-space: nowrap; }
.page { width: 100%; max-width: 1360px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head-text { min-width: 0; }
.eyebrow { font-size: 0.78em; font-weight: 600; color: var(--accent-text); margin-bottom: 2px; }
.page-title { font-size: 1.5em; font-weight: 750; letter-spacing: -0.025em; line-height: 1.2; }
.page-sub { color: var(--text-3); font-size: 0.9em; margin-top: 3px; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: rgb(var(--bg-rgb) / 0.9); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--border);
}
.bn-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 52px; border-radius: 12px; color: var(--text-3); font-size: 10.5px; font-weight: 600; transition: color .15s, background-color .15s; }
.bn-item.active { color: var(--accent-text); }
.bn-item.active .bn-icon { background: var(--accent-soft); }
.bn-icon { width: 44px; height: 28px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; transition: background-color .2s; }
.bn-badge { position: absolute; top: 2px; left: 50%; margin-left: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: #e11d48; color: #fff; font-size: 10px; line-height: 16px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }

.fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 34; width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 28px -8px rgb(var(--accent-rgb) / 0.8), 0 2px 6px rgb(0 0 0 / .25); }

.nav-group-label { font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--text-3); padding: 14px 12px 6px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; height: 36px; padding: 0 10px; border-radius: 9px; color: var(--text-2); font-weight: 550; font-size: 0.93em; transition: background-color .15s, color .15s; text-align: left; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--text); }
.nav-item.active .ic { color: var(--accent-text); }
.nav-item.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: 0.78em; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-3); color: var(--text-2); }
.nav-count.hot { background: #e11d48; color: #fff; }

.mobile-menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mm-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; font-size: 0.86em; color: var(--text-2); position: relative; }
.mm-item.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.mm-item .ic { color: var(--accent-text); }

@media (min-width: 1024px) {
  .sidebar {
    display: flex; flex-direction: column; width: var(--sidebar-w); flex-shrink: 0;
    position: sticky; top: 0; height: 100vh; height: 100dvh;
    background: var(--sidebar); border-right: 1px solid var(--border); padding: 14px 12px 12px; transition: width .25s var(--ease);
  }
  .sidebar.collapsed { --sidebar-w: 68px; }
  .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-count, .sidebar.collapsed .nav-group-label, .sidebar.collapsed .brand-text, .sidebar.collapsed .sb-hide { display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
  .sidebar.collapsed .nav-group-label + * { margin-top: 0; }
  .sidebar.collapsed .nav-dot { position: absolute; top: 6px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #e11d48; box-shadow: 0 0 0 2px var(--sidebar); }
  .sb-brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 10px; }
  .sb-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 -4px; padding: 0 4px; scrollbar-width: thin; }
  .sb-foot { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .sb-quick { margin: 4px 0 6px; }
  .topbar { height: var(--topbar-h); padding: 0 20px 0 24px; gap: 12px; }
  .topbar-search { display: flex; align-items: center; gap: 10px; width: min(440px, 40vw); height: 36px; padding: 0 10px 0 12px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); color: var(--text-3); font-size: 0.92em; transition: border-color .15s; }
  .topbar-search:hover { border-color: var(--border-2); color: var(--text-2); }
  .topbar-search .kbd { margin-left: auto; }
  .page { padding: 26px 32px 56px; }
  .page-title { font-size: 1.65em; }
  .bottom-nav, .fab { display: none; }
}
.nav-dot { display: none; }

/* ---------------- Superpositions ---------------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgb(3 7 15 / 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; animation: fadeIn .18s ease; }
[data-scheme="light"] .overlay { background: rgb(15 23 42 / 0.35); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(24px); opacity: .6; } }
@keyframes popIn { from { transform: translateY(8px) scale(.985); opacity: 0; } }
@keyframes slideIn { from { transform: translateX(40px); opacity: .4; } }
.overlay-modal { align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-height: calc(100dvh - 24px); background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: sheetUp .28s var(--ease); overflow: hidden; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-head-text { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.modal-icon { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-text); flex-shrink: 0; }
.modal-title { font-size: 1.06em; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-sub { font-size: 0.84em; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; flex-wrap: wrap; }
.modal-foot .spacer { flex: 1; }
@media (min-width: 720px) {
  .overlay-modal { align-items: center; padding: 24px; }
  .modal { border-radius: var(--radius-lg); border-bottom: 1px solid var(--border); max-height: calc(100dvh - 48px); animation: popIn .22s var(--ease); }
  .modal-sm { max-width: 440px; }
  .modal-md { max-width: 580px; }
  .modal-lg { max-width: 820px; }
  .modal-xl { max-width: 1080px; }
  .modal-foot { padding-bottom: 12px; }
}
.overlay-drawer { justify-content: flex-end; }
.drawer { width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; animation: sheetUp .28s var(--ease); overflow: hidden; }
@media (min-width: 720px) {
  .drawer { width: min(var(--drawer-w), 100vw - 40px); height: 100%; border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: slideIn .28s var(--ease); background: var(--surface); }
}
.drawer-head { display: flex; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 12px 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.drawer-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

.menu { position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 5px; animation: popIn .14s var(--ease); max-height: 70vh; overflow-y: auto; }
[data-scheme="dark"] .menu { background: var(--surface-2); }
.menu-item { width: 100%; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 7px; font-size: 0.92em; color: var(--text); text-align: left; }
.menu-item .ic { color: var(--text-3); }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-3); outline: none; }
.menu-item.danger { color: #ef4444; }
.menu-item.danger .ic { color: #ef4444; }
.menu-item:disabled { opacity: .45; }
.menu-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-check { color: var(--accent-text) !important; }
.menu-hint { font-size: 0.8em; color: var(--text-3); }
.menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
.menu-header { padding: 8px 10px 4px; font-size: 0.72em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.menu-dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--t)); margin: 0 3px; flex-shrink: 0; }
.menu-trigger { display: inline-flex; }

.toasts { position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 24px); max-width: 440px; pointer-events: none; }
@media (min-width: 1024px) { .toasts { left: auto; right: 24px; transform: none; bottom: 24px; align-items: flex-end; } }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-radius: var(--radius); background: #111827; color: #F9FAFB; box-shadow: var(--shadow-lg); font-size: 0.92em; font-weight: 500; animation: popIn .22s var(--ease); max-width: 100%; border: 1px solid rgb(255 255 255 / .08); }
[data-scheme="dark"] .toast { background: #F3F5F9; color: #0B1220; border-color: transparent; }
.toast .ic { color: #22c55e; }
.toast.error .ic { color: #ef4444; }
.toast-action { margin-left: 6px; padding: 5px 10px; border-radius: 7px; font-weight: 700; color: #93C5FD; font-size: 0.92em; }
[data-scheme="dark"] .toast-action { color: #1D4ED8; }
.toast-action:hover { background: rgb(127 127 127 / .15); }

/* ---------------- Palette de commandes ---------------- */
.overlay-palette { align-items: flex-start; justify-content: center; padding: 10vh 12px 12px; }
.palette { width: 100%; max-width: 620px; background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; animation: popIn .16s var(--ease); display: flex; flex-direction: column; max-height: 70vh; }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); }
.palette-input .ic { color: var(--text-3); }
.palette-input input { flex: 1; height: 54px; background: transparent; border: 0; outline: none; font-size: 1.05em; }
.palette-list { overflow-y: auto; padding: 6px; }
.palette-group { padding: 10px 10px 4px; font-size: 0.72em; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.palette-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border-radius: 9px; text-align: left; }
.palette-item.active { background: var(--accent-soft); }
.palette-item .pi-icon { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text-2); flex-shrink: 0; border: 1px solid var(--border); }
.palette-item.active .pi-icon { color: var(--accent-text); }
.pi-title { font-weight: 550; }
.pi-sub { font-size: 0.8em; color: var(--text-3); }
.palette-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 0.78em; color: var(--text-3); }
.palette-foot span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------------- Listes & tableaux ---------------- */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .search { flex: 1 1 240px; max-width: 420px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 14px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); font-size: 0.85em; font-weight: 600; color: var(--text-2); white-space: nowrap; transition: all .15s; }
.chip:hover { border-color: var(--border-2); color: var(--text); }
.chip.active { background: var(--accent-soft); border-color: rgb(var(--accent-rgb) / .45); color: var(--text); }
.chip-count { font-size: 0.86em; color: var(--text-3); font-weight: 600; }
.chip .badge-dot { background: rgb(var(--t)); }

.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.93em; }
.table th { position: sticky; top: 0; z-index: 1; text-align: left; font-size: 0.78em; font-weight: 600; color: var(--text-3); padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none; }
.table th.sortable { cursor: pointer; }
.table th.sortable:hover { color: var(--text); }
.table th .sort-ic { display: inline-block; vertical-align: -2px; margin-left: 3px; opacity: .8; }
.table td { padding: var(--row-pad) 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { transition: background-color .12s; }
.table tbody tr.clickable { cursor: pointer; }
.table tbody tr.clickable:hover { background: var(--surface-2); }
.table tbody tr.selected { background: var(--accent-soft); }
.table .td-check { width: 40px; padding-right: 0; }
.table .right { text-align: right; white-space: nowrap; }
.table .td-actions { width: 1%; white-space: nowrap; text-align: right; }
.cell-main { font-weight: 600; }
.cell-sub { font-size: 0.84em; color: var(--text-3); }

.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; width: 100%; transition: background-color .12s; min-width: 0; }
.list-item:last-child { border-bottom: 0; }
.list-item.clickable { cursor: pointer; }
.list-item.clickable:hover { background: var(--surface-2); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-sub { font-size: 0.84em; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

.bulk-bar { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 20; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 8px 8px 14px; margin-top: 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border-2); box-shadow: var(--shadow-md); animation: popIn .2s var(--ease); }
@media (min-width: 1024px) { .bulk-bar { bottom: 16px; } }

/* ---------------- Pipeline (kanban) ---------------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; align-items: start; }
.kb-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-height: 200px; max-height: calc(100dvh - 230px); scroll-snap-align: start; transition: border-color .15s, background-color .15s; }
.kb-col.drop { border-color: var(--accent); background: var(--accent-soft); }
.kb-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
.kb-title { font-weight: 650; font-size: 0.92em; }
.kb-count { font-size: 0.78em; font-weight: 700; color: var(--text-3); background: var(--surface-3); padding: 1px 7px; border-radius: 99px; }
.kb-sum { margin-left: auto; font-size: 0.78em; color: var(--text-3); font-weight: 600; }
.kb-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
.kb-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; cursor: grab; text-align: left; transition: border-color .15s, box-shadow .15s, transform .15s; width: 100%; }
[data-scheme="light"] .kb-card { background: #fff; }
.kb-card:hover { border-color: var(--border-2); box-shadow: var(--shadow-md); }
.kb-card.dragging { opacity: .45; }
.kb-card-title { font-weight: 600; font-size: 0.93em; }
.kb-card-sub { font-size: 0.8em; color: var(--text-3); }
.kb-card-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; font-size: 0.78em; color: var(--text-3); }
.kb-empty { font-size: 0.82em; color: var(--text-3); text-align: center; padding: 18px 8px; border: 1px dashed var(--border-2); border-radius: var(--radius); }

/* ---------------- Aujourd'hui ---------------- */
.hero { position: relative; overflow: hidden; border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 20px; background:
  radial-gradient(120% 140% at 100% 0%, rgb(var(--accent-rgb) / 0.22) 0%, transparent 55%),
  linear-gradient(180deg, var(--surface), var(--surface)); box-shadow: var(--shadow-sm); }
.hero-grid { display: grid; gap: 18px; align-items: center; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .hero-grid { grid-template-columns: 1.3fr 1fr; } }
.hero-hello { font-size: 1.55em; font-weight: 750; letter-spacing: -0.025em; line-height: 1.2; }
.hero-date { color: var(--text-3); font-weight: 500; margin-top: 2px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hs { background: rgb(var(--bg-rgb) / 0.45); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
[data-scheme="light"] .hs { background: rgb(255 255 255 / .7); }
.hs-v { font-size: 1.35em; font-weight: 750; letter-spacing: -0.02em; }
.hs-l { font-size: 0.76em; color: var(--text-3); font-weight: 500; }
.session-cta { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); width: 100%; text-align: left; box-shadow: 0 12px 30px -12px rgb(var(--accent-rgb) / 0.9); transition: filter .15s, transform .1s; }
.session-cta:hover { filter: brightness(1.07); }
.session-cta:active { transform: translateY(1px); }
.session-cta:disabled { opacity: .6; filter: grayscale(.4); }
.session-cta-icon { width: 42px; height: 42px; border-radius: 12px; background: rgb(255 255 255 / .18); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.session-cta-t { font-weight: 750; font-size: 1.02em; }
.session-cta-s { font-size: 0.82em; opacity: .85; }
.layout-2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .layout-2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; } }
.layout-2b { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .layout-2b { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.queue-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background-color .12s; }
.queue-item:last-child { border-bottom: 0; }
.queue-item:hover { background: var(--surface-2); }
.queue-time { width: 54px; flex-shrink: 0; text-align: center; font-size: 0.8em; font-weight: 700; color: var(--text-2); line-height: 1.2; }
.queue-time.late { color: #ef4444; }
.call-btn { width: 38px; height: 38px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-text); flex-shrink: 0; transition: background-color .15s, color .15s; }
.call-btn:hover { background: var(--accent); color: var(--on-accent); }
.task-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.task-row:last-child { border-bottom: 0; }
.task-row.done .task-title { text-decoration: line-through; color: var(--text-3); }
.task-title { font-weight: 550; }
.task-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 0.8em; color: var(--text-3); margin-top: 2px; }

/* ---------------- Agenda ---------------- */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-title { font-weight: 700; font-size: 1.08em; min-width: 0; }
.week { display: grid; grid-template-columns: 52px repeat(7, minmax(110px, 1fr)); min-width: 820px; }
.week-wrap { overflow: auto; max-height: calc(100dvh - 250px); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.wk-dayhead { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: center; font-size: 0.8em; color: var(--text-3); font-weight: 600; border-left: 1px solid var(--border); cursor: pointer; }
.wk-dayhead.today { color: var(--accent-text); }
.wk-dayhead .d { font-size: 1.5em; color: var(--text); font-weight: 700; line-height: 1.2; }
.wk-dayhead.today .d { color: var(--accent-text); }
.wk-corner { position: sticky; top: 0; left: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--border); }
.wk-hour { position: sticky; left: 0; z-index: 2; background: var(--surface); font-size: 0.72em; color: var(--text-3); text-align: right; padding: 4px 8px 0 0; height: 56px; border-top: 1px solid var(--border); }
.wk-cell { height: 56px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); padding: 3px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; transition: background-color .12s; min-width: 0; }
.wk-cell:hover { background: var(--surface-2); }
.wk-cell.today { background: rgb(var(--accent-rgb) / 0.04); }
.wk-allday { min-height: 40px; height: auto; }
.ev { display: flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 6px; font-size: 0.74em; font-weight: 600; background: rgb(var(--t) / 0.16); color: var(--tt); border-left: 3px solid rgb(var(--t)); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; min-width: 0; width: 100%; }
.ev:hover { background: rgb(var(--t) / 0.26); }
.ev-t { opacity: .8; font-weight: 700; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
.mo-dow { padding: 8px; font-size: 0.74em; color: var(--text-3); font-weight: 600; text-align: center; border-bottom: 1px solid var(--border); }
.mo-cell { min-height: 92px; padding: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; transition: background-color .12s; }
.mo-cell:nth-child(7n) { border-right: 0; }
.mo-cell:hover { background: var(--surface-2); }
.mo-cell.out { opacity: .45; }
.mo-num { font-size: 0.8em; font-weight: 600; color: var(--text-2); width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
.mo-cell.today .mo-num { background: var(--accent); color: var(--on-accent); }
.mo-more { font-size: 0.72em; color: var(--text-3); font-weight: 600; padding-left: 4px; }
@media (max-width: 719px) {
  .mo-cell { min-height: 58px; padding: 4px; }
  .mo-cell .ev { display: none; }
  .mo-dots { display: flex; gap: 3px; flex-wrap: wrap; padding: 2px; }
}
.mo-dots { display: none; }
.mo-dot { width: 6px; height: 6px; border-radius: 50%; background: rgb(var(--t)); }
.day-list .slot { display: flex; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); align-items: center; }
.slot-h { width: 48px; font-size: 0.82em; color: var(--text-3); font-weight: 600; flex-shrink: 0; }
.slot-empty { flex: 1; height: 30px; border-radius: 8px; border: 1px dashed transparent; display: flex; align-items: center; padding: 0 10px; font-size: 0.8em; color: var(--text-3); cursor: pointer; }
.slot-empty:hover { border-color: var(--border-2); color: var(--text-2); }
.quick-dates { display: flex; flex-wrap: wrap; gap: 6px; }
.quick-dates button { height: 30px; padding: 0 12px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); font-size: 0.84em; font-weight: 600; color: var(--text-2); transition: all .15s; }
.quick-dates button:hover { border-color: var(--accent); color: var(--text); }
.quick-dates button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.when-preview { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; font-size: 0.9em; }

/* ---------------- Fiche prospect ---------------- */
.p-hero { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
.p-name { font-size: 1.35em; font-weight: 750; letter-spacing: -0.02em; line-height: 1.2; }
.p-actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
.p-action { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); font-size: 0.76em; font-weight: 600; color: var(--text-2); transition: all .15s; }
.p-action:hover { border-color: var(--border-2); color: var(--text); background: var(--surface-3); text-decoration: none; }
.p-action .ic { color: var(--accent-text); }
.p-action.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.p-action.primary .ic { color: var(--on-accent); }
.p-action.disabled { opacity: .45; pointer-events: none; }
.p-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.p-section:last-child { border-bottom: 0; }
.p-section-title { font-size: 0.74em; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 0.92em; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.timeline { position: relative; }
.tl-item { position: relative; display: flex; gap: 12px; padding-bottom: 14px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 1px; background: var(--border-2); }
.tl-item:last-child::before { display: none; }
.tl-icon { width: 27px; height: 27px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgb(var(--t) / .14); color: var(--tt); box-shadow: 0 0 0 3px var(--surface); }
.tl-body { flex: 1; min-width: 0; padding-top: 3px; }
.tl-title { font-size: 0.9em; font-weight: 600; }

/* ---------------- Écran d'appel ---------------- */

.hbar-sub { color: var(--text-3); font-weight: 500; }

.hbar-track svg { display: block; }

.funnel { display: flex; flex-direction: column; gap: 10px; }
.funnel-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px 58px; gap: 10px; align-items: center; font-size: 0.88em; }

.rec-orb.on { background: rgb(244 63 94 / .16); color: #fb7185; box-shadow: 0 0 0 8px rgb(244 63 94 / .08), 0 0 0 1px rgb(244 63 94 / .5); animation: livePulse 1.6s ease-in-out infinite; }
