  ring_.style.left = (r.left - 4) + "px"; ring_.style.top = (r.top - 4) + "px"; ring_.style.width = (r.width + 8) + "px"; ring_.style.height = (r.height + 8) + "px";
  let b = $("#tour-bubble"); if (!b){ b = document.createElement("div"); b.id = "tour-bubble"; b.className = "tour-bubble"; b.setAttribute("role", "dialog"); b.setAttribute("aria-label", "Visite guidée"); document.body.appendChild(b); }
  b.innerHTML = `<div class="tb-step">Visite guidée · ${tourStep + 1}/${TOUR.length}</div><h3>${esc(step[1])}</h3><p>${esc(step[2])}</p><div class="tb-actions"><button type="button" class="btn ghost sm" data-act="tour-end">Passer la visite</button><span class="spacer"></span><button type="button" class="btn primary sm" data-act="tour-next">${tourStep === TOUR.length - 1 ? "Terminer" : "Suivant"}</button></div>`;
  const bw = b.offsetWidth, bh = b.offsetHeight;
  let left, top;
  if (r.left < 240 && innerWidth > 820){ left = r.right + 16; top = clamp(r.top - 12, 8, innerHeight - bh - 8); }
  else if (r.top > innerHeight / 2){ left = clamp(r.left + r.width / 2 - bw / 2, 12, innerWidth - bw - 12); top = r.top - bh - 14; }
  else { left = clamp(r.left, 12, innerWidth - bw - 12); top = r.bottom + 14; }
  b.style.left = left + "px"; b.style.top = Math.max(8, top) + "px";
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
const ACT = {
  go:t => go(t.dataset.view),
  goto:t => { if (t.dataset.fund){ UI.pipeFund = t.dataset.fund; UI.pipeMode = "list"; } go(t.dataset.to); },
  seg:t => {
    const n = t.dataset.name, v = t.dataset.val;
    if (n === "period"){ UI.period = v; UI.animateKpi = true; }
    else if (n === "chart") UI.chartMode = v;
    else if (n === "pipeMode") UI.pipeMode = v;
    else if (n === "clientsTab"){ UI.clientsTab = v; UI.cSort = {key:"name", dir:1}; }
    else if (n === "tasksFilter") UI.tasksFilter = v;
    else if (n === "sessTab") UI.sessTab = v;
    else if (n === "qFilter") UI.qFilter = v;
    else if (n === "noteType"){ UI.noteType = v; $$('[data-name="noteType"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === v))); return; }
    else if (n === "theme"){ STATE.settings.theme = v; save(); }
    render();
  },
  palette:() => openPalette(), help:() => openHelp(), "toggle-theme":() => toggleTheme(),
  "new-deal":t => openNewDeal({co:t.dataset.co, person:t.dataset.person, session:t.dataset.session, training:t.dataset.training}),
  "new-co":() => openNewCompany(), "new-contact":t => openNewContact(t.dataset.co), "new-session":t => openNewSession(t.dataset.training),
  "open-deal":(t, e) => { if (e) e.preventDefault(); if (t.dataset.id) openDrawer("deal", t.dataset.id); },
  "open-co":(t, e) => { e.preventDefault(); if (t.dataset.id) openDrawer("co", t.dataset.id); },
  "open-contact":(t, e) => { e.preventDefault(); openDrawer("contact", t.dataset.id); },
  "open-session":(t, e) => { if (e) e.preventDefault(); if (t.dataset.id) openDrawer("session", t.dataset.id); },
  "open-training":(t, e) => { if (e) e.preventDefault(); if (t.dataset.id) openDrawer("training", t.dataset.id); },
  "close-drawer":() => closeDrawer(), "close-modal":() => closeModal(),
  "move-menu":t => openMoveMenu(t, t.dataset.id),
  "move-to":t => { closeMenu(); moveDeal(t.dataset.id, t.dataset.stage); },
  edit:t => startEdit(t),
  sort:t => { const k = t.dataset.key; UI.sort = {key:k, dir:UI.sort.key === k ? -UI.sort.dir : 1}; renderBoard(); },
  csort:t => { const k = t.dataset.key; UI.cSort = {key:k, dir:UI.cSort.key === k ? -UI.cSort.dir : 1}; renderClientsList(); },
  "toggle-task":t => toggleTask(t.dataset.id),
  "q-toggle":t => toggleQ(t.dataset.id, t.dataset.k),
  "sess-shift":t => shiftSession(t.dataset.id),
  "archive-task":t => { const x = STATE.tasks.find(y => y.id === t.dataset.id); if (!x) return; x.archived = true; save(); render(); toast("Tâche supprimée", () => { x.archived = false; save(); render(); }); },
  "toggle-done":() => { UI.showDone = !UI.showDone; renderTasksList(); },
  "archive-deal":t => archive("deal", t.dataset.id), "archive-co":t => archive("co", t.dataset.id), "archive-contact":t => archive("contact", t.dataset.id), "archive-session":t => archive("session", t.dataset.id),
  "add-note":t => {
    const ta = $("#note-text"), text = ta ? ta.value.trim() : ""; if (!text){ if (ta) ta.focus(); return; }
    const [kind, id] = t.dataset.target.split(":"), a = {type:UI.noteType, text};
    if (kind === "deal"){ const d = dealById(id); a.dealId = id; a.companyId = d.companyId; } else if (kind === "co") a.companyId = id; else if (kind === "session") a.sessionId = id; else { a.contactId = id; const c = contactById(id); if (c && c.companyId) a.companyId = c.companyId; }
    logActivity(a); ta.value = ""; save(); render(); toast("Ajouté à l'historique");
  },
  ai:t => openAI(t.dataset.id, t.dataset.kind, t.dataset.task),
  print:() => window.print(),
  swatch:t => { STATE.settings.color = t.dataset.color; save(); render(); },
  "stage-up":t => moveStage(t.dataset.id, -1), "stage-down":t => moveStage(t.dataset.id, 1),
  export:t => exportCSV(t.dataset.what), import:() => openImport(),
  "reset-demo":() => confirmModal("Réinitialiser la démo ?", "Toutes les données de démonstration sont régénérées à la date du jour. Vos modifications seront perdues.", "Réinitialiser", resetDemo),
  "clear-all":() => confirmModal("Vider toutes les données ?", "Demandes, sessions, entreprises, contacts, tâches et historique seront supprimés. Les réglages (marque, étapes, équipe, catalogue, financements) sont conservés. Action irréversible.", "Tout vider", clearAll),
  "tour-start":() => { if (UI.view !== "dashboard") go("dashboard"); setTimeout(startTour, 60); },
  "tour-next":() => { tourStep++; if (tourStep >= TOUR.length) endTour(); else showTour(); },
  "tour-end":() => endTour(),
};
function moveStage(id, dir){ const a = STATE.stages, i = a.findIndex(s => s.id === id), j = i + dir; if (i < 0 || j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); render(); }
let saveTimer = null; const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); };
const CHG = {
  "pipe-owner":t => { UI.pipeOwner = t.value; renderBoard(); }, "pipe-training":t => { UI.pipeTraining = t.value; renderBoard(); }, "pipe-fund":t => { UI.pipeFund = t.value; renderBoard(); },
  "clients-opco":t => { UI.clientsOpco = t.value; renderClientsList(); },
  "deal-stage":t => moveDeal(t.dataset.id, t.value),
  "setting-num":t => { STATE.settings[t.dataset.k] = Math.max(1, Math.round(parseNum(t.value))); syncAutoRelances(); save(); render(); toast(t.dataset.k === "convocDays" ? "Échéance des convocations mise à jour" : "Relances recalculées"); },
  fin:t => { STATE.settings.fin[t.dataset.k] = Math.max(0, parseNum(t.value)); save(); render(); toast("Règles de financement enregistrées — restes à charge recalculés"); },
  "current-user":t => { STATE.settings.currentUserId = t.value; save(); render(); },
  "stage-name":t => { const s = stageById(t.dataset.id); if (t.value.trim()){ s.name = t.value.trim(); save(); render(); } },
  "stage-prob":t => { const s = stageById(t.dataset.id); s.probability = clamp(Math.round(parseNum(t.value)), 0, 100); save(); render(); },
  "user-name":t => { const u = userById(t.dataset.id); if (t.value.trim()){ u.name = t.value.trim(); save(); render(); } },
  "user-role":t => { const u = userById(t.dataset.id); u.role = t.value.trim(); save(); render(); },
};
const INP = {
  "pipe-q":t => { UI.pipeQ = t.value; renderBoard(); }, "clients-q":t => { UI.clientsQ = t.value; renderClientsList(); }, "tasks-q":t => { UI.tasksQ = t.value; renderTasksList(); },
  setting:t => { STATE.settings[t.dataset.k] = t.value; saveSoon(); renderShell(); const p = $(".preview-row b"); if (p && t.dataset.k === "brand") p.textContent = t.value; },
  "brand-color":t => { STATE.settings.color = t.value; saveSoon(); applyBrand(); $$(".swatch").forEach(s => s.setAttribute("aria-pressed", String(s.dataset.color.toLowerCase() === t.value.toLowerCase()))); },
};
document.addEventListener("click", e => {
  const m = $("#menu"); if (m && !m.contains(e.target) && !e.target.closest("[data-act=move-menu]")) closeMenu();
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener("change", e => { const t = e.target.closest("[data-change]"); if (t && CHG[t.dataset.change]) CHG[t.dataset.change](t, e); });
document.addEventListener("input", e => { const t = e.target.closest("[data-input]"); if (t && INP[t.dataset.input]) INP[t.dataset.input](t, e); });
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const fd = new FormData(f);
  if (f.dataset.form === "task-add") addTask(String(fd.get("title") || ""), String(fd.get("due") || ""), String(fd.get("deal") || ""));
  if (f.dataset.form === "deal-task") addTask(String(fd.get("title") || ""), String(fd.get("due") || ""), f.dataset.id);
});
/* Glisser-déposer HTML5 */
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-deal-id]"); if (!c) return; dragId = c.dataset.dealId; c.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(err){} closeMenu(); });
document.addEventListener("dragend", () => { dragId = null; $$(".dragging").forEach(x => x.classList.remove("dragging")); $$(".drop-hover").forEach(x => x.classList.remove("drop-hover")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest("[data-stage-id]"); if (!col || !dragId) return; e.preventDefault(); if (!col.classList.contains("drop-hover")){ $$(".drop-hover").forEach(x => x.classList.remove("drop-hover")); col.classList.add("drop-hover"); } });
document.addEventListener("drop", e => { const col = e.target.closest && e.target.closest("[data-stage-id]"); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; col.classList.remove("drop-hover"); moveDeal(id, col.dataset.stageId); });
/* Clavier */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toUpperCase(), typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape"){
    if (tourStep >= 0){ endTour(); return; }
    if ($("#palette")){ closePalette(); return; }
    if ($("#menu")){ closeMenu(); return; }
    if ($("#modal")){ closeModal(); return; }
    if (UI.drawer){ closeDrawer(); return; }
    if (typing) e.target.blur();
    return;
  }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "note-text"){ e.preventDefault(); const b = $("[data-act=add-note]"); if (b) b.click(); return; }
  if ((e.key === "Enter" || e.key === " ") && !typing && e.target.matches && e.target.matches("[data-act=open-deal],[data-act=open-co],[data-act=open-contact],[data-act=open-session],[data-act=open-training]") && e.target.tagName !== "BUTTON" && e.target.tagName !== "A"){ e.preventDefault(); e.target.click(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($("#modal") || $("#palette")) return;
  if (e.key === "n" || e.key === "N"){ e.preventDefault(); openNewDeal(); }
  else if (e.key === "/"){ e.preventDefault(); let f = $("#filter-q"); if (!f){ go("pipeline"); f = $("#filter-q"); } if (f) f.focus(); }
  else if (e.key === "?"){ e.preventDefault(); openHelp(); }
});
/* Visite guidée : jamais bloquante — tout clic en dehors de la bulle la ferme */
document.addEventListener("pointerdown", e => { if (tourStep >= 0 && !e.target.closest("#tour-bubble")) endTour(); }, true);
let rsT = null;
window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (UI.view === "dashboard") drawWeekChart(); if (tourStep >= 0) showTour(); closeMenu(); }, 150); });

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
window.CRM = {
  state:() => STATE,
  move:(dealId, stageId) => moveDeal(dealId, stageId),
  go:view => go(view),
  open:(kind, id) => openDrawer(kind, id),
  reset:() => resetDemo(),
};
(function boot(){
  STATE = load();
  if (!STATE){ STATE = seed(); }
  normalize(); syncAutoRelances(); save();
  applyTheme(); applyBrand(); renderShell();
  const noTour = /[?&]visite=0\b/.test(location.search);
  setTimeout(() => {
    if (!UI.rendered){ render(); const v = $("#view"); v.classList.add("view-enter"); }
    if (!STATE.settings.tourDone && !noTour) setTimeout(() => { if (tourStep < 0 && !$("#modal") && !$("#palette") && !UI.drawer) startTour(); }, 700);
  }, 220);
})();
})();
</script>
</body>
