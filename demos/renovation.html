    openTasks().filter(t => match(t.title)).slice(0, 4).forEach(t => out.push({g:"Tâches", label:t.title, sub:fmtDateShort(t.dueDate), icon:"tasks", run:() => t.dealId ? openDrawer("deal", t.dealId) : go("tasks")}));
  }
  actions.filter(a => match(a[0])).forEach(a => out.push({g:"Actions", label:a[0], sub:a[2] ? a[2] : "", icon:a[1], run:a[3]}));
  const order = ["Actions","Chantiers","Clients","Contacts","Tâches"]; if (nq) order.push(order.shift());
  PAL.items = order.flatMap(g => out.filter(o => o.g === g));
  const list = $("#pal-list"); if (!list) return;
  if (!PAL.items.length){ list.innerHTML = `<div class="pal-empty">Aucun résultat pour « ${esc(q)} ».</div>`; return; }
  let html = "", lastG = "";
  PAL.items.forEach((it, i) => { if (it.g !== lastG){ html += `<div class="pal-group">${esc(it.g)}</div>`; lastG = it.g; } html += `<div class="pal-item" role="option" data-pi="${i}" id="pi-${i}">${ic(it.icon,17)}<span class="pi-label">${esc(it.label)}</span><span class="pi-sub">${esc(it.sub || "")}</span></div>`; });
  list.innerHTML = html; paintPal();
}
function paintPal(){ $$(".pal-item").forEach(el => { const on = +el.dataset.pi === PAL.idx; el.classList.toggle("active", on); el.setAttribute("aria-selected", String(on)); if (on) el.scrollIntoView({block:"nearest"}); }); }
function runPal(i){ const it = PAL.items[i]; if (!it) return; closePalette(); it.run(); }

/* ---------- Visite guidée (non bloquante) ---------- */
const TOUR = [
  ['[data-view="pipeline"]', "Vos chantiers, de la demande à la facture", "Glissez les cartes d'une étape à l'autre (ou « Déplacer vers… » sur mobile). Chaque devis envoyé programme ses relances à J+5 et J+12."],
  ['[data-view="aides"]', "Le simulateur d'aides", "MaPrimeRénov' et prime CEE selon la catégorie de revenus : montrez au client son reste à charge pendant le rendez-vous."],
  ['[data-view="planning"]', "Le planning des équipes", "Vos équipes de pose sur une ou deux semaines, chantiers planifiés et en cours, acomptes à surveiller."],
  ["#search-btn", "Tout retrouver en un geste", "Ctrl K (ou ⌘ K) : chantiers, clients, contacts, tâches et actions rapides."],
  ['[data-view="settings"]', "À vos couleurs", "Nom, couleur de marque, étapes, équipe et barème des aides : la démo se personnalise devant vous."],
];
let tourStep = -1;
function startTour(){ tourStep = 0; showTour(); }
function endTour(){ tourStep = -1; ["#tour-ring","#tour-bubble"].forEach(s => { const e = $(s); if (e) e.remove(); }); if (STATE && !STATE.settings.tourDone){ STATE.settings.tourDone = true; save(); } }
function showTour(){
  const step = TOUR[tourStep]; if (!step){ endTour(); return; }
  const el = $(step[0]); if (!el){ endTour(); return; }
  if (innerWidth <= 820) el.scrollIntoView({block:"nearest", inline:"center"});
  const r = el.getBoundingClientRect();
  let ring = $("#tour-ring"); if (!ring){ ring = document.createElement("div"); ring.id = "tour-ring"; ring.className = "tour-ring"; document.body.appendChild(ring); }
  ring.style.left = (r.left - 4) + "px"; ring.style.top = (r.top - 4) + "px"; ring.style.width = (r.width + 8) + "px"; ring.style.height = (r.height + 8) + "px";
  let b = $("#tour-bubble"); if (!b){ b = document.createElement("div"); b.id = "tour-bubble"; b.className = "tour-bubble"; b.setAttribute("role", "dialog"); b.setAttribute("aria-label", "Visite guidée"); document.body.appendChild(b); }
  b.innerHTML = `<div class="tb-step">Visite guidée · ${tourStep + 1}/${TOUR.length}</div><h3>${esc(step[1])}</h3><p>${esc(step[2])}</p><div class="tb-actions"><button type="button" class="btn ghost sm" data-act="tour-end">Passer la visite</button><span class="spacer"></span><button type="button" class="btn primary sm" data-act="tour-next">${tourStep === TOUR.length - 1 ? "Terminer" : "Suivant"}</button></div>`;
  const bw = b.offsetWidth, bh = b.offsetHeight;
  let left, top;
  if (r.left < 240 && innerWidth > 820){ left = r.right + 16; top = clamp(r.top - 12, 8, innerHeight - bh - 8); }
  else if (r.top > innerHeight / 2){ left = clamp(r.left + r.width / 2 - bw / 2, 12, innerWidth - bw - 12); top = r.top - bh - 14; }
  else { left = clamp(r.left, 12, innerWidth - bw - 12); top = r.bottom + 14; }
  b.style.left = left + "px"; b.style.top = Math.max(8, top) + "px";
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
const ACT = {
  go:t => go(t.dataset.view), goto:t => go(t.dataset.to),
  seg:t => {
    const n = t.dataset.name, v = t.dataset.val;
    if (n === "period"){ UI.period = v; UI.animateKpi = true; }
    else if (n === "chart") UI.chartMode = v;
    else if (n === "pipeMode") UI.pipeMode = v;
    else if (n === "span"){ UI.plan.span = +v; }
    else if (n === "clientsTab"){ UI.clientsTab = v; UI.cSort = {key:"name", dir:1}; }
    else if (n === "tasksFilter") UI.tasksFilter = v;
    else if (n === "noteType"){ UI.noteType = v; $$('[data-name="noteType"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === v))); return; }
    else if (n === "theme"){ STATE.settings.theme = v; save(); }
    else if (n === "sim-mode"){ simSet(t, "mode", v); save(); render(); return; }
    render();
  },
  palette:() => openPalette(), help:() => openHelp(), "toggle-theme":() => toggleTheme(),
  "new-deal":t => openNewDeal(t.dataset.hh), "new-hh":() => openNewHousehold(), "new-contact":t => openNewContact(t.dataset.hh),
  "open-deal":(t, e) => { if (e) e.preventDefault(); if (t.dataset.id) openDrawer("deal", t.dataset.id); },
  "open-hh":(t, e) => { e.preventDefault(); if (t.dataset.id) openDrawer("hh", t.dataset.id); },
  "open-contact":(t, e) => { e.preventDefault(); openDrawer("contact", t.dataset.id); },
  "close-drawer":() => closeDrawer(), "close-modal":() => closeModal(), "close-present":() => closePresent(),
  "move-menu":t => openMoveMenu(t, t.dataset.id),
  "move-to":t => { closeMenu(); moveDeal(t.dataset.id, t.dataset.stage); },
  edit:t => startEdit(t),
  sort:t => { const k = t.dataset.key; UI.sort = {key:k, dir:UI.sort.key === k ? -UI.sort.dir : 1}; renderBoard(); },
  csort:t => { const k = t.dataset.key; UI.cSort = {key:k, dir:UI.cSort.key === k ? -UI.cSort.dir : 1}; renderClientsList(); },
  "toggle-task":t => toggleTask(t.dataset.id),
  "archive-task":t => { const x = STATE.tasks.find(y => y.id === t.dataset.id); if (!x) return; x.archived = true; save(); render(); toast("Tâche supprimée", () => { x.archived = false; save(); render(); }); },
  "toggle-done":() => { UI.showDone = !UI.showDone; renderTasksList(); },
  "archive-deal":t => archive("deal", t.dataset.id), "archive-hh":t => archive("hh", t.dataset.id), "archive-contact":t => archive("contact", t.dataset.id),
  "add-note":t => {
    const ta = $("#note-text"), text = ta ? ta.value.trim() : ""; if (!text){ if (ta) ta.focus(); return; }
    const [kind, id] = t.dataset.target.split(":"), a = {type:UI.noteType, text};
    if (kind === "deal"){ const d = dealById(id); a.dealId = id; a.householdId = d.householdId; } else if (kind === "hh") a.householdId = id; else { a.contactId = id; const c = contactById(id); if (c && c.householdId) a.householdId = c.householdId; }
    logActivity(a); ta.value = ""; save(); render(); toast("Ajouté à l'historique");
  },
  ai:t => openAI(t.dataset.id, t.dataset.kind, t.dataset.task),
  present:t => openPresent(t.dataset.id), print:() => window.print(),
  "deposit-received":t => { const d = dealById(t.dataset.id); if (!d) return; const prev = d.depositPaid; d.depositPaid = depositDue(d); d.depositAt = today(); logActivity({dealId:d.id, householdId:d.householdId, type:"note", text:`Acompte de ${fmtEUR(d.depositPaid)} reçu.`}); save(); render(); toast("Acompte enregistré", () => { d.depositPaid = prev; save(); render(); }); },
  invoice:t => moveDeal(t.dataset.id, "facture"),
  "plan-deal":t => openPlanModal(t.dataset.id),
  "plan-shift":t => { UI.plan.start = addDays(UI.plan.start || mondayOf(today()), (+t.dataset.dir) * 7); render(); },
  "plan-today":() => { UI.plan.start = mondayOf(today()); render(); },
  sim:t => { simSet(t, t.dataset.k, t.dataset.v); save(); render(); },
  "open-sim":t => { UI.simDealId = t.dataset.id; closeDrawer(); go("aides"); },
  "pick-sim":t => { UI.simDealId = t.dataset.id; render(); window.scrollTo({top:0, behavior:"smooth"}); },
  "rfr-calc":t => {
    const p = parseNum($("#rfr-p").value) || 1, r = parseNum($("#rfr-v").value), c = catFromRfr(p, r), out = $("#rfr-res");
    out.innerHTML = `Catégorie : ${catBadge(c)} <button type="button" class="btn sm" data-act="sim" data-k="cat" data-v="${c}">Appliquer</button>`;
  },
  "apply-cat":(t, e) => { e.preventDefault(); const h = hhById(t.dataset.id); if (h){ h.cat = t.dataset.cat; save(); render(); toast("Catégorie mise à jour"); } },
  swatch:t => { STATE.settings.color = t.dataset.color; save(); render(); },
  "stage-up":t => moveStage(t.dataset.id, -1), "stage-down":t => moveStage(t.dataset.id, 1),
  "bareme-reset":() => { STATE.settings.bareme = JSON.parse(JSON.stringify(BAREME_DEFAULT)); save(); render(); toast("Barème par défaut rétabli"); },
  export:t => exportCSV(t.dataset.what), import:() => openImport(),
  "reset-demo":() => confirmModal("Réinitialiser la démo ?", "Toutes les données de démonstration sont régénérées à la date du jour. Vos modifications seront perdues.", "Réinitialiser", resetDemo),
  "clear-all":() => confirmModal("Vider toutes les données ?", "Chantiers, clients, contacts, tâches et historique seront supprimés. Les réglages (marque, étapes, équipe, barème) sont conservés. Action irréversible.", "Tout vider", clearAll),
  "tour-start":() => { if (UI.view !== "dashboard") go("dashboard"); setTimeout(startTour, 60); },
  "tour-next":() => { tourStep++; if (tourStep >= TOUR.length) endTour(); else showTour(); },
  "tour-end":() => endTour(),
};
function moveStage(id, dir){ const a = STATE.stages, i = a.findIndex(s => s.id === id), j = i + dir; if (i < 0 || j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); render(); }
function simSet(el, k, v){
  const scope = el.closest("[data-sim-scope]"), dealId = scope ? scope.dataset.dealId : "";
  const d = dealId && dealById(dealId), h = d && hhOf(d), g = el.dataset.g;
  if (d){
    if (k === "cat" && h) h.cat = v; else if (k === "mode") d.aidMode = v; else if (k === "ht") d.amount = parseNum(v); else if (k === "tva") d.tva = parseNum(v);
    else if (k === "dpeBefore" && h) h.dpe = v; else if (k === "dpeTarget") d.dpeTarget = v;
    else if (k === "geste-on"){ d.gestes = (d.gestes || []).filter(x => x.key !== g); if (el.checked) d.gestes.push({key:g, qty:WORK[g] ? WORK[g].qty : 1}); }
    else if (k === "geste-qty"){ const x = (d.gestes || []).find(y => y.key === g); if (x) x.qty = parseNum(v); }
    d.updatedAt = new Date().toISOString();
  } else {
    const s = UI.sim;
    if (k === "cat") s.cat = v; else if (k === "mode") s.mode = v; else if (k === "ht") s.ht = parseNum(v); else if (k === "tva") s.tva = parseNum(v);
    else if (k === "dpeBefore") s.dpeBefore = v; else if (k === "dpeTarget") s.dpeTarget = v;
    else if (k === "geste-on"){ s.gestes = s.gestes.filter(x => x.key !== g); if (el.checked) s.gestes.push({key:g, qty:WORK[g] ? WORK[g].qty : 1}); }
    else if (k === "geste-qty"){ const x = s.gestes.find(y => y.key === g); if (x) x.qty = parseNum(v); }
  }
}
let saveTimer = null; const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); };
const CHG = {
  "pipe-owner":t => { UI.pipeOwner = t.value; renderBoard(); }, "pipe-type":t => { UI.pipeType = t.value; renderBoard(); },
  "clients-cat":t => { UI.clientsCat = t.value; renderClientsList(); },
  "deal-stage":t => moveDeal(t.dataset.id, t.value),
  sim:t => { simSet(t, t.dataset.k, t.value); save(); render(); },
  "sim-deal":t => { UI.simDealId = t.value; render(); },
  "setting-num":t => { STATE.settings[t.dataset.k] = Math.max(1, Math.round(parseNum(t.value))); syncAutoRelances(); save(); render(); toast("Relances recalculées"); },
  "current-user":t => { STATE.settings.currentUserId = t.value; save(); render(); },
  "stage-name":t => { const s = stageById(t.dataset.id); if (t.value.trim()){ s.name = t.value.trim(); save(); render(); } },
  "stage-prob":t => { const s = stageById(t.dataset.id); s.probability = clamp(Math.round(parseNum(t.value)), 0, 100); save(); render(); },
  "user-name":t => { const u = userById(t.dataset.id); if (t.value.trim()){ u.name = t.value.trim(); save(); render(); } },
  "user-role":t => { const u = userById(t.dataset.id); u.role = t.value.trim(); save(); render(); },
  bareme:t => {
    const B = STATE.settings.bareme, v = Math.max(0, parseNum(t.value)), i = +t.dataset.i, g = t.dataset.g;
    if (g === "_ecr") B.ecretement[i] = v; else if (g === "_amp") B.ampleur.taux[i] = v; else if (g === "_plaf") B.ampleur.plafonds[i] = v;
    else if (t.dataset.k === "plafond") B.gestes[g].plafond = v; else B.gestes[g][t.dataset.k][i] = v;
    save(); toast("Barème enregistré — simulations recalculées");
  },
  setting:t => { save(); },
};
const INP = {
  "pipe-q":t => { UI.pipeQ = t.value; renderBoard(); }, "clients-q":t => { UI.clientsQ = t.value; renderClientsList(); }, "tasks-q":t => { UI.tasksQ = t.value; renderTasksList(); },
  sim:t => { simSet(t, t.dataset.k, t.value); saveSoon(); refreshSim(); },
  setting:t => { STATE.settings[t.dataset.k] = t.value; saveSoon(); renderShell(); const p = $(".preview-row b"); if (p && t.dataset.k === "brand") p.textContent = t.value; },
  "brand-color":t => { STATE.settings.color = t.value; saveSoon(); applyBrand(); $$(".swatch").forEach(s => s.setAttribute("aria-pressed", String(s.dataset.color.toLowerCase() === t.value.toLowerCase()))); },
};
document.addEventListener("click", e => {
  const m = $("#menu"); if (m && !m.contains(e.target) && !e.target.closest("[data-act=move-menu]")) closeMenu();
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener("change", e => { const t = e.target.closest("[data-change]"); if (t && CHG[t.dataset.change]) CHG[t.dataset.change](t, e); });
document.addEventListener("input", e => { const t = e.target.closest("[data-input]"); if (t && INP[t.dataset.input]) INP[t.dataset.input](t, e); });
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const fd = new FormData(f);
  if (f.dataset.form === "task-add") addTask(String(fd.get("title") || ""), String(fd.get("due") || ""), String(fd.get("deal") || ""));
  if (f.dataset.form === "deal-task") addTask(String(fd.get("title") || ""), String(fd.get("due") || ""), f.dataset.id);
});
/* Glisser-déposer HTML5 */
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-deal-id]"); if (!c) return; dragId = c.dataset.dealId; c.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(err){} closeMenu(); });
document.addEventListener("dragend", () => { dragId = null; $$(".dragging").forEach(x => x.classList.remove("dragging")); $$(".drop-hover").forEach(x => x.classList.remove("drop-hover")); });
document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest("[data-stage-id]"); if (!col || !dragId) return; e.preventDefault(); if (!col.classList.contains("drop-hover")){ $$(".drop-hover").forEach(x => x.classList.remove("drop-hover")); col.classList.add("drop-hover"); } });
document.addEventListener("drop", e => { const col = e.target.closest && e.target.closest("[data-stage-id]"); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; col.classList.remove("drop-hover"); moveDeal(id, col.dataset.stageId); });
/* Clavier */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toUpperCase(), typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape"){
    if (tourStep >= 0){ endTour(); return; }
    if ($("#palette")){ closePalette(); return; }
    if ($("#menu")){ closeMenu(); return; }
    if ($("#modal")){ closeModal(); return; }
    if ($("#present")){ closePresent(); return; }
    if (UI.drawer){ closeDrawer(); return; }
    if (typing) e.target.blur();
    return;
  }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "note-text"){ e.preventDefault(); const b = $("[data-act=add-note]"); if (b) b.click(); return; }
  if (e.key === "Enter" && !typing && e.target.matches && e.target.matches("[data-act=open-deal],[data-act=open-hh],[data-act=open-contact],[data-act=pick-sim]") && e.target.tagName !== "BUTTON" && e.target.tagName !== "A"){ e.preventDefault(); e.target.click(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($("#modal") || $("#palette") || $("#present")) return;
  if (e.key === "n" || e.key === "N"){ e.preventDefault(); openNewDeal(); }
  else if (e.key === "/"){ e.preventDefault(); let f = $("#filter-q"); if (!f){ go("pipeline"); f = $("#filter-q"); } if (f) f.focus(); }
  else if (e.key === "?"){ e.preventDefault(); openHelp(); }
});
/* Visite guidée : jamais bloquante — tout clic en dehors de la bulle la ferme */
document.addEventListener("pointerdown", e => { if (tourStep >= 0 && !e.target.closest("#tour-bubble")) endTour(); }, true);
let rsT = null;
window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (UI.view === "dashboard") drawWeekChart(); if (UI.view === "aides") drawAidChart(); if (tourStep >= 0) showTour(); closeMenu(); }, 150); });

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
window.CRM = {
  state:() => STATE,
  move:(dealId, stageId) => moveDeal(dealId, stageId),
  reset:() => resetDemo(),
};
(function boot(){
  STATE = load();
  if (!STATE){ STATE = seed(); }
  normalize(); syncAutoRelances(); save();
  applyTheme(); applyBrand(); renderShell();
  const noTour = /[?&]visite=0\b/.test(location.search);
  setTimeout(() => {
    if (!UI.rendered){ render(); const v = $("#view"); v.classList.add("view-enter"); }
    if (!STATE.settings.tourDone && !noTour) setTimeout(() => { if (tourStep < 0 && !$("#modal") && !$("#palette") && !UI.drawer) startTour(); }, 700);
  }, 220);
})();
})();
</script>
